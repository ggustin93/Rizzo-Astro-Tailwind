# ==============================================================================
# netlify.toml
#
# Configuration for deploying the Astro site to Netlify.
# This file includes build settings and custom headers for performance.
# ==============================================================================

# --- Build Settings ---
# Specifies the command to build the site and the directory where the
# output will be located. Astro's defaults are used here.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# --- Redirects ---
# Cross-domain redirect: crizzo-avocate.be → rizzo-michiels.be
# Netlify alias domains serve the same site — they do NOT auto-redirect to the primary.
# This explicit HTTPS rule catches requests after Netlify's platform-level HTTP→HTTPS upgrade.
# Result: http://crizzo-avocate.be → (platform) → https://crizzo-avocate.be → (this rule) → https://rizzo-michiels.be
# GSC "Change of Address" tests HTTPS directly → single hop → validation passes.
[[redirects]]
  from = "https://crizzo-avocate.be/*"
  to   = "https://rizzo-michiels.be/:splat"
  status = 301
  force = true

# Primary redirect for humans - permanent redirect to French version
[[redirects]]
  from = "/"
  to = "/fr/"
  status = 301
  force = true

# Redirect old profil URLs to new equipe URLs (multi-lawyer transformation)
[[redirects]]
  from = "/fr/profil/*"
  to = "/fr/equipe/:splat"
  status = 301

[[redirects]]
  from = "/en/profil/*"
  to = "/en/equipe/:splat"
  status = 301

[[redirects]]
  from = "/it/profil/*"
  to = "/it/equipe/:splat"
  status = 301

# Redirect old single profil page to team overview
[[redirects]]
  from = "/fr/profil/"
  to = "/fr/equipe/"
  status = 301

[[redirects]]
  from = "/en/profil/"
  to = "/en/equipe/"
  status = 301

[[redirects]]
  from = "/it/profil/"
  to = "/it/equipe/"
  status = 301

# Redirect old profil without trailing slash
[[redirects]]
  from = "/fr/profil"
  to = "/fr/equipe/"
  status = 301

[[redirects]]
  from = "/en/profil"
  to = "/en/equipe/"
  status = 301

[[redirects]]
  from = "/it/profil"
  to = "/it/equipe/"
  status = 301

# --- Headers ---
# Custom headers to improve performance by leveraging browser caching.
[[headers]]
  # Apply these headers to all fingerprinted assets generated by Astro.
  # The ":hash" placeholder is a Netlify-specific feature that matches
  # the unique hash Astro adds to filenames (e.g., index.a1b2c3d4.js).
  for = "/_astro/*"
  [headers.values]
    # Cache assets in the browser for one year.
    # "public" allows intermediaries (like CDNs) to cache the resource.
    # "immutable" tells the browser that the file will never change,
    # so it doesn't need to re-validate it.
    Cache-Control = "public, max-age=31536000, immutable"

# Add bot-friendly headers to all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "all"
    X-Content-Type-Options = "nosniff"

# Add special headers for search engine bots to help them crawl effectively
[[headers]]
  for = "/"
  [headers.values]
    Vary = "User-Agent"
