# Redirection pour les navigateurs préférant l'anglais (mais pas les bots)
[[redirects]]
  from = "/"
  to = "/en/"
  status = 302
  force = true
  conditions = {Language = ["en"], Role = ["visitor"]}

# Redirection pour les navigateurs préférant l'italien (mais pas les bots)
[[redirects]]
  from = "/"
  to = "/it/"
  status = 302
  force = true
  conditions = {Language = ["it"], Role = ["visitor"]}

# Redirection par défaut pour les visiteurs humains
[[redirects]]
  from = "/"
  to = "/fr/"
  status = 302
  force = true
  conditions = {Role = ["visitor"]}

# Redirection simple pour tous les bots (sans conditions de langue)
[[redirects]]
  from = "/"
  to = "/fr/"
  status = 302
  force = true

[build.processing]
  skip_processing = false
[build.processing.images]
  compress = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "index, follow, all"