# --- Configuration de base pour Netlify ---

# Redirection de la page d'accueil (/) vers la version française (/fr/)
# Un statut 302 est utilisé, ce qui est idéal pour les redirections temporaires.
# Pour une redirection permanente (mieux pour le SEO à long terme), utilisez "status = 301".
[[redirects]]
  from = "/"
  to = "/fr/"
  status = 302
  force = true

# Activation de l'optimisation automatique des images par Netlify.
# Ceci compresse les images pour accélérer le site sans perte de qualité visible.
[build.processing]
  skip_processing = false
[build.processing.images]
  compress = true