# Redirection simple pour tous (bots et humains)
[[redirects]]
  from = "/"
  to = "/fr/"
  status = 302
  force = true

[build.processing]
  skip_processing = false
[build.processing.images]
  compress = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "index, follow, all"
    Cache-Control = "public, max-age=0, must-revalidate"