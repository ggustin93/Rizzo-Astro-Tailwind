[[redirects]]
  from = "/"
  to = "/fr"
  status = 302
  force = true

[build.processing]
  skip_processing = false
[build.processing.images]
  compress = true

# Forcer l'indexation via headers spécifiques pour les moteurs de recherche
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "index, follow"

# Ajouter cette nouvelle règle spécifique pour Googlebot qui aura priorité absolue
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "index, follow"
  conditions = {User-Agent = "Googlebot"}