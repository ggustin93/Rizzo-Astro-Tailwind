# ==============================================================================
# netlify.toml
#
# Configuration for deploying the Astro site to Netlify.
# This file includes build settings and custom headers for performance.
# ==============================================================================

# --- Build Settings ---
# Specifies the command to build the site and the directory where the
# output will be located. Astro's defaults are used here.
[build]
  command = "npm run build"
  publish = "dist"

# --- Redirects ---
# Primary redirect for humans - permanent redirect to French version
[[redirects]]
  from = "/"
  to = "/fr/"
  status = 301
  force = true

# --- Headers ---
# Custom headers to improve performance by leveraging browser caching.
[[headers]]
  # Apply these headers to all fingerprinted assets generated by Astro.
  # The ":hash" placeholder is a Netlify-specific feature that matches
  # the unique hash Astro adds to filenames (e.g., index.a1b2c3d4.js).
  for = "/_astro/*"
  [headers.values]
    # Cache assets in the browser for one year.
    # "public" allows intermediaries (like CDNs) to cache the resource.
    # "immutable" tells the browser that the file will never change,
    # so it doesn't need to re-validate it.
    Cache-Control = "public, max-age=31536000, immutable"

# Add bot-friendly headers to all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "all"
    X-Content-Type-Options = "nosniff"

# Add special headers for search engine bots to help them crawl effectively
[[headers]]
  for = "/"
  [headers.values]
    Vary = "User-Agent"
