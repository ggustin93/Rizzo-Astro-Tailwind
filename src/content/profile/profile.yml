          à la fois entreprises et travailleur·euse.s - des services
          d'accompagnement, conseil, négociation et défense en justice en droit
          des relations du travail.
        - La gestion de la relation de travail du recrutement à la rupture, la
          rédaction de contrats, de rapports d'audit dans le cadre de projets
          d'acquisition, le bien-être au travail, les outils destinés à
          améliorer l'équilibre vie privée-vie professionnelle, les questions de
          discrimination et les faux indépendants font partie de ma pratique
          quotidienne.
