      title: Avocate en droit du travail et de la fonction publique européenne
      languages: Stephanie travaille en français, néerlandais et anglais.
      seo:
        title: Profil | Stephanie Michiels
        description: >-
          Découvrez le parcours et l'expertise de Stephanie Michiels, avocate en droit du travail
          belge et européen. Conseil et représentation pour employés et employeurs, avec expérience
          à la Commission européenne.
        image: /default-social-image.png
        keywords:
          - avocat droit du travail Bruxelles
          - Stephanie Michiels profil
          - expertise juridique emploi
          - conseil droit social
          - défense employés employeurs
          - spécialiste litiges travail Belgique
          - droit européen du travail
          - Commission européenne
          - protection données personnelles
      id: stephanie-michiels
      presentation:
        - >-
          Inscrite au Barreau de Bruxelles en 2015, Stephanie Michiels accompagne travailleurs,
          employeurs et fonctionnaires ou agents de l'Union européenne dans la gestion de leur
          relation de travail.
        - >-
          Sa pratique repose sur une double expertise rare à Bruxelles : le droit du travail belge
          (licenciement, harcèlement, discrimination, faux indépendants, rémunération, contrats et
          règlements de travail) et le droit de la fonction publique européenne (statut des
          fonctionnaires et agents, concours EPSO, allocations familiales, pension, promotion,
          non-renouvellement de contrat, procédures devant le Tribunal et la Cour de justice de
          l'UE).
        - >-
          Ancienne juriste au Service juridique et à la DG Ressources humaines de la Commission
          européenne, elle possède une connaissance approfondie du fonctionnement des institutions
          européennes. Également détachée à plusieurs reprises en entreprise, elle a développé une
          approche pragmatique et entrepreneuriale du droit, au plus proche des réalités
          opérationnelles de ses clients.
        - >-
          Trilingue (français, néerlandais, anglais), elle conseille et plaide dans les trois
          langues, un atout essentiel dans un environnement belge et européen.
      role: Avocate associée
