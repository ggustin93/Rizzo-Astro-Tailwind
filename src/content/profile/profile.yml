          questions liées aux ressources humaines et aux relations entre
          employeur et travailleur·euse·s, tant dans le secteur public que
          privé.
        - J'ai acquis une vision pluri-secteurs du droit du travail. En qualité
          d'avocate, j'ai notamment travaillé au sein du département droit
          social d'un cabinet international. J'y ai traité des dossiers
          passionnants tant pour des entreprises multinationales que des PME et
          entités publiques. J'ai ensuite été conseillère juridique au sein de
          la Commission européenne en droit de la fonction publique.
        - "Les questions liées au package salarial des employé·e·s du secteur
          public et privé, font partie de ma pratique quotidienne. Je traite
          aussi notamment toutes vos questions liées aux ruptures de contrats,
          au déroulement de la carrière (évaluations, promotions, etc.), à la
          couverture sociale (pension, allocations), aux discriminations, au
