      id: stephanie-michiels
      presentation:
        - >-
          Admitted to the Brussels Bar in 2015, Stephanie Michiels assists workers, employers and
          officials or other staff of the European Union in managing their employment relationships.
        - >-
          Her practice rests on a dual expertise that is rare in Brussels: Belgian employment law
          (dismissal, harassment, discrimination, false self-employment, remuneration, employment
          contracts and work rules) and European civil service law (the status of officials and
          other staff, EPSO competitions, family allowances, pensions, promotion, non-renewal of
          contracts, proceedings before the General Court and the Court of Justice of the EU).
        - >-
          A former legal officer in the European Commission's Legal Service and Directorate-General
          for Human Resources, she has an in-depth understanding of how the European institutions
          operate. Having also been seconded to companies on several occasions, she has developed a
          pragmatic and entrepreneurial approach to law, closely aligned with her clients'
          operational realities.
        - >-
          Trilingual in French, Dutch and English, she advises and pleads in all three languages, an
          essential asset in a Belgian and European environment.
