  bio:
    - Avocate au Barreau de Bruxelles depuis 2010, habituée des négociations et
      des salles d'audience et forte d'une expérience auprès de clients
      internationaux et dans un cabinet de niche, je propose à mes clients - à
      la fois employeurs et travailleurs - des services d'accompagnement,
      conseil, négociation et défense en justice en droit des relations du
      travail.
    - La gestion de la relation de travail du recrutement à la rupture, la
      rédaction de rapports d'audit dans le cadre de projets d'acquisition, le
      bien-être au travail, les outils destinés à améliorer l'équilibre vie
      privée-vie professionnelle, les questions de discrimination et les faux
      indépendants font partie de ma pratique quotidienne.
    - Je suis actuellement membre de la commission Bien-être psychosocial du
      Barreau de Bruxelles et je siège régulièrement au sein du jury des
      exercices de plaidoirie, examen auxquels les avocats stagiaires doivent se
      soumettre avant la fin de leur stage.
