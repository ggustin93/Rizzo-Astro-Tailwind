      id: christine-rizzo
      presentation:
        - >-
          A member of the Brussels Bar since 2010, Christine advises and represents both companies
          and workers in employment relations law. She was awarded the title of specialist in
          employment law in 2025. Managing employment relationships from recruitment to termination,
          drafting contracts, social audits for acquisition projects, well-being at work and false
          self-employment are part of her daily practice. Familiar with both negotiations and
          courtrooms, she gained experience with international clients and in a specialist firm
          before founding her own practice in 2024. She partnered with Stephanie Michiels in
          September 2025 to co-found Rizzo & Michiels in 2026. She therefore knows first-hand the
          decisions facing a growing organisation (first recruitments, internal organisation,
          strategic decisions), experience she puts directly at the service of the SME,
          micro-enterprise and start-up leaders she supports. She co-chairs the Brussels Bar's
          Psychosocial Well-being Commission and is involved in the non-profit association MIATA,
          whose management she is gradually taking over. In 2018–2019, together with Stephanie
          Michiels and the Brussels Young Bar Conference team, she also launched the first edition
          of the Telephone Legal Clinic. She is also a member of the Association des Juristes
          Praticiens du Droit Social.
      role: Partner
