  lawyers:
    - name: "Christine Rizzo"
      title: "Employment lawyer"
      languages: "I work in French, Italian, and English. I also have a good knowledge of Dutch."
      bio:
        - "A member of the Brussels Bar since 2010 and with experience with international clients and in a niche firm, I offer my clients - both employers and employees - support services, advice, negotiation, and legal defense in labor relations law."
        - "Managing employment relationships from recruitment to termination, drafting agreemeents and audit reports for acquisition projects, well-being at work, tools for improving work-life balance, discrimination issues and classification issues (employee vs independent contractor) are all part of my daily practice."
        - "I am currently a member of the Psychosocial Well-being Commission of the Brussels Bar and regularly sit on the jury for pleading exercises, an examination that trainee lawyers must undergo before the end of their internship. I am also a member of the Association of Jurists Practicing Social Law (AJPDS)."
