          Barreau de Bruxelles et je siège régulièrement au sein du jury des
          exercices de plaidoirie, examen auquel les avocats stagiaires doivent
          se soumettre avant la fin de leur stage. Je suis également membre de
          l'Association des Juristes Praticiens du Droit Social.
