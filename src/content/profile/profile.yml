it:
  lawyers:
    - name: Christine Rizzo
      title: Avvocata del lavoro
      languages: Lavoro in francese, italiano e inglese. Ho anche una buona conoscenza
        della lingua nederlandese.
      bio:
        - Membro dell'Ordine degli Avvocati di Bruxelles dal 2010 e con
          esperienza con clienti internazionali e in uno studio specializzato,
          offro ai miei clienti - sia datori di lavoro che dipendenti - servizi
          di supporto, consulenza, negoziazione e difesa legale nel diritto
          delle relazioni di lavoro.
        - La gestione del rapporto di lavoro dall'assunzione alla cessazione, la
          redazione di contratti e di relazioni di audit nell'ambito di progetti
          di acquisizione, il benessere sul lavoro, gli strumenti per migliorare
          l'equilibrio tra lavoro e vita privata, i problemi di discriminazione
          e il falso lavoro autonomo fanno parte della mia pratica quotidiana.
        - Attualmente sono membro della Commissione per il Benessere
          Psicosociale dell'Ordine degli Avvocati di Bruxelles e siedo
          regolarmente nella giuria degli esercizi di arringa, un esame che gli
          avvocati tirocinanti devono sostenere prima della fine del loro
          tirocinio. Sono anche membro dell'Associazione dei professionisti del
          diritto del lavoro (AJPDS).
      careerPath:
