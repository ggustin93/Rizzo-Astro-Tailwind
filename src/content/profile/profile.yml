    - name: Stephanie Michiels
      title: Avvocata in diritto del lavoro e della funzione pubblica europea
      languages: Lavoro in francese, olandese e inglese.
      bio:
        - Iscritta all'Ordine degli Avvocati di Bruxelles nel 2015, sono
          appassionata delle questioni legate alle risorse umane e alle
          relazioni tra datore di lavoro e lavoratori, sia nel settore privato
          che pubblico.
        - Ho acquisito una visione multisettoriale del diritto del lavoro. Come
          avvocata, ho lavorato nel dipartimento di diritto sociale di uno
          studio internazionale, gestendo casi affascinanti per aziende
          multinazionali, PMI ed entità pubbliche. Successivamente sono stata
          consulente legale presso la Commissione europea.
        - Le questioni relative alla retribuzione e alla remunerazione dei
          dipendenti del settore privato e dei funzionari dell'Unione Europea
          fanno parte della mia pratica quotidiana. Mi occupo inoltre di tutte
          le vostre domande relative alla risoluzione del contratto,
          all'avanzamento di carriera (valutazioni, promozioni, provvedimenti
          disciplinari), alla copertura previdenziale (pensione, indennità),
          alla discriminazione, alle molestie morali e sessuali sul posto di
          lavoro, nonché alle questioni relative alla segnalazione di
          irregolarità.
        - Ho una conoscenza approfondita delle norme che regolano i diritti e
          gli obblighi dei funzionari e degli agenti dell'UE. Ho anche una
          formazione in materia di legislazione sulla protezione dei dati.
        - Nella mia pratica, privilegio la negoziazione quando permette una
          soluzione rapida alla controversia. Tuttavia, difendo con energia e
          convinzione la voce dei miei clienti davanti ai tribunali quando una
          soluzione negoziata non è possibile.
