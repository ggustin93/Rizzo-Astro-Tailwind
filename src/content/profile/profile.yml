    - name: "Stephanie Michiels"
      title: "Avocate en droit du travail belge et européen"
      linkedin: "https://www.linkedin.com/in/stephanie-michiels-/"
      languages: "Je travaille en français, néerlandais et anglais."
      bio:
        - "Inscrite au Barreau de Bruxelles en 2015, je suis passionnée par les questions liées aux ressources humaines et aux relations entre employeur et travailleur·euse·s, tant dans le secteur privé que publique."
        - "J'ai acquis une vision pluri-secteurs du droit du travail. En qualité d'avocate, j'ai notamment travaillé au sein du département droit social d'un cabinet international. J'y ai traité des dossiers passionnants tant pour des entreprises multinationales que des PME et entités publiques. J'ai ensuite été conseillère juridique au sein de la Commission européenne."
        - "Les questions liées au package salarial des employé·e·s du secteur public et privé, font partie de ma pratique quotidienne. Je traite aussi notamment toutes vos questions liées aux ruptures de contrats, au déroulement de la carrière, à la couverture sociale, aux discriminations, au harcèlement moral et sexuel au travail, ainsi qu'à la problématique des lanceurs d'alerte."
        - "Je suis également formée en droit de la protection des données à caractère personnel."
        - "Dans ma pratique, je privilégie la négociation lorsqu'elle permet une solution rapide au litige. Je porte toutefois avec énergie et conviction la voix de mes clients devant les tribunaux lorsqu'une issue négociée n'est pas envisageable."
