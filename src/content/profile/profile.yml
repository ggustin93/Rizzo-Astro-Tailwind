    - name: Stephanie Michiels
      title: Employment & European civil service Lawyer
      languages: I work in French, Dutch, and English.
      bio:
        - Admitted to the Brussels Bar in 2015, I am passionate about HR-related
          issues and employer-employee relations, both in the public and private
          sector.
        - I have gained a multi-sector perspective on labour law. As an
          attorney, I worked in the employment law department of an
          international law firm (US-based), handling cases for multinational
          companies, SMEs, as well as public entities. I then served as a legal
          officer at the European Commission in EU civil service law.
        - Matters related to pay and compensation for employees in the private
          sector and for EU staff members are part of my daily practice. I also
          handle all your questions related to contract termination, career
          progression (appraisals, promotion, discipline), social security
          coverage (pension, allowances), discrimination, moral and sexual
          harassment at work, as well as whistleblowing issues.
        - I have a thorough knowledge of the rules governing the rights and
          obligations of EU officials and agents. I am also trained in data
          protection law.
        - In my practice, I favor negotiation when it allows for a quick
          resolution to disputes. However, I vigorously advocate for my clients
          in court when a negotiated outcome is not feasible.
