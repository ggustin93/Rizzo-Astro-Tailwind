    - name: "Stephanie Michiels"
      title: "Belgian and European Labor Law Attorney"
      languages: "I work in French, Dutch, and English."
      bio:
        - "Admitted to the Brussels Bar in 2015, I am passionate about human resources issues and employer-employee relations, in both the private and public sectors."
        - "I have gained a multi-sector perspective on labor law. As a lawyer, I worked in the social law department of an international law firm, handling fascinating cases for multinational companies, SMEs, and public entities. I then served as a legal advisor at the European Commission."
        - "Matters related to compensation packages for employees in the public and private sectors are part of my daily practice. I also handle all your questions related to contract terminations, career progression, social security coverage, discrimination, moral and sexual harassment at work, as well as whistleblower issues."
        - "I am also trained in personal data protection law."
        - "In my practice, I favor negotiation when it allows for a quick resolution to disputes. However, I vigorously and convincingly advocate for my clients in court when a negotiated outcome is not feasible."
