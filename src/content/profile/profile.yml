      id: christine-rizzo
      presentation:
        - >-
          Avocate au Barreau de Bruxelles depuis 2010, Christine conseille et défend tant les
          entreprises que les travailleurs, en droit des relations de travail. Elle obtient le titre
          de spécialiste en droit du travail en 2025. Gestion de la relation de travail du
          recrutement à la rupture, rédaction de contrats, audits sociaux dans le cadre de projets
          d'acquisition, bien-être au travail et faux indépendants font partie de sa pratique
          quotidienne. Habituée des négociations comme des salles d'audience, elle a acquis son
          expérience auprès de clients internationaux et au sein d'un cabinet de niche avant de
          fonder son propre cabinet en 2024. Elle s'associe à Stephanie Michiels en septembre 2025
          pour co-fonder Rizzo & Michiels en 2026. Elle connaît ainsi de l'intérieur les arbitrages
          d'une structure qui grandit (premiers recrutements, organisation interne, décisions
          stratégiques), une expérience qu'elle met directement au service des dirigeants de PME,
          TPE et start-up qu'elle accompagne. Elle copréside la Commission Bien-être psychosociale
          du Barreau de Bruxelles et s'investit au sein de l'ASBL MIATA, dont elle reprend
          progressivement la direction. Elle a par ailleurs lancé avec Stephanie Michiels et
          l'équipe de la Conférence du Jeune Barreau de Bruxelles, en 2018-2019, la première édition
          de la Clinique Juridique Téléphonique. Elle est également membre de l'Association des
          Juristes Praticiens du Droit Social.
