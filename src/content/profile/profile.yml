      bio:
        - "Iscritta all'Ordine degli Avvocati di Bruxelles nel 2015, sono appassionata delle questioni legate alle risorse umane e alle relazioni tra datore di lavoro e lavoratori, sia nel settore privato che pubblico."
        - "Ho acquisito una visione multisettoriale del diritto del lavoro. Come avvocata, ho lavorato nel dipartimento di diritto sociale di uno studio internazionale, gestendo casi affascinanti per aziende multinazionali, PMI ed entità pubbliche. Successivamente sono stata consulente legale presso la Commissione europea."
        - "Le questioni relative al pacchetto retributivo dei dipendenti del settore pubblico e privato fanno parte della mia pratica quotidiana. Mi occupo anche di tutte le vostre questioni relative a cessazioni di contratti, sviluppo della carriera, copertura sociale, discriminazioni, molestie morali e sessuali sul lavoro, nonché la problematica dei whistleblower."
        - "Sono anche formata nel diritto della protezione dei dati personali."
        - "Nella mia pratica, privilegio la negoziazione quando permette una soluzione rapida alla controversia. Tuttavia, difendo con energia e convinzione la voce dei miei clienti davanti ai tribunali quando una soluzione negoziata non è possibile."
