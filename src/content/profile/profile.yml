          arbeidsrelatie, zowel voor werkgevers als voor werknemers, bij adviesverlening en in
          geschillen. Hij geeft de voorkeur aan een pragmatische aanpak die gericht is op het vinden
          van oplossingen, zonder ooit de noodzaak van een grondige en vastberaden verdediging uit
          het oog te verliezen wanneer die vereist is. Op 1 oktober 2026 treedt hij als
          advocaat-medewerker toe tot Rizzo & Michiels.
      languages: >-
        Arnaud werkt in het Frans en Engels en heeft ook een goede kennis van het Italiaans en
        Nederlands.
