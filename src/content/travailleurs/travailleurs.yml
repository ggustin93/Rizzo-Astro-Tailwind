en:
  title: Legal counsel and defense for employees
  description: "*"
  questions:
    - Do you need your employment contract reviewed ?
    - "Is your employer offering you a negotiated severance package, but you are
      not sure whether it is in your best interests? "
    - Do you want to resign ?
    - Do you want to contest your dismissal (manifestly unreasonable, abusive or
      discriminatory dismissal) ?
    - Would you like to verify the calculation of your severance pay and whether
      your rights have been respected following dismissal ?
    - Have your working conditions changed during or because of pregnancy ?
      Would you like to take parental leave ?
    - Are you a victim of discrimination or harassment ? Are you being sidelined
      because of a burn-out ?
    - Are you the victim of a workplace accident ?
    - "Is your status unclear ? You are an independent contractor, but you think
      you should be reclassified as an employee ? "
  servicesTitle: My services
  services:
    - icon: BriefCase
      text: Legal advice from recruitment to termination
    - icon: Shield
      text: Defense before labor courts and tribunals
    - icon: Handshake
      text: Negotiation of settlement agreements
  ctaText: Learn more about rates for workers
  seo:
    title: Legal Services for Employees | Christine Rizzo Lawyer
