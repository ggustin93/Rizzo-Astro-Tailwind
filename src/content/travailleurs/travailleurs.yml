it:
  title: Consulenza e difesa per i lavoratori
  description: "*"
  questions:
    - Vuole far controllare un contratto di lavoro prima di firmarlo ?
    - "Il datore di lavoro Le propone un licenziamento concordato ma non sa se è
      nel propio interesse? "
    - Vuole dare le dimissioni?
    - Intende contestare il licenziamento (motivo insufficiente, abusivo o
      discriminatorio)?
    - Vuole fare verificare il calcolo dell'Indennità sostitutiva del preavviso
      e degli altri importi di fine rapporto??
    - Le condizioni di lavoro sono cambiate durante o a causa della gravidanza?
      Desidera prendere un congedo parentale?
    - É vittima di discriminazione o molestie? Soffri di esaurimento (burn out)
      professionale ?
    - Ha avuto un infortunio sul lavoro?
    - La Sua situazione non è chiara? pensa di dover essere riclassificato come
      dipendente (lavoro subordinato)?
  servicesTitle: I miei servizi
  services:
    - icon: BriefCase
      text: "Consulenza legale dal l'assunzione alla fine del contratto "
    - icon: Shield
      text: Difesa davanti ai tribunali del lavoro
    - icon: Handshake
      text: Negoziazione di accordi transattivi
  ctaText: Scopri di più sulle tariffe per i lavoratori
