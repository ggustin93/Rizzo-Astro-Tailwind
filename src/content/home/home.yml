fr:
  expertise:
    title: Expertise & Services
    description: Nous accompagnons les entreprises, PME, TPE et start-up belges, les
      institutions européennes et leurs agents (fonctionnaires et agents
      contractuels), ainsi que les travailleur·euse·s, dans leurs problématiques
      quotidiennes et leurs projets liés à l'emploi.
    travailleurs:
      title: Vous êtes salarié·e et rencontrez un litige avec votre employeur ?
      description: Nous vous accompagnons tout au long de votre parcours professionnel
        que ce soit pour une question ponctuelle, la négociation d'un départ ou
        l'introduction d'une procédure judiciaire devant le tribunal du travail
        contre votre employeur.
      cta: En savoir plus
    employeurs:
      title: Vous dirigez une PME, une TPE ou une start-up belge ?
      description: "Nous vous conseillons et défendons sur vos questions de droit
        social : contrat de travail, règlement de travail, licenciement,
        prévention et contentieux."
      cta: En savoir plus
    europeennes:
      title: Vous êtes une institution européenne, un·e fonctionnaire ou un·e agent·e
        contractuel·le ?
      subtitle: Agences · Fonctionnaires & Agents
      description: Nous conseillons les institutions et agences européennes dans la
        gestion de leurs relations de travail et accompagnons les fonctionnaires
        et agents dans leurs démarches, de la négociation à la procédure
        précontentieuse et contentieuse.
      cta: En savoir plus
    honoraires:
      title: Honoraires
      intro: Des honoraires transparents et adaptés à votre situation.
      linkText: En savoir plus
      advantages:
        - Tarifs horaires ou forfaitaires pour une meilleure prévisibilité
        - Possibilité de paiement mensuel
      cta: En savoir plus
