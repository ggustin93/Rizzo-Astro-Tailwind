      employers, executives and senior professionals with dismissals, exit
      negotiations and employment disputes.
it:
  previsibilite:
    title: Cosa coprono i nostri onorari
    full_content: >-
      #### Prestazioni visibili e meno visibili


      I nostri onorari coprono tutte le attività svolte nell'ambito della Sua pratica. Alcune sono immediatamente percepibili, come gli incontri, le udienze, la redazione di atti difensivi e di corrispondenza. Altre, altrettanto essenziali, sono meno visibili: l'esame approfondito del fascicolo, le ricerche giuridiche, gli scambi con la controparte, gli adempimenti amministrativi, la preparazione della documentazione e i tempi di attesa in udienza.


      #### Come contribuire a contenere i costi


      Per contenere i costi della Sua pratica, La invitiamo a trasmetterci documenti completi e ben organizzati, a raggruppare, ove possibile, le Sue domande e a rispondere tempestivamente alle nostre richieste. Una collaborazione efficace facilita la gestione del fascicolo e consente di limitare il tempo dedicato alle attività fatturabili.


      #### L'intelligenza artificiale al servizio della Sua pratica


      Ci avvaliamo di strumenti di intelligenza artificiale, tra cui JEF, una soluzione specializzata per gli avvocati belgi, nonché strumenti come Claude e ChatGPT, utilizzati previa anonimizzazione dei dati. Questi strumenti ci consentono di lavorare con maggiore efficienza, senza mai delegare all'intelligenza artificiale l'analisi e il ragionamento giuridico.


      In concreto, il loro utilizzo ci permette di rispondere più rapidamente, ridurre i tempi di gestione delle pratiche e migliorare il rapporto tra qualità del servizio e costi. La competenza giuridica rimane al centro di ogni intervento: l'intelligenza artificiale è uno strumento di supporto, mentre la valutazione professionale dell'avvocato resta insostituibile.


      Anche da parte Sua, comunicazioni brevi e mirate contribuiscono a una gestione più efficiente della pratica, indipendentemente dal fatto che siano redatte personalmente o con l'ausilio di strumenti di intelligenza artificiale. Prima di inviare un messaggio, La invitiamo a verificare che le questioni sollevate non abbiano già ricevuto risposta. Ciò permette di evitare scambi superflui, accelerare la gestione della pratica e contenere gli onorari.
  forfaits:
    title: Trasparenza
    intro: >-
      Le modalità di calcolo dei nostri onorari Le vengono comunicate per
      iscritto prima dell’inizio del nostro intervento.


      Lavoriamo o a tariffa oraria o, in alcuni casi, a forfait fisso, maggiorato da un compenso a risultato. Le nostre fatture sono emesse mensilmente e sono pagabili integralmente alla scadenza.


      Il nostro intervento inizia al ricevimento di un acconto. Possono essere richiesti acconti supplementari nel corso della pratica, al fine di garantire un monitoraggio finanziario trasparente.


      Le spese legate all’intervento di terzi (ufficiali giudiziari, periti, traduttori) o le spese giudiziarie sono rifatturate al prezzo di costo o sono pagabili direttamente al terzo interessato.


      Il nostro studio non interviene nell'ambito del patrocinio a spese dello Stato - assistenza pro deo. Se ritiene di poterne beneficiare, troverà le condizioni e la procedura sul sito di Avocats.be e presso l’Ufficio di assistenza legale (Bureau d’aide juridique) più vicino al suo domicilio.
    exemples: []
  transparence:
    title: Desidera un primo parere?
    points:
      - >-
        Consulti le disponibilità direttamente sul nostro calendario online e
        prenoti il Suo appuntamento. Il primo colloquio è fatturato 275 € IVA
        inclusa.


        Non esiti a portare con sé tutti i documenti che ritiene utili (contratto di lavoro, corrispondenza, buste paga, ecc.), così da consentirci di esaminare concretamente la Sua situazione fin dal primo incontro.
  assurance:
    title: Valuti l'assicurazione di tutela legale
    content: >-
      Un'assicurazione di tutela legale, detta anche «assicurazione di difesa in
      giudizio», può consentirLe di risparmiare somme considerevoli.


      Diversi assicuratori operanti in Belgio, tra cui Ethias, Arag, DAS e ARCES, propongono polizze che coprono le controversie nell'ambito di un rapporto di lavoro, sia per i lavoratori sia per i datori di lavoro.


      Le consigliamo di verificare con il Suo intermediario assicurativo o con la Sua compagnia se dispone già di una copertura applicabile alla Sua situazione, se sia possibile sottoscriverne una e quale sia l'eventuale periodo di carenza.


      Se la Sua polizza copre la controversia, l'assicurazione potrà farsi carico di tutti o di parte degli onorari legali, evitando che tali costi ricadano interamente su di Lei.
