en:
  previsibilite:
    title: What our fees cover
    full_content: >-
      Our fees cover all the work carried out on your matter. Some of it is
      directly visible: meetings, court hearings, drafting submissions or
      letters. Other work, just as essential, is less visible: in-depth study of
      the file, legal research, exchanges with the opposing parties,
      administrative formalities, preparing documents, waiting time at hearings.


      To keep your costs under control, we invite you to send complete and well-organised documents, to group your questions together where possible, and to respond promptly to our requests. Smooth collaboration speeds up the handling of your matter and optimises billable time.


      We use artificial intelligence tools (in particular JEF, a tool designed for Belgian lawyers, as well as other tools such as Claude or ChatGPT, always with anonymised data) to work more efficiently, without ever delegating legal reasoning.


      In practice, this means greater responsiveness, shorter turnaround times and better value for money for you. Our legal expertise remains at the heart of every decision: AI is a tool, a lawyer's judgement is irreplaceable.


      On your side, a short and focused message is always the most effective, whether you write it yourself or with the help of an AI tool. Please check that the points you raise have not already been answered before sending: this speeds up the handling of your matter and keeps your fees under control.
  forfaits:
    title: Transparency
    intro: >-
      The method used to calculate our fees will be communicated to you in
      writing before we begin work.


      We work either at an hourly rate or, in some cases, on a fixed fee plus a success fee. Our invoices are issued monthly and are payable in full on the due date.


      Our work begins upon receipt of a retainer. Additional retainers may be requested as the matter progresses, to ensure transparent financial follow-up.


      Costs relating to third-party involvement (bailiffs, experts, translators) or court costs are re-invoiced at cost or are payable directly to the third party concerned.


      Our firm does not act under the legal aid system. If you think you may be eligible, you will find the conditions and procedure on the Avocats.be website and from the Legal Aid Office (Bureau d’aide juridique) nearest to your home
    exemples: []
  transparence:
    title: Need a first opinion?
    points:
      - Book your slot directly via our online calendar. The first meeting is
        billed at €275, VAT included. Feel free to bring any documents you
        consider useful (employment contract, correspondence, payslips, etc.) so
        that we can analyse your situation in concrete terms from this first
        meeting.
  assurance:
    title: Consider legal protection insurance
    content: >-
      Legal expenses insurance (or ‘legal defence cover’) can save you a lot of
      money.


      Several insurers in Belgium offer legal expenses insurance that covers disputes arising from an employment relationship (Ethias, Arag, DAS, Arces), whether you are an employee or a business.


      Check with your broker or insurer to see if you are covered under such a policy, whether you can take out such cover, and what the waiting period is.
       
      In this case, all or part of your legal fees will be paid by your insurer rather than by you.
  tarifs:
    title: Rates
    travailleur: You are an employee
    employeur: You are an employer
  aideJuridique:
    title: legal aid (pro deo)
    content: Our firm is not registered in the second-line legal aid system and
      therefore does not act under it. If you think you may be eligible, you
      will find the conditions and procedure on the Avocats.be website and from
      the Legal Aid Office (Bureau d’aide juridique) nearest to your home.
  subtitle: A relationship of trust starts with clear pricing. Here is how we work.
  title: Fees
