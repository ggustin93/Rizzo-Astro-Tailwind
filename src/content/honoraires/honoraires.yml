fr:
  previsibilite:
    title: "Prévisibilité "
    full_content: >-
      Ne pas savoir combien va coûter l'intervention de votre avocat.e peut être
      une source d'inquiétude. 

      Nous vous proposons nos prestations soit à un tarif horaire soit, dans certains cas, à un tarif forfaitaire fixe "tout compris" augmenté le cas échéant d'un honoraire de résultat. 


      Si nous choisissons de travailler ensemble sur base d'un tarif horaire, nos prestations vous sont facturées chaque mois, au fur et à mesure des prestations.


      Il n'y a pas de frais de dossier ou de bureau.


      Les frais liés à l'intervention de tiers (huissiers, experts, traducteurs, avocats spécialisés dans d'autres domaines) ou les frais de justice (droits de greffe) sont refacturés au prix coûtant ou directement payables au tiers intervenant.
  forfaits:
    title: Avoir une réponse rapide à une question - Première consultation 45 min -
      200 € htva.
    intro: "La première réunion de 45 minutes est facturée 200 € htva. La TVA est de
      21%. N'hésitez pas à y apporter tous les documents que vous jugez utiles
      pour cette première rencontre. "
    exemples: []
  transparence:
    title: Transparence
    points:
      - Les modalités de calcul de nos honoraires ainsi que les conditions de
        notre intervention vous sont communiquées par écrit avant le début de
        notre intervention.
  assurance:
    title: Pensez à l'assurance protection juridique
    content: >
      L'assurance protection juridique (ou « défense en justice ») peut vous
      permettre d'économiser beaucoup d'argent. 


      Plusieurs assureurs en Belgique proposent une assurance protection juridique qui couvre les conflits dans le cadre d'une relation de travail (Ethias, Arag, Das, Arces), que vous soyez un.e travailleur.euse ou une entreprise.


      Vérifiez avec votre courtier ou votre assurance si vous êtes couverts ou si une telle assurance peut être souscrite et le délai d'attente.
       
      Dans ce cas, tout ou une partie de vos frais d'avocat seront payés par votre assurance et non par vous.
  tarifs:
    title: Tarifs
    travailleur: Vous êtes un travailleur
    employeur: Vous êtes un employeur
  aideJuridique:
    title: Aide juridique (pro deo)
    content: >-
      L'aide juridique permet à toute personne de bénéficier d'une première
      consultation juridique gratuite (aide juridique de 1ère ligne). Elle
      permet également à certaines catégories de personnes de bénéficier de
      l'assistance gratuite d'un.e avocat.e pour le traitement d'un dossier dans
      toutes les matières juridiques (aide juridique de 2ème ligne). Ces
      avocat.e.s sont volontaires et fournissent les mêmes services que dans le
      cadre d'une aide juridique payante : conseil, assistance et représentation
      dans le cadre d'une procédure judiciaire, administrative ou dans le cadre
      d'une médiation, introduction d'un recours…


      Si vous souhaitez vous renseigner ou vérifier si vous remplissez les conditions pour bénéficier de l'aide juridique de 2ème ligne, nous vous invitons à consulter le site [Avocats.be](http://Avocats.be) ou le site du bureau d'aide juridique de votre région (pour [Bruxelles](https://www.bajbruxelles.be/)).


      Si vous remplissez les conditions pour bénéficier de l'aide juridique de 2ème ligne mais que vous souhaitez y renoncer et solliciter mon intervention en dehors de ce cadre, le formulaire téléchargeable [ici](https://docs.google.com/document/d/1342gFQP0Wfvejg3RrRpynr_0xgowMhOHl3XHTDWqWA4/edit?tab=t.0#heading=h.xth8kae1d4z1) devra nous être remis signé.
  subtitle: Les honoraires de l'avocat constituent la contrepartie du travail
    qu'il accomplit pour vous.
  title: Honoraires
  video:
    title: En savoir plus
    url: https://youtu.be/Y-SKuT-XqGk
en:
  previsibilite:
    title: Predictability
    full_content: >-
      Not knowing how much your lawyer's intervention will cost can be a source
      of concern.

      We offer our services at an hourly rate or, in certain cases, at a fixed, all-inclusive rate. Therefore, you know exactly what you will pay per month and in total.


      If we choose to work together on an hourly rate basis, our services are billed to you each month as the work progresses.


      There are no file or office fees.


      Costs related to third-party interventions (bailiffs, experts, translators, lawyers specialized in other fields) or court fees (registry fees) are invoiced at cost or directly payable to the intervening third party.
  forfaits:
    title: Get a quick answer to a question - First consultation 45 min - 200 €
      excl. tax.
    intro: "The first 45-minute meeting is charged at 200 € excluding VAT. VAT is
      21%. Please feel free to bring any documents you consider useful for this
      initial meeting. "
    exemples: []
  transparence:
    title: Transparency
    points:
      - The terms and conditions for calculating our fees and the conditions of
        our services will be provided to you in writing before we begin our
        work.
  assurance:
    title: Consider legal protection insurance
    content: >-
      Legal Protection Insurance (or "legal defense") can save you a lot of
      money.


      Several insurers in Belgium offer legal protection insurance that covers employment-related issues (Ethias, Arag, Das, Arces), whether you are an employee or an employer.


      If you are not currently insured, you may be eligible for coverage. Be sure to inquire about the waiting period. Insurance coverage is an excellent way to pay for legal fees!
  tarifs:
    title: Rates
    travailleur: You are an employee
    employeur: You are an employer
  aideJuridique:
    title: Free legal aid (pro bono)
    content: >-
      Legal aid allows everyone to benefit from a free initial legal
      consultation (first-line legal aid). It also allows qualified individuals
      to benefit from the free assistance of a lawyer for the handling of a case
      in all legal matters (second-line legal aid). These lawyers are
      volunteers. They provide their clients with the same services as in the
      context of paid legal aid: advice, assistance and representation in the
      context of judicial or administrative proceedings or in the context of
      mediation, filing of appeals, etc.


      If you would like to find out more or check whether you qualify for second-line legal aid, please consult the [Avocats.be](http://Avocats.be) website or the website of the legal aid bureau in your region (for [Brussels](https://www.bajbruxelles.be/)).


      For individuals meeting the conditions for second line legal aid, you may request my assistance outside of this framework. Please  complete the waiver form [here](https://docs.google.com/document/d/1342gFQP0Wfvejg3RrRpynr_0xgowMhOHl3XHTDWqWA4/edit?tab=t.0#heading=h.xth8kae1d4z1), 

      sign, and return to us.
  subtitle: The lawyer's fees are the compensation for the legal services rendered
    for you.
  title: Fees
  video:
    title: Learn more
    url: https://youtu.be/Y-SKuT-XqGk
it:
  previsibilite:
    title: Prevedibilità
    full_content: >-
      Non sapere quanto costerà l'intervento del vostro avvocato può essere
      fonte di preoccupazione.

      Vi proponiamo i nostri servizi a una tariffa oraria o, in certi casi, forfettaria fissa "tutto incluso".

      Sapete quindi esattamente quanto pagherete al mese e quanto pagherete in totale.


      Se scegliamo di lavorare insieme sulla base di una tariffa oraria, le nostre prestazioni vi vengono fatturate ogni mese, man mano che vengono eseguite.


      Non ci sono spese amministrative.


      I costi relativi all'intervento di terzi (ufficiali giudiziari, esperti, traduttori, avvocati specializzati in altri settori) o le spese giudiziarie (diritti di cancelleria) vengono rifatturati al costo o sono direttamente pagabili al terzo interveniente.
  forfaits:
    title: Avere una risposta rapida a una domanda - Primo appuntamento 45 min - 200
      € IVA esclusa.
    intro: "Il primo incontro di 45 minuti ha un costo di 200 € IVA esclusa. L'IVA è
      del 21%. Non esitate a portare con voi tutti i documenti che ritenete
      utili per questo primo incontro. "
    exemples: []
  transparence:
    title: Trasparenza
    points:
      - Le modalità di calcolo dei nostri onorari e le condizioni del nostro
        intervento vi saranno comunicate per iscritto prima dell'inizio del
        nostro intervento.
  assurance:
    title: Pensate all'assicurazione di protezione giuridica
    content: >
      L'assicurazione di Protezione Giuridica (o "difesa in giudizio") può farvi
      risparmiare molto denaro.


      Diversi assicuratori in Belgio offrono un'assicurazione di protezione giuridica che copre i conflitti nell'ambito di un rapporto di lavoro (Ethias, Arag, Das, Arces), sia che siate lavoratori o datori di lavoro.


      Verificate con il vostro broker o assicuratore se siete coperti o se tale assicurazione può essere sottoscritta e il periodo di attesa.
       
      In questo caso, tutti o parte dei vostri onorari legali saranno pagati dalla vostra assicurazione e non da voi.
  tarifs:
    title: Tariffe
    travailleur: Sei un lavoratore
    employeur: Sei un datore di lavoro
  aideJuridique:
    title: Assistenza legale (pro bono)
    content: >-
      L'assistenza legale permette a chiunque di beneficiare di una prima
      consulenza legale gratuita (assistenza legale di 1° livello). Permette
      inoltre a determinate categorie di persone di beneficiare dell'assistenza
      gratuita di un avvocato per il trattamento di un caso in tutte le materie
      legali (assistenza legale di 2° livello). Questi avvocati sono volontari.
      Forniscono ai loro clienti gli stessi servizi che nel contesto
      dell'assistenza legale a pagamento: consulenza, assistenza e
      rappresentanza nel contesto di un procedimento giudiziario, amministrativo
      o nell'ambito di una mediazione, presentazione di un ricorso, ecc.


      Se desiderate informarvi o verificare se soddisfate le condizioni per beneficiare dell'assistenza legale di 2° livello, vi invitiamo a consultare il sito [Avocats.be](http://Avocats.be) o il sito dell'ufficio di assistenza legale della vostra regione (per [Bruxelles](https://www.bajbruxelles.be/)).


      Se soddisfate le condizioni per beneficiare dell'assistenza legale di 2° livello ma desiderate rinunciarvi e richiedere il mio intervento al di fuori di questo quadro, il modulo scaricabile [qui](https://docs.google.com/document/d/1342gFQP0Wfvejg3RrRpynr_0xgowMhOHl3XHTDWqWA4/edit?tab=t.0#heading=h.xth8kae1d4z1) dovrà essermci consegnato firmato.
  subtitle: Gli onorari dell'avvocato costituiscono il compenso per il lavoro
    svolto per voi.
  title: Onorari
  video:
    title: Per saperne di più
    url: https://youtu.be/Y-SKuT-XqGk
nl:
  previsibilite:
    title: "Voorspelbaarheid "
    full_content: >-
      Niet weten hoeveel de tussenkomst van uw advocaat zal kosten, kan een bron
      van ongerustheid zijn.

      Wij bieden onze prestaties aan tegen een uurtarief of, in bepaalde gevallen, tegen een vast forfaitair "all-in"-tarief, in voorkomend geval verhoogd met een resultaatsereloon.


      Kiezen wij ervoor samen te werken op basis van een uurtarief, dan worden onze prestaties u maandelijks gefactureerd, naarmate de prestaties worden geleverd.


      Er worden geen dossier- of kantoorkosten aangerekend.


      De kosten verbonden aan de tussenkomst van derden (gerechtsdeurwaarders, deskundigen, vertalers, advocaten gespecialiseerd in andere domeinen) of de gerechtskosten (rolrechten) worden doorgerekend tegen kostprijs of zijn rechtstreeks aan de betrokken derde te betalen.
  forfaits:
    title: Snel een antwoord op een vraag - Eerste consultatie 45 min - 200 €
      excl. btw.
    intro: "De eerste bespreking van 45 minuten wordt gefactureerd aan 200 € excl.
      btw. De btw bedraagt 21%. Breng gerust alle documenten mee die u nuttig
      acht voor deze eerste ontmoeting. "
    exemples: []
  transparence:
    title: Transparantie
    points:
      - De berekeningswijze van onze erelonen en de voorwaarden van onze
        tussenkomst worden u schriftelijk meegedeeld vóór de aanvang van onze
        tussenkomst.
  assurance:
    title: Denk aan de rechtsbijstandsverzekering
    content: >
      De rechtsbijstandsverzekering (of « verdediging in rechte ») kan u veel
      geld besparen.


      Verschillende verzekeraars in België bieden een rechtsbijstandsverzekering aan die geschillen in het kader van een arbeidsrelatie dekt (Ethias, Arag, Das, Arces), of u nu werknemer of onderneming bent.


      Ga bij uw makelaar of verzekeraar na of u gedekt bent, dan wel of een dergelijke verzekering kan worden afgesloten, en welke wachttijd geldt.

      In dat geval worden uw advocatenkosten geheel of gedeeltelijk door uw verzekering betaald en niet door u.
  tarifs:
    title: Tarieven
    travailleur: U bent werknemer
    employeur: U bent werkgever
  aideJuridique:
    title: Juridische bijstand (pro deo)
    content: >-
      De juridische bijstand stelt eenieder in staat een eerste gratis
      juridische consultatie te krijgen (eerstelijnsbijstand). Zij stelt
      bepaalde categorieën van personen eveneens in staat kosteloos te worden
      bijgestaan door een advocaat voor de behandeling van een dossier in alle
      rechtstakken (tweedelijnsbijstand). Deze advocaten treden vrijwillig op en
      leveren dezelfde diensten als in het kader van een betalende
      dienstverlening: advies, bijstand en vertegenwoordiging in het kader van
      een gerechtelijke of administratieve procedure of in het kader van een
      bemiddeling, het instellen van een beroep…


      Wenst u zich te informeren of na te gaan of u voldoet aan de voorwaarden voor tweedelijnsbijstand, dan nodigen wij u uit de website [Avocats.be](http://Avocats.be) te raadplegen of die van het bureau voor juridische bijstand van uw regio (voor [Brussel](https://www.bajbruxelles.be/)).


      Voldoet u aan de voorwaarden voor tweedelijnsbijstand maar wenst u daarvan af te zien en mijn tussenkomst buiten dat kader te vragen, dan dient het formulier dat u [hier](https://docs.google.com/document/d/1342gFQP0Wfvejg3RrRpynr_0xgowMhOHl3XHTDWqWA4/edit?tab=t.0#heading=h.xth8kae1d4z1) kunt downloaden, ondertekend aan ons te worden bezorgd.
  subtitle: Het ereloon van de advocaat vormt de tegenprestatie voor het werk dat
    hij voor u verricht.
  title: Erelonen
  video:
    title: Meer weten
    url: https://youtu.be/Y-SKuT-XqGk
