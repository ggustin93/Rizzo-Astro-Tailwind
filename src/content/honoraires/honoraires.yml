    content: Ons kantoor is niet aangesloten bij het systeem van juridische
      tweedelijnsbijstand en treedt dus niet op in dat kader. Indien u denkt
      hiervoor in aanmerking te komen, vindt u de voorwaarden en de procedure op
      de website van Avocats.be en bij het Bureau voor juridische bijstand dat
      het dichtst bij uw woonplaats gelegen is.
