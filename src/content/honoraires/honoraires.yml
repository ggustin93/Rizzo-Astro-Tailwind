fr:
  previsibilite:
    title: Prévisibilité et paiement mensualisé
    full_content: >-
      Ne pas savoir combien va coûter l'intervention de votre avocat.e peut être
      une source d'inquiétude. 

      Je vous propose la plupart de mes prestations à un tarif forfaitaire fixe "tout compris" payable par mois augmenté le cas échéant d'un honoraire de résultat.

      Vous savez donc exactement ce que vous allez payer par mois et ce que vous allez payer au total. 

      Le nombre de mensualités est déterminé ensemble en fonction de votre situation personnelle et de votre dossier (par exemple la durée estimée de la procédure judiciaire).


      Si nous choisissons de travailler ensemble sur base d'un tarif horaire, mes prestations vous sont facturées chaque mois, au fur et à mesure des prestations.


      Il n'y a pas de frais de dossier ou de bureau excepté les frais postaux qui sont refacturés au prix coûtant. 


      Les frais liés à l'intervention de tiers (huissiers, experts, traducteurs, avocats spécialisés dans d'autres domaines) ou les frais de justice (droits de greffe) sont refacturés au prix coûtant ou directement payables au tiers intervenant.
  forfaits:
    title: Exemples de formules forfaitaires
    intro: Les formules forfaitaires suivantes sont données à titre indicatif
      uniquement, le montant des honoraires convenu dépendra de la nature du
      travail à accomplir, de l'importance financière et morale de la cause, de
      la nature et l'ampleur du travail accompli, de l'urgence, du résultat
      obtenu et de votre capacité financière. La TVA est de 21%.
    exemples:
      - title: Procédure judiciaire - Contestation d'un licenciement
        description: (par exemple pour motif grave, licenciement abusif,
          discriminatoire, manifestement déraisonnable)
        prix: 290 € htva / mois pendant 24 mois (soit 6.960 € htva) + 10% sur les
          résultats nets obtenus
        services:
          - Montant couvrant un degré de juridiction
          - Analyse du dossier
          - Calcul des indemnités
          - Introduction de la procédure
          - Rédaction des conclusions
          - Plaidoiries
          - Suivi de l'exécution
          - Vérification des documents sociaux
          - Relations avec l'avocat adverse et la juridiction
        note: Dans le cadre du forfait, je réponds à toutes vos questions sur la
          procédure en cours et vous tiens informé(e) de chaque avancée. Je
          m'efforce d'être disponible tout en préservant le temps nécessaire
          pour avancer efficacement sur les dossiers.
        condition: Facturation des heures prestées au tarif horaire convenu en cas
          d'accord amiable + 10% sur les résultats nets obtenus
      - title: Consultation 30 min "one shot" - Avoir une réponse rapide à une question
        options:
          - description: Sans analyse de documents
            prix: 75 € htva
          - description: Avec analyse de documents
            prix: 200 € htva
      - title: Règlement de travail
        prix: 2.000 € htva
        services:
          - Rédaction ou mise à jour du règlement de travail
          - Accompagnement dans le cadre de la procédure d'affichage et de dépôt
            auprès de l'inspection du travail
  transparence:
    title: Transparence
    points:
      - Le premier contact vise généralement à identifier vos besoins et si je
        suis la bonne personne pour y répondre.
      - Nous discutons des conditions financières dès le premier entretien.
      - Vous recevrez ensuite une proposition de prix écrite ainsi que toutes
        les conditions de mon intervention.
  assurance:
    title: Pensez à l'assurance protection juridique
    content: >
      L'assurance protection juridique (ou « défense en justice ») peut vous
      permettre d'économiser beaucoup d'argent. 


      Plusieurs assureurs en Belgique proposent une assurance protection juridique qui couvre les conflits dans le cadre d'une relation de travail (Ethias, Arag, Das, Arces), que vous soyez un.e travailleur.euse ou une entreprise.


      Vérifiez avec votre courtier ou votre assurance si vous êtes couverts ou si une telle assurance peut être souscrite et le délai d'attente.
       
      Dans ce cas, tout ou une partie de vos frais d'avocat seront payés par votre assurance et non par vous.
  tarifs:
    title: Tarifs
    travailleur: Vous êtes un travailleur
    employeur: Vous êtes un employeur
  aideJuridique:
    title: Aide juridique (pro deo)
    content: >-
      L'aide juridique permet à toute personne de bénéficier d'une première
      consultation juridique gratuite (aide juridique de 1ère ligne). Elle
      permet également à certaines catégories de personnes de bénéficier de
      l'assistance gratuite d'un.e avocat.e pour le traitement d'un dossier dans
      toutes les matières juridiques (aide juridique de 2ème ligne). Ces
      avocat.e.s sont volontaires et fournissent les mêmes services que dans le
      cadre d'une aide juridique payante : conseil, assistance et représentation
      dans le cadre d'une procédure judiciaire, administrative ou dans le cadre
      d'une médiation, introduction d'un recours…


      Si vous souhaitez vous renseigner ou vérifier si vous remplissez les conditions pour bénéficier de l'aide juridique de 2ème ligne, je vous invite à consulter le site [Avocats.be](http://Avocats.be) ou le site du bureau d'aide juridique de votre région (pour [Bruxelles](https://www.bajbruxelles.be/)).


      Si vous remplissez les conditions pour bénéficier de l'aide juridique de 2ème ligne mais que vous souhaitez y renoncer et solliciter mon intervention en dehors de ce cadre, le formulaire téléchargeable [ici](https://docs.google.com/document/d/1342gFQP0Wfvejg3RrRpynr_0xgowMhOHl3XHTDWqWA4/edit?tab=t.0#heading=h.xth8kae1d4z1) devra m'être remis signé.
  subtitle: Les honoraires de l'avocat constituent la contrepartie du travail
    qu'il accomplit pour vous.
  title: Honoraires
  video:
    title: En savoir plus
    url: https://youtu.be/Y-SKuT-XqGk
en:
  previsibilite:
    title: Predictability and monthly payment
    full_content: >-
      Not knowing how much your lawyer's intervention will cost can be a source
      of concern.

      I offer most of my services at a fixed, all-inclusive rate payable monthly.

      Therefore, you know exactly what you will pay per month and in total.

      The number of monthly installments is determined together based on your personal situation and your case (for example, the estimated duration of the court proceedings).


      If we choose to work together on an hourly rate basis, my services are billed to you each month as the work progresses.


      There are no file or office fees except for postal expenses which are re-invoiced at cost.


      Costs related to third-party interventions (bailiffs, experts, translators, lawyers specialized in other fields) or court fees (registry fees) are invoiced at cost or directly payable to the intervening third party.
  forfaits:
    title: Examples of fixed fee options
    intro: The following fixed fee options are provided for indicative purposes
      only. The amount of fees agreed between the lawyer and the client will
      depend on the nature of the work to be performed, the financial and moral
      importance of the case, the nature and extent of the work done, the
      urgency, the result obtained and the client's financial capacity. VAT is
      21%.
    exemples:
      - title: Legal proceedings - Contesting a dismissal
        description: (e.g. for serious misconduct, abusive, discriminatory, manifestly
          unreasonable dismissal)
        prix: 290 € excl. VAT / month for 24 months (i.e. 6.960 € excl. VAT) + 10% on
          the net results obtained
        services:
          - Amount covering one degree of jurisdiction
          - File analysis
          - Calculation of compensation
          - Initiating proceedings
          - Drafting of conclusions
          - Pleadings
          - Monitoring of execution
          - Verification of social documents
          - Relations with the opposing lawyer and the jurisdiction
        note: As part of the flat fee, I answer all your questions about the ongoing
          procedure and keep you informed of each step. I strive to be available
          while preserving the time needed to move forward efficiently on cases.
        condition: Billing of hours provided at the agreed hourly rate in case of
          amicable agreement + 10% on the net results obtained
      - title: 30-minute "one-shot" consultation - Getting a quick answer to a question
        options:
          - description: Without document analysis
            prix: 75 € excl. VAT
          - description: With document analysis
            prix: 200 € excl. VAT
      - title: Work regulations
        prix: 2.000 € excl. VAT
        services:
          - Drafting or updating work regulations
          - Support in the posting and filing procedure with the labor
            inspectorate
  transparence:
    title: Transparency
    points:
      - The initial contact aims at identifying your needs and determining if I
        am the right person to address them.
      - We discuss financial terms from the first meeting.
      - You receive a written price proposal and all the conditions of my
        intervention.
  assurance:
    title: Consider legal protection insurance
    content: >-
      Legal Protection Insurance (or "legal defense") can save you a lot of
      money.


      Several insurers in Belgium offer legal protection insurance that covers employment-related issues (Ethias, Arag, Das, Arces), whether you are an employee or an employer.


      If you are not currently insured, you may be eligible for coverage. Be sure to inquire about the waiting period. Insurance coverage is an excellent way to pay for legal fees!
  tarifs:
    title: Rates
    travailleur: You are an employee
    employeur: You are an employer
  aideJuridique:
    title: Free legal aid (pro bono)
    content: >-
      Legal aid allows everyone to benefit from a free initial legal
      consultation (first-line legal aid). It also allows qualified individuals
      to benefit from the free assistance of a lawyer for the handling of a case
      in all legal matters (second-line legal aid). These lawyers are
      volunteers. They provide their clients with the same services as in the
      context of paid legal aid: advice, assistance and representation in the
      context of judicial or administrative proceedings or in the context of
      mediation, filing of appeals, etc.


      If you would like to find out more or check whether you qualify for second-line legal aid, please consult the [Avocats.be](http://Avocats.be) website or the website of the legal aid bureau in your region (for [Brussels](https://www.bajbruxelles.be/)).


      For individuals meeting the conditions for second line legal aid, you may request my assistance outside of this framework. Please  complete the waiver form [here](https://docs.google.com/document/d/1342gFQP0Wfvejg3RrRpynr_0xgowMhOHl3XHTDWqWA4/edit?tab=t.0#heading=h.xth8kae1d4z1), 

      sign, and return to me.
  subtitle: The lawyer's fees are the compensation for the legal services rendered
    for you.
  title: Fees
  video:
    title: Learn more
    url: https://youtu.be/Y-SKuT-XqGk
it:
  previsibilite:
    title: Prevedibilità e pagamento mensile
    full_content: >-
      Non sapere quanto costerà l'intervento del vostro avvocato può essere
      fonte di preoccupazione.

      Vi propongo la maggior parte delle mie prestazioni a una tariffa forfettaria fissa "tutto incluso" pagabile mensilmente.

      Sapete quindi esattamente quanto pagherete al mese e quanto pagherete in totale.

      Il numero di rate mensili viene determinato insieme in base alla vostra situazione personale e al vostro caso (ad esempio, la durata stimata del procedimento in tribunale).


      Se scegliamo di lavorare insieme sulla base di una tariffa oraria, le mie prestazioni vi vengono fatturate ogni mese, man mano che vengono eseguite.


      Non ci sono spese eccetto le spese postali che vengono rifatturate al costo.


      I costi relativi all'intervento di terzi (ufficiali giudiziari, esperti, traduttori, avvocati specializzati in altri settori) o le spese giudiziarie (diritti di cancelleria) vengono rifatturati al costo o sono direttamente pagabili al terzo interveniente.
  forfaits:
    title: Esempi di formule forfettarie
    intro: Le seguenti formule forfettarie sono fornite solo a titolo indicativo.
      L'importo degli onorari concordato tra l'avvocato e il cliente dipenderà
      dalla natura del lavoro da svolgere, dall'importanza finanziaria e morale
      della causa, dalla natura e dall'entità del lavoro svolto, dall'urgenza,
      dal risultato ottenuto e dalla capacità finanziaria del cliente. L'IVA è
      del 21%.
    exemples:
      - title: Procedura giudiziaria - Contestazione di un licenziamento
        description: (ad esempio per giusta causa, licenziamento abusivo,
          discriminatorio, manifestamente irragionevole)
        prix: 290 € IVA esclusa / mese per 24 mesi (cioè 6.960 € IVA esclusa) + 10% sui
          risultati netti ottenuti
        services:
          - Importo che copre un grado di giurisdizione
          - Analisi del fascicolo
          - Calcolo delle indennità
          - Introduzione della procedura
          - Redazione delle conclusioni
          - Arringhe
          - Monitoraggio dell'esecuzione
          - Verifica dei documenti sociali
          - Rapporti con l'avvocato avversario e la giurisdizione
        note: Nel quadro del forfait, rispondo a tutte le vostre domande sulla procedura
          in corso e vi tengo informati di ogni progresso. Mi sforzo di essere
          disponibile preservando al contempo il tempo necessario per avanzare
          efficacemente sui dossier.
        condition: Fatturazione delle ore prestate alla tariffa oraria concordata in
          caso di accordo amichevole + 10% sui risultati netti ottenuti
      - title: Consulenza 30 min "one shot" - Avere una risposta rapida a una domanda
        options:
          - description: Senza analisi di documenti
            prix: 75 € IVA esclusa
          - description: Con analisi di documenti
            prix: 200 € IVA esclusa
      - title: Regolamento di lavoro
        prix: 2.000 € IVA esclusa
        services:
          - Redazione o aggiornamento del regolamento di lavoro
          - Accompagnamento nell'ambito della procedura di affissione e di
            deposito presso l'ispettorato del lavoro
  transparence:
    title: Trasparenza
    points:
      - Il primo contatto mira generalmente a identificare le vostre esigenze e
        se sono la persona giusta per rispondervi.
      - Discutiamo delle condizioni finanziarie fin dal primo incontro.
        Riceverete una proposta di prezzo scritta sotto forma di preventivo.
      - Se decidete di lavorare con me
      - firmiamo insieme un accordo che riporta tutte le condizioni del mio
        intervento.
  assurance:
    title: Pensate all'assicurazione di protezione giuridica
    content: >
      L'assicurazione di Protezione Giuridica (o "difesa in giudizio") può farvi
      risparmiare molto denaro.


      Diversi assicuratori in Belgio offrono un'assicurazione di protezione giuridica che copre i conflitti nell'ambito di un rapporto di lavoro (Ethias, Arag, Das, Arces), sia che siate lavoratori o datori di lavoro.


      Verificate con il vostro broker o assicuratore se siete coperti o se tale assicurazione può essere sottoscritta e il periodo di attesa.
       
      In questo caso, tutti o parte dei vostri onorari legali saranno pagati dalla vostra assicurazione e non da voi.
  tarifs:
    title: Tariffe
    travailleur: Sei un lavoratore
    employeur: Sei un datore di lavoro
  aideJuridique:
    title: Assistenza legale (pro bono)
    content: >
      L'assistenza legale permette a chiunque di beneficiare di una prima
      consulenza legale gratuita (assistenza legale di 1° livello). Permette
      inoltre a determinate categorie di persone di beneficiare dell'assistenza
      gratuita di un avvocato per il trattamento di un caso in tutte le materie
      legali (assistenza legale di 2° livello). Questi avvocati sono volontari.
      Forniscono ai loro clienti gli stessi servizi che nel contesto
      dell'assistenza legale a pagamento: consulenza, assistenza e
      rappresentanza nel contesto di un procedimento giudiziario, amministrativo
      o nell'ambito di una mediazione, presentazione di un ricorso, ecc.


      Se desiderate informarvi o verificare se soddisfate le condizioni per beneficiare dell'assistenza legale di 2° livello, vi invito a consultare il sito [Avocats.be](http://Avocats.be) o il sito dell'ufficio di assistenza legale della vostra regione (per [Bruxelles](https://www.bajbruxelles.be/)).


      Se soddisfate le condizioni per beneficiare dell'assistenza legale di 2° livello ma desiderate rinunciarvi e richiedere il mio intervento al di fuori di questo quadro, il modulo scaricabile [qui](https://docs.google.com/document/d/1342gFQP0Wfvejg3RrRpynr_0xgowMhOHl3XHTDWqWA4/edit?tab=t.0#heading=h.xth8kae1d4z1) dovrà essermi consegnato firmato.
  subtitle: Gli onorari dell'avvocato costituiscono il compenso per il lavoro
    svolto per voi.
  title: Onorari
  video:
    title: Per saperne di più
    url: https://youtu.be/Y-SKuT-XqGk
