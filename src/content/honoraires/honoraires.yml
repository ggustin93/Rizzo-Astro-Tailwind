fr:
  previsibilite:
    title: Ce que couvrent nos honoraires
    full_content: >-
      **Prestations visibles et invisibles**


      Nos honoraires rémunèrent l'ensemble des prestations accomplies dans le cadre de votre dossier. Certaines sont directement visibles : les réunions, les plaidoiries, la rédaction de conclusions ou de courriers. D'autres, tout aussi indispensables, le sont moins : l'étude approfondie du dossier, les recherches juridiques, les échanges avec les parties adverses, les démarches administratives, la préparation des pièces, le temps d'attente aux audiences.


      **Votre rôle dans la maîtrise des coûts** 


      Pour maîtriser vos coûts, nous vous invitons à transmettre des documents complets et structurés, à regrouper vos questions dans la mesure du possible, et à répondre rapidement à nos demandes. Une collaboration fluide accélère le traitement de votre dossier et optimise le temps facturable.


      **L'IA au service de votre dossier** 


      Nous utilisons des outils d'intelligence artificielle (notamment JEF, outil spécialisé pour les avocats belges, ainsi que d'autres outils comme Claude ou ChatGPT, toujours de manière anonymisée) pour gagner en efficacité sans jamais déléguer le raisonnement juridique.


      Concrètement, cela se traduit par une meilleure réactivité, des délais de traitement réduits et un rapport qualité-prix optimisé pour vous. Notre expertise juridique reste au cœur de chaque décision : l'IA est un outil, le jugement de l'avocat est irremplaçable.


      De votre côté, un message court et ciblé reste toujours le plus efficace, qu'il soit rédigé par vous ou avec l'aide d'un outil IA. Pensez à vérifier que les points soulevés n'ont pas déjà reçu une réponse avant d'envoyer : cela accélère le traitement de votre dossier et maîtrise vos honoraires.
  forfaits:
    title: Transparence & prévisibilité
    intro: >-
      Les modalités de calcul de nos honoraires vous sont communiquées par écrit
      avant le début de notre intervention.


      Nous travaillons soit à un tarif horaire — facturé mensuellement, au fur et à mesure des prestations — soit, dans certains cas, à un forfait fixe "tout compris", augmenté le cas échéant d'un honoraire de résultat. Il n'y a pas de frais de dossier ni de frais de bureau. Un détail des prestations accomplies est joint à chaque facture. 


      Nous demandons régulièrement des provisions au cours du dossier, afin d'assurer un suivi financier transparent et d'éviter l'accumulation de montants importants en fin de mission.


      Les frais liés à l'intervention de tiers (huissiers, experts, traducteurs) ou les frais de justice sont refacturés au prix coûtant ou directement payables au tiers concerné.
    exemples: []
  transparence:
    title: Besoin d'un premier avis ?
    points:
      - >-
        Le premier rendez-vous est facturé 275 € TVAC. 


        Réservez directement votre créneau via notre calendrier en ligne. N'hésitez pas à apporter tous les documents que vous jugez utiles (contrat de travail, correspondances, fiches de paie, etc.) pour que nous puissions analyser votre situation concrètement dès ce premier échange.
  assurance:
    title: Pensez à l'assurance protection juridique
    content: >
      L'assurance protection juridique (ou « défense en justice ») peut vous
      permettre d'économiser beaucoup d'argent. 


      Plusieurs assureurs en Belgique proposent une assurance protection juridique qui couvre les conflits dans le cadre d'une relation de travail (Ethias, Arag, DAS, Arces), que vous soyez un travailleur ou une entreprise.


      Vérifiez avec votre courtier ou votre assurance si vous bénéficiez d'une telle couverture ou si une telle assurance peut être souscrite et le délai d'attente.
       
      Dans ce cas, tout ou une partie de vos frais d'avocat seront payés par votre assurance et non par vous.
  tarifs:
    title: Tarifs
    travailleur: Vous êtes un travailleur
    employeur: Vous êtes un employeur
  aideJuridique:
    title: Aide juridique (pro deo)
    content: >-
      L'aide juridique permet à toute personne de bénéficier d'une première
      consultation juridique gratuite (aide juridique de 1ère ligne). Elle
      permet également à certaines catégories de personnes de bénéficier de
      l'assistance gratuite d'un avocat pour le traitement d'un dossier dans
      toutes les matières juridiques (aide juridique de 2ème ligne). Ces avocats
      sont volontaires et fournissent les mêmes services que dans le cadre d'une
      aide juridique payante : conseil, assistance et représentation dans le
      cadre d'une procédure judiciaire, administrative ou dans le cadre d'une
      médiation, introduction d'un recours…


      Si vous souhaitez vous renseigner ou vérifier si vous remplissez les conditions pour bénéficier de l'aide juridique de 2ème ligne, nous vous invitons à consulter le site [Avocats.be](http://Avocats.be) ou le site du bureau d'aide juridique de votre région (pour [Bruxelles](https://www.bajbruxelles.be/)).


      Si vous remplissez les conditions pour bénéficier de l'aide juridique de 2ème ligne mais que vous souhaitez y renoncer et solliciter notre intervention en dehors de ce cadre, nous vous soumettrons un formulaire de renonciation à signer.
  subtitle: Une relation de confiance commence par une tarification claire. Voici
    comment nous travaillons.
  title: Honoraires
  video:
    title: En savoir plus
    url: https://youtu.be/Y-SKuT-XqGk
  seo:
    description: Tarif horaire ou forfait, sans frais de dossier. Premier
      rendez-vous à 275 € TVAC. Rizzo & Michiels vous explique clairement le
      coût de notre intervention avant tout engagement.
en:
  previsibilite:
    title: What our fees cover
    full_content: >-
      Our fees cover all the work carried out on your matter. Some of it is
      directly visible: meetings, court hearings, drafting submissions or
      letters. Other work, just as essential, is less visible: in-depth study of
      the file, legal research, exchanges with the opposing parties,
      administrative formalities, preparing documents, waiting time at hearings.


      To keep your costs under control, we invite you to send complete and well-organised documents, to group your questions together where possible, and to respond promptly to our requests. Smooth collaboration speeds up the handling of your matter and optimises billable time.


      We use artificial intelligence tools (in particular JEF, a tool designed for Belgian lawyers, as well as other tools such as Claude or ChatGPT, always with anonymised data) to work more efficiently, without ever delegating legal reasoning.


      In practice, this means greater responsiveness, shorter turnaround times and better value for money for you. Our legal expertise remains at the heart of every decision: AI is a tool, a lawyer's judgement is irreplaceable.


      On your side, a short and focused message is always the most effective, whether you write it yourself or with the help of an AI tool. Please check that the points you raise have not already been answered before sending: this speeds up the handling of your matter and keeps your fees under control.
  forfaits:
    title: Transparency & predictability
    intro: >-
      The way our fees are calculated is communicated to you in writing before
      we begin working on your matter.


      We work either at an hourly rate, billed monthly as the work progresses, or, in certain cases, at a fixed "all-inclusive" fee, plus a success fee where applicable. There are no file-opening or office fees. A breakdown of the work carried out is attached to each invoice.


      We regularly request advance payments during the matter, to ensure transparent financial follow-up and to avoid large amounts building up at the end of the engagement.


      Costs related to the involvement of third parties (bailiffs, experts, translators) and court costs are re-invoiced at cost or are payable directly to the third party concerned.
    exemples: []
  transparence:
    title: Need a first opinion?
    points:
      - Book your slot directly via our online calendar. The first meeting is
        billed at €275, VAT included. Feel free to bring any documents you
        consider useful (employment contract, correspondence, payslips, etc.) so
        that we can analyse your situation in concrete terms from this first
        meeting.
  assurance:
    title: Consider legal protection insurance
    content: >-
      Legal expenses insurance (or ‘legal defence cover’) can save you a lot of
      money.


      Several insurers in Belgium offer legal expenses insurance that covers disputes arising from an employment relationship (Ethias, Arag, DAS, Arces), whether you are an employee or a business.


      Check with your broker or insurer to see if you are covered under such a policy, whether you can take out such cover, and what the waiting period is.
       
      In this case, all or part of your legal fees will be paid by your insurer rather than by you.
  tarifs:
    title: Rates
    travailleur: You are an employee
    employeur: You are an employer
  aideJuridique:
    title: Free legal aid (pro deo)
    content: >-
      Legal aid allows everyone to benefit from a free initial legal
      consultation (first-line legal aid). It also allows qualified individuals
      to benefit from the free assistance of a lawyer for the handling of a case
      in all legal matters (second-line legal aid). These lawyers are
      volunteers. They provide their clients with the same services as in the
      context of paid legal aid: advice, assistance and representation in the
      context of judicial or administrative proceedings or in the context of
      mediation, filing of appeals, etc.


      If you would like to find out more or check whether you qualify for second-line legal aid, please consult the [Avocats.be](http://Avocats.be) website or the website of the legal aid bureau in your region (for [Brussels](https://www.bajbruxelles.be/)).


      If you meet the eligibility requirements for second-line legal aid but wish to waive your entitlement and engage our services outside this scheme, we will provide you with a waiver form to sign.
  subtitle: A relationship of trust starts with clear pricing. Here is how we work.
  title: Fees
  video:
    title: Learn more
    url: https://youtu.be/Y-SKuT-XqGk
  seo:
    description: Hourly rate or fixed fee, with no file-opening costs. First meeting
      €275, VAT included. Rizzo & Michiels clearly explains the cost of our work
      before any commitment.
it:
  previsibilite:
    title: Cosa coprono i nostri onorari
    full_content: >-
      #### Prestazioni visibili e meno visibili


      I nostri onorari coprono tutte le attività svolte nell'ambito della Sua pratica. Alcune sono immediatamente percepibili, come gli incontri, le udienze, la redazione di atti difensivi e di corrispondenza. Altre, altrettanto essenziali, sono meno visibili: l'esame approfondito del fascicolo, le ricerche giuridiche, gli scambi con la controparte, gli adempimenti amministrativi, la preparazione della documentazione e i tempi di attesa in udienza.


      #### Come contribuire a contenere i costi


      Per contenere i costi della Sua pratica, La invitiamo a trasmetterci documenti completi e ben organizzati, a raggruppare, ove possibile, le Sue domande e a rispondere tempestivamente alle nostre richieste. Una collaborazione efficace facilita la gestione del fascicolo e consente di limitare il tempo dedicato alle attività fatturabili.


      #### L'intelligenza artificiale al servizio della Sua pratica


      Ci avvaliamo di strumenti di intelligenza artificiale, tra cui JEF, una soluzione specializzata per gli avvocati belgi, nonché strumenti come Claude e ChatGPT, utilizzati previa anonimizzazione dei dati. Questi strumenti ci consentono di lavorare con maggiore efficienza, senza mai delegare all'intelligenza artificiale l'analisi e il ragionamento giuridico.


      In concreto, il loro utilizzo ci permette di rispondere più rapidamente, ridurre i tempi di gestione delle pratiche e migliorare il rapporto tra qualità del servizio e costi. La competenza giuridica rimane al centro di ogni intervento: l'intelligenza artificiale è uno strumento di supporto, mentre la valutazione professionale dell'avvocato resta insostituibile.


      Anche da parte Sua, comunicazioni brevi e mirate contribuiscono a una gestione più efficiente della pratica, indipendentemente dal fatto che siano redatte personalmente o con l'ausilio di strumenti di intelligenza artificiale. Prima di inviare un messaggio, La invitiamo a verificare che le questioni sollevate non abbiano già ricevuto risposta. Ciò permette di evitare scambi superflui, accelerare la gestione della pratica e contenere gli onorari.
  forfaits:
    title: Trasparenza
    intro: >-
      Le modalità di calcolo dei nostri onorari Le vengono comunicate per
      iscritto prima dell'inizio del nostro intervento.


      Lavoriamo a tariffa oraria, con fatturazione mensile delle prestazioni man mano che vengono svolte, oppure, in determinati casi, a forfait fisso «tutto compreso», eventualmente maggiorato di un onorario di risultato. Non applichiamo spese di apertura della pratica né spese d'ufficio. Ogni fattura è accompagnata dal dettaglio delle prestazioni svolte.


      Nel corso della pratica, Le chiediamo regolarmente il versamento di acconti, al fine di garantire un monitoraggio finanziario trasparente ed evitare l'accumulo di importi elevati alla conclusione dell'incarico.


      Le spese relative all'intervento di terzi (ufficiali giudiziari, periti, traduttori), così come le spese giudiziarie, vengono riaddebitate al costo effettivo oppure pagate direttamente al terzo interessato.
    exemples: []
  transparence:
    title: Desidera un primo parere?
    points:
      - >-
        Consulti le disponibilità direttamente sul nostro calendario online e
        prenoti il Suo appuntamento. Il primo colloquio è fatturato 275 € IVA
        inclusa.


        Non esiti a portare con sé tutti i documenti che ritiene utili (contratto di lavoro, corrispondenza, buste paga, ecc.), così da consentirci di esaminare concretamente la Sua situazione fin dal primo incontro.
  assurance:
    title: Valuti l'assicurazione di tutela legale
    content: >-
      Un'assicurazione di tutela legale, detta anche «assicurazione di difesa in
      giudizio», può consentirLe di risparmiare somme considerevoli.


      Diversi assicuratori operanti in Belgio, tra cui Ethias, Arag, DAS e ARCES, propongono polizze che coprono le controversie nell'ambito di un rapporto di lavoro, sia per i lavoratori sia per i datori di lavoro.


      Le consigliamo di verificare con il Suo intermediario assicurativo o con la Sua compagnia se dispone già di una copertura applicabile alla Sua situazione, se sia possibile sottoscriverne una e quale sia l'eventuale periodo di carenza.


      Se la Sua polizza copre la controversia, l'assicurazione potrà farsi carico di tutti o di parte degli onorari legali, evitando che tali costi ricadano interamente su di Lei.
  tarifs:
    title: Tariffe
    travailleur: Sei un lavoratore
    employeur: Sei un datore di lavoro
  aideJuridique:
    title: Patrocinio a spese dello Stato - Assistenza pro deo
    content: >-
      L'assistenza legale consente a chiunque di beneficiare di una prima
      consulenza giuridica gratuita (*assistenza legale di prima linea*).
      Inoltre, determinate categorie di persone possono beneficiare, in base ai
      requisiti previsti, dell'assistenza gratuita di un avvocato per la
      gestione di una pratica in qualsiasi ambito giuridico (*assistenza legale
      di seconda linea*).


      Gli avvocati che prestano assistenza legale operano su base volontaria e offrono gli stessi servizi previsti nell'ambito di un incarico retribuito: consulenza, assistenza e rappresentanza in procedimenti giudiziari o amministrativi, nell'ambito di una mediazione, nella presentazione di un ricorso e in altre attività connesse alla pratica.


      Se desidera ottenere maggiori informazioni o verificare se possiede i requisiti per beneficiare dell'assistenza legale di seconda linea, La invitiamo a consultare il sito di Avocats.be oppure quello dell'Ufficio di assistenza legale competente per la Sua regione, ad esempio [l'Ufficio di assistenza legale di Bruxelles](https://www.bajbruxelles.be/).


      Se possiede i requisiti per beneficiare dell'assistenza legale di seconda linea, ma desidera rinunciarvi per avvalersi della nostra assistenza al di fuori di tale regime, Le sottoporremo un modulo di rinuncia da firmare.
  subtitle: Un rapporto di fiducia inizia con tariffe chiare. Ecco come lavoriamo.
  title: Onorari
  video:
    title: Per saperne di più
    url: https://youtu.be/Y-SKuT-XqGk
  seo:
    description: Tariffa oraria o forfait, senza spese di apertura pratica. Primo
      appuntamento a 275 € IVA inclusa. Rizzo & Michiels vi spiega chiaramente
      il costo del nostro intervento prima di qualsiasi impegno.
nl:
  previsibilite:
    title: Wat onze erelonen dekken
    full_content: >-
      Onze erelonen vergoeden alle prestaties die in het kader van uw dossier
      worden verricht. Sommige zijn rechtstreeks zichtbaar: vergaderingen,
      pleidooien, het opstellen van conclusies of brieven. Andere, even
      onmisbaar, zijn minder zichtbaar: de grondige studie van het dossier,
      juridisch opzoekingswerk, de contacten met de tegenpartijen,
      administratieve stappen, het voorbereiden van de stukken, de wachttijd op
      zittingen.


      Om uw kosten te beheersen, vragen wij u volledige en gestructureerde documenten te bezorgen, uw vragen zoveel mogelijk te bundelen en snel op onze verzoeken te reageren. Een vlotte samenwerking versnelt de behandeling van uw dossier en optimaliseert de factureerbare tijd.


      Wij gebruiken tools op basis van artificiële intelligentie (met name JEF, een tool speciaal voor Belgische advocaten, en andere tools zoals Claude of ChatGPT, steeds geanonimiseerd) om efficiënter te werken, zonder ooit het juridische denkwerk uit handen te geven.


      Concreet betekent dit voor u een grotere reactiesnelheid, kortere behandelingstermijnen en een betere prijs-kwaliteitverhouding. Onze juridische expertise blijft de kern van elke beslissing: AI is een hulpmiddel, het oordeel van de advocaat is onvervangbaar.


      Van uw kant blijft een kort en gericht bericht altijd het meest efficiënt, of u het nu zelf schrijft of met behulp van een AI-tool. Controleer vóór het verzenden of de aangehaalde punten nog niet werden beantwoord: dat versnelt de behandeling van uw dossier en houdt uw erelonen onder controle.
  forfaits:
    title: Transparantie & voorspelbaarheid
    intro: >-
      De berekeningswijze van onze erelonen wordt u schriftelijk meegedeeld vóór
      de aanvang van onze tussenkomst.


      Wij werken ofwel tegen een uurtarief, maandelijks gefactureerd naarmate de prestaties worden verricht, ofwel, in bepaalde gevallen, tegen een vast forfait "alles inbegrepen", in voorkomend geval verhoogd met een resultaatsereloon. Er zijn geen dossier- of kantoorkosten. Bij elke factuur wordt een overzicht van de verrichte prestaties gevoegd.


      In de loop van het dossier vragen wij regelmatig provisies, om een transparante financiële opvolging te verzekeren en te vermijden dat zich op het einde van de opdracht hoge bedragen opstapelen.


      Kosten verbonden aan de tussenkomst van derden (gerechtsdeurwaarders, deskundigen, vertalers) en gerechtskosten worden tegen kostprijs doorgerekend of zijn rechtstreeks aan de betrokken derde verschuldigd.
    exemples: []
  transparence:
    title: Nood aan een eerste advies?
    points:
      - Reserveer rechtstreeks uw tijdslot via onze online agenda. Het eerste
        gesprek wordt aangerekend aan 275 €, btw inbegrepen. Breng gerust alle
        documenten mee die u nuttig acht (arbeidsovereenkomst, briefwisseling,
        loonfiches, enz.), zodat wij uw situatie al tijdens dit eerste gesprek
        concreet kunnen analyseren.
  assurance:
    title: Denk aan de rechtsbijstandsverzekering
    content: >
      De rechtsbijstandsverzekering (of « verdediging in rechte ») kan u veel
      geld besparen.


      Verschillende verzekeraars in België bieden een rechtsbijstandsverzekering aan die geschillen in het kader van een arbeidsrelatie dekt (Ethias, Arag, Das, Arces), of u nu werknemer of onderneming bent.


      Ga bij uw makelaar of verzekeraar na of u gedekt bent, dan wel of een dergelijke verzekering kan worden afgesloten, en welke wachttijd geldt.

      In dat geval worden uw advocatenkosten geheel of gedeeltelijk door uw verzekering betaald en niet door u.
  tarifs:
    title: Tarieven
    travailleur: U bent werknemer
    employeur: U bent werkgever
  aideJuridique:
    title: Juridische bijstand (pro deo)
    content: >-
      De juridische bijstand stelt eenieder in staat een eerste gratis
      juridische consultatie te krijgen (eerstelijnsbijstand). Zij stelt
      bepaalde categorieën van personen eveneens in staat kosteloos te worden
      bijgestaan door een advocaat voor de behandeling van een dossier in alle
      rechtstakken (tweedelijnsbijstand). Deze advocaten treden vrijwillig op en
      leveren dezelfde diensten als in het kader van een betalende
      dienstverlening: advies, bijstand en vertegenwoordiging in het kader van
      een gerechtelijke of administratieve procedure of in het kader van een
      bemiddeling, het instellen van een beroep…


      Wenst u zich te informeren of na te gaan of u voldoet aan de voorwaarden voor tweedelijnsbijstand, dan nodigen wij u uit de website [Avocats.be](http://Avocats.be) te raadplegen of die van het bureau voor juridische bijstand van uw regio (voor [Brussel](https://www.bajbruxelles.be/)).


      Indien u in aanmerking komt voor juridische tweedelijnsbijstand, maar hiervan afstand wenst te doen en een beroep wilt doen op onze diensten buiten dit stelsel, zullen wij u een te ondertekenen afstandsverklaring bezorgen.
  subtitle: Een vertrouwensrelatie begint met duidelijke tarieven. Zo werken wij.
  title: Erelonen
  video:
    title: Meer weten
    url: https://youtu.be/Y-SKuT-XqGk
  seo:
    description: Uurtarief of forfait, zonder dossierkosten. Eerste afspraak aan 275
      €, btw inbegrepen. Rizzo & Michiels legt u duidelijk uit wat onze
      tussenkomst kost, nog vóór u zich tot iets verbindt.
