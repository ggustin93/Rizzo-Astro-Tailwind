fr:
  title: Fonctionnaires et institutions européennes
  navigationCards:
    agences: Vous êtes une institution, organe ou agence européenne
    fonctionnaires: Vous êtes fonctionnaire ou agent européen
  agences:
    title: Vous êtes une institution, organe ou agence européenne
    intro: >
      Nous accompagnons les institutions, organes ou agences européennes dans la
      gestion quotidienne de leurs relations avec leurs membres du personnel
      ainsi que dans leurs projets stratégiques RH. Nous travaillons en étroite
      collaboration avec vos équipes RH et juridiques et répondons aux demandes
      et réclamations des fonctionnaires et agents. Nous intervenons
      régulièrement devant les juridictions compétentes belges et européennes.

      Notre expertise combine le droit du travail belge et les spécificités du droit de la fonction publique européenne.
    accompagnementTitle: Accompagnement et défense des institutions, organes ou agences européennes
    accompagnement:
      - title: "Conseil et accompagnement dans la mise en place de politiques RH"
        items:
          - Concours, procédures de sélection et recrutement
          - Bien-être au travail et prévention
          - Diversité
          - Protection des données à caractère personnel (RGPD) dans la relation statutaire
          - Organisation du travail, gestion des absences de courte ou longue durée (maladie, burn-out), télétravail (depuis l’étranger)
      - title: "Gestion du contentieux administratif interne et judiciaire devant la Cour de justice de l’Union européenne"
        items:
          - Concours, procédures de sélection et recrutement
          - Harcèlement moral ou sexuel au travail
          - Discrimination et égalité de traitement
          - Évaluation, promotion et évolution de carrière
          - Non-renouvellement de contrat d’agent contractuel ou temporaire
          - Composition de la rémunération (indemnité de dépaysement, allocations familiales, frais de voyages et autres indemnités et remboursements)
          - Droits de pension (transferts-IN et OUT)
          - Enquêtes et sanctions disciplinaires
          - Couverture RCAM et remboursement des frais médicaux
          - Gestion des absences (contrôle médical, congés spéciaux)
          - Mobilité et détachement
    servicesTitle: Nos services
    services:
      - icon: CheckSquare
        text: Rédaction des réponses aux demandes (art. 90 §1 du statut), demandes
          d’assistance (art. 24 du statut) et aux réclamations (art. 90 §2 du
          statut)
      - icon: FileText
        text: "Rédaction et révision de contrats, politiques RH, règlements internes et
          documents RGPD "
      - icon: Handshake
        text: Conseil en gestion de la relation de travail, du recrutement à la fin de
          collaboration
      - icon: BriefCase
        text: Négociation d'accords amiables et résolution confidentielle des conflits
      - icon: Shield
        text: "Défense devant les autorités internes compétentes et les juridictions
          belges et européennes "
  fonctionnaires:
    title: Vous êtes fonctionnaire ou agent européen
    intro: >
      Vous êtes fonctionnaire ou agent au sein d’une agence ou d’une institution
      européenne et vous êtes confronté à une difficulté professionnelle ?

      Nous vous accompagnons à chaque étape de votre parcours professionnel, que ce soit pour un conseil ponctuel, une situation sensible ou un contentieux.

      Nous intervenons devant les organes internes des institutions et agences européennes ainsi que devant la Cour de justice de l’Union européenne.
    accompagnementTitle: Accompagnement et défense des fonctionnaires et agents européens
    accompagnement:
      - Concours et procédures de sélection
      - "Recrutement et conditions d’engagement "
      - Harcèlement moral ou sexuel au travail
      - Discrimination et égalité de traitement
      - Évaluation, promotion et évolution de carrière
      - Non-renouvellement de contrat d’agent contractuel ou temporaire
      - Composition de la rémunération (indemnité de dépaysement, allocations
        familiales, frais de voyages et autres indemnités et remboursements)
      - "Droits de pension (transferts-IN et OUT) "
      - Enquêtes et sanctions disciplinaires
      - Couverture RCAM et remboursement des frais médicaux,
      - Gestion des absences (contrôle médical, congés spéciaux, télétravail)
      - Mobilité et détachement
      - Lanceurs d’alerte
      - Protection des données à caractère personnel (RGPD) dans la relation
        statutaire
    servicesTitle: Nos services
    services:
      - icon: BriefCase
        text: Analyse de votre situation professionnelle et de vos droits
      - icon: Handshake
        text: Conseils stratégiques avant toute démarche
      - icon: FileText
        text: Rédaction des demandes (art. 90 §1 du statut), demandes d’assistance (art.
          24 du statut), réclamations (art. 90 §2 du statut)
      - icon: FileText
        text: "Assistance dans les procédures administratives internes et les procédures
          contentieuses devant la Cour de justice de l’Union européenne "
      - icon: Shield
        text: Défense devant les juridictions compétentes
  ctaText: En savoir plus sur les tarifs
  seo:
    title: Droit du travail · Institutions européennes | Rizzo & Michiels
    description: Expertise en droit du travail pour les institutions, organes et
      agences, fonctionnaires et agents de l'Union  européenne. Conseils,
      défense et accompagnement juridique personnalisé à Bruxelles.
    image: https://rizzo-michiels.be/default-social-image.png
    keywords:
      - avocat institutions européennes Bruxelles
      - droit du travail fonctionnaires européens
      - conseil juridique agences européennes
      - défense agents institutions EU
      - litige travail institutions européennes Belgique
      - accompagnement juridique personnalisé institutions européennes
en:
  title: European institutions and agencies
  navigationCards:
    agences: You are a European institution, body or agency
    fonctionnaires: You are a EU civil servant or agent
  agences:
    title: You are a European institution, body or agency
    intro: >
      We support European institutions, bodies and agencies in the day-to-day
      management of their relationships with staff members as well as in their
      strategic HR projects and policies. We work in close cooperation with your
      internal HR and legal teams and prepare the replies to requests and
      complaints (art. 90(1) and 90(2) of the Staff Regulations). We defend your
      institution or body before the competent Belgian and European courts.

      Our expertise combines Belgian employment law with the specifics of European civil service law.
    accompagnementTitle: Support and defence of European institutions, bodies and agencies
    accompagnement:
      - title: "Advice and support in implementing HR policies"
        items:
          - Competitions, selection procedures and recruitment
          - Well-being at work and prevention
          - Diversity
          - Protection of personal data (GDPR) in the statutory relationship
          - Work organisation, management of short- and long-term absences (illness, burnout), teleworking (including from abroad)
      - title: "Handling internal administrative and judicial litigation before the Court of Justice of the European Union"
        items:
          - Competitions, selection procedures and recruitment
          - Psychological or sexual harassment at work
          - Discrimination and equal treatment
          - Evaluation, promotion and career development
          - Non-renewal of contracts of contract or temporary staff
          - Composition of remuneration (expatriation allowance, family allowances, travel expenses and other allowances and reimbursements)
          - Pension rights (IN and OUT transfers)
          - Disciplinary investigations and sanctions
          - JSIS cover and reimbursement of medical expenses
          - Management of absences (medical checks, special leave)
          - Mobility and secondment
    servicesTitle: Our services
    services:
      - icon: CheckSquare
        text: Drafting replies to requests (art. 90(1) of the Staff Regulations),
          requests for assistance (Art. 24 of the Staff Regulations) and
          complaints (Art. 90(2) of the Staff Regulations)
      - icon: FileText
        text: Drafting and reviewing contracts, HR policies, internal rules and GDPR
          documentation
      - icon: Handshake
        text: Advice on managing the work relationship, from recruitment to termination
          of service
      - icon: BriefCase
        text: Negotiation of amicable settlements and confidential dispute resolution
      - icon: Shield
        text: Representation before the competent internal authorities and the Belgian
          and European courts
  fonctionnaires:
    title: You are a European civil servant, contract or temporary agent
    intro: >+
      Are you a European official or member of staff within a European agency,
      body or institution facing a professional difficulty?

      We support you at every stage of your professional career, whether you require occasional advice, assistance in a sensitive situation, or representation in litigation.

      We act before the internal bodies of European institutions, bodies and agencies, as well as before the Court of Justice of the European Union.

    accompagnementTitle: Support and defence of European officials and agents
    accompagnement:
      - Competitions and selection procedures
      - "Recruitment and conditions of engagement "
      - "Psychological or sexual harassment at work "
      - "Discrimination and equal treatment "
      - "Evaluation, promotion and career progression "
      - Non-renewal of contracts (contractual or temporary staff)
      - Composition of remuneration (expatriation allowance, family allowances,
        travel expenses and other allowances and reimbursements)
      - "Pension rights (transfers-IN and -OUT ) "
      - "Disciplinary investigations and sanctions "
      - "JSIS cover and reimbursement of medical expenses "
      - Management of absences (medical checks, special leaves)
      - "Mobility and secondment "
      - "Whistleblowing "
      - "Protection of personal data (GDPR) in the statutory relationship "
    servicesTitle: Our services
    services:
      - icon: CheckSquare
        text: Analysis of your professional situation and rights
      - icon: BriefCase
        text: Strategic advice before any formal step
      - icon: FileText
        text: Drafting requests (art. 90(1) of the Staff Regulations), requests for
          assistance (art. 24 of the Staff Regulations), and complaints (art.
          90(2) of the Staff Regulations)
      - icon: FileText
        text: "Assistance in internal administrative procedures and litigation before
          the Court of Justice of the European Union "
      - icon: Handshake
        text: Negotiation of confidential solutions
      - icon: Shield
        text: Defence before competent courts
  ctaText: Find out more about fees
  seo:
    title: Legal services for European institutions | Rizzo & Michiels Attorneys
    description: Employment law expertise for European agencies, officials and
      agents. Legal advice, defence and personalized legal support in Brussels.
    keywords:
      - European civil service law lawyer Brussels
      - EU employment law expertise
      - European agencies legal advice
      - defense EU institution employees
      - workplace litigation European institutions Belgium
      - personalized legal support EU officials
    image: https://rizzo-michiels.be/default-social-image.png
it:
  title: Istituzioni e agenzie europee
  navigationCards:
    agences: Siete un’istituzione, un organo o un’agenzia europea
    fonctionnaires: Siete un funzionario o un membro del personale europeo
  agences:
    title: Siete un’istituzione, un organo o un’agenzia europea
    intro: >
      Assistiamo le istituzioni, gli organi e le agenzie europee nella gestione
      quotidiana dei rapporti con i membri del personale, nonché nei loro
      progetti e nelle loro politiche strategiche in materia di risorse umane.
      Lavoriamo in stretta collaborazione con i vostri team interni HR e legali
      e predisponiamo le risposte alle richieste e ai reclami (art. 90, parr. 1
      e 2 dello Statuto). Difendiamo la vostra istituzione o il vostro organo
      dinanzi alle autorità giudiziarie belghe ed europee competenti.


      La nostra competenza combina il diritto del lavoro belga con le specificità del diritto della funzione pubblica europea.
    accompagnementTitle: Assistenza e difesa delle istituzioni, degli organi e delle agenzie europee
    accompagnement:
      - title: "Consulenza e supporto nell’attuazione delle politiche HR"
        items:
          - Concorsi, procedure di selezione e reclutamento
          - Benessere sul lavoro e prevenzione
          - Diversità
          - Protezione dei dati personali (GDPR) nel rapporto statutario
          - Organizzazione del lavoro, gestione delle assenze di breve e lunga durata (malattia, burnout), telelavoro (anche dall’estero)
      - title: "Gestione del contenzioso amministrativo interno e giudiziario dinanzi alla Corte di giustizia dell’Unione europea"
        items:
          - Concorsi, procedure di selezione e reclutamento
          - Molestie morali o sessuali sul lavoro
          - Discriminazione e parità di trattamento
          - Valutazione, promozione e sviluppo della carriera
          - Mancato rinnovo dei contratti di agenti contrattuali o temporanei
          - Composizione della retribuzione (indennità di dislocazione, assegni familiari, spese di viaggio e altre indennità e rimborsi)
          - Diritti pensionistici (trasferimenti IN e OUT)
          - Indagini e sanzioni disciplinari
          - Copertura RCAM e rimborso delle spese mediche
          - Gestione delle assenze (controlli medici, congedi speciali)
          - Mobilità e distacco
    servicesTitle: I nostri servizi
    services:
      - icon: CheckSquare
        text: Redazione delle risposte alle richieste (art. 90, par. 1 dello Statuto),
          alle richieste di assistenza (art. 24 dello Statuto) e ai reclami
          (art. 90, par. 2 dello Statuto)
      - icon: FileText
        text: Redazione e revisione di contratti, politiche HR, regolamenti interni e
          documentazione GDPR
      - icon: Handshake
        text: Consulenza nella gestione del rapporto di lavoro, dal reclutamento alla
          cessazione del servizio
      - icon: BriefCase
        text: Negoziazione di accordi amichevoli e risoluzione confidenziale delle
          controversie
      - icon: Shield
        text: Rappresentanza dinanzi alle autorità interne competenti e ai giudici belgi
          ed europei
  fonctionnaires:
    title: Siete un funzionario o un membro del personale europeo
    intro: >
      Siete funzionari o membri del personale di un’agenzia o di un’istituzione
      europea e vi trovate ad affrontare una difficoltà professionale?


      Vi assistiamo in ogni fase del vostro percorso professionale, sia che abbiate bisogno di una consulenza puntuale, di supporto in una situazione delicata o di rappresentanza in un contenzioso.


      Interveniamo dinanzi agli organi interni delle istituzioni e delle agenzie europee, nonché dinanzi alla Corte di giustizia dell’Unione europea.
    accompagnementTitle: Assistenza e difesa dei funzionari e dei membri del personale europei
    accompagnement:
      - Concorsi e procedure di selezione
      - Reclutamento e condizioni di ingaggio
      - Molestie morali o sessuali sul lavoro
      - Discriminazione e parità di trattamento
      - Valutazione, promozione e progressione di carriera
      - Mancato rinnovo dei contratti di agenti contrattuali o temporanei
      - Composizione della retribuzione (indennità di dislocazione, assegni
        familiari, spese di viaggio e altre indennità e rimborsi)
      - Diritti pensionistici (trasferimenti IN e OUT)
      - Indagini e sanzioni disciplinari
      - Copertura RCAM e rimborso delle spese mediche
      - Gestione delle assenze (controlli medici, congedi speciali, telelavoro)
      - Mobilità e distacco
      - Protezione dei dati personali (GDPR) nel rapporto statutario
      - Informatori (whistleblowers)
    servicesTitle: I nostri servizi
    services:
      - icon: CheckSquare
        text: Analisi della vostra situazione professionale e dei vostri diritti e dei
          vostri diritti
      - icon: BriefCase
        text: Consulenza strategica prima di intraprendere qualsiasi iniziativa formale
      - icon: FileText
        text: Redazione di richieste (art. 90, par. 1 dello Statuto), richieste di
          assistenza (art. 24 dello Statuto) e reclami (art. 90, par. 2 dello
          Statuto)
      - icon: Shield
        text: Assistenza nelle procedure amministrative interne e nel contenzioso
          dinanzi alla Corte di giustizia dell’Unione europea
  ctaText: Scopri di più sulle tariffe
  seo:
    title: Servizi legali per le istituzioni europee | Rizzo & Michiels Avvocate
    description: Competenza in diritto del lavoro per agenzie, funzionari e agenti
      delle istituzioni europee. Consulenza legale, difesa e assistenza legale
      personalizzata a Bruxelles.
    keywords:
      - avvocato istituzioni europee Bruxelles
      - diritto del lavoro funzionari europei
      - consulenza legale agenzie europee
      - difesa agenti istituzioni UE
      - contenzioso lavoro istituzioni europee Belgio
      - assistenza legale personalizzata istituzioni europee
    image: https://rizzo-michiels.be/default-social-image.png
