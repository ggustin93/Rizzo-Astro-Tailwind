fr:
  title: Institutions et agences européennes
  navigationCards:
    agences: Vous êtes une agence européenne
    fonctionnaires: Vous êtes fonctionnaire ou agent européen
  agences:
    title: Vous êtes une agence européenne
    intro: >
      Nous accompagnons les agences européennes basées à Bruxelles dans la
      gestion quotidienne de leurs relations de travail et dans leurs projets
      stratégiques. Nous intervenons devant les juridictions compétentes, les
      organes internes ou les autorités nationales, et travaillons en étroite
      collaboration avec vos équipes RH et juridiques.


      Notre expertise combine le droit du travail belge et les spécificités de
      la fonction publique européenne.
    accompagnementTitle: Accompagnement et défense des agences européennes
    accompagnement:
      - Audit en droit du travail et en sécurité sociale
      - GDPR et protection des données du personnel
      - Contrats d'agents contractuels, temporaires, experts nationaux détachés et consultants
      - Problématique des faux indépendants dans un contexte international
      - Fin de collaboration (non-renouvellement, résiliation, licenciement)
      - Régimes de protection contre la rupture de collaboration
      - Packages de rémunération, avantages et politiques de bonus
      - "Organisation du travail : télétravail international, travail hybride, horaires flexibles, droit à la déconnexion"
      - Gestion des absences de courte et longue durée (maladie, burn-out)
      - "Bien-être au travail : harcèlement, enquêtes internes, risques psychosociaux"
      - Discrimination, diversité et égalité de traitement
    servicesTitle: Nos services
    services:
      - icon: CheckSquare
        text: Audit et due diligence en droit du travail belge et européen
      - icon: FileText
        text: Rédaction et révision de contrats, politiques RH, règlements internes et documents GDPR
      - icon: Handshake
        text: Conseil en gestion de la relation de travail, du recrutement à la fin de collaboration
      - icon: BriefCase
        text: Négociation d'accords amiables et résolution confidentielle des conflits
      - icon: Shield
        text: Défense devant les juridictions du travail en Belgique, les inspections sociales et les autorités compétentes
  fonctionnaires:
    title: Vous êtes fonctionnaire européen, agent contractuel ou temporaire
    intro: >
      Vous êtes fonctionnaire européen, agent contractuel ou expert au sein
      d'une agence européenne ou d'une institution européenne, et vous êtes
      confronté à une difficulté professionnelle ?

      Nous vous accompagnons à chaque étape de votre parcours professionnel,
      que ce soit pour un conseil ponctuel, une situation sensible ou un
      contentieux.


      Nous intervenons devant les organes internes des institutions européennes
      ainsi que devant les juridictions compétentes, en tenant compte des
      spécificités du statut de la fonction publique européenne et du cadre
      belge.
    accompagnementTitle: Accompagnement et défense des fonctionnaires et contractuels européens
    accompagnement:
      - Recrutement et conditions d'engagement au sein des institutions et agences européennes
      - Analyse et négociation de contrats d'agents contractuels ou temporaires
      - Statut, droits et obligations des fonctionnaires européens
      - Évaluations, promotions et évolution de carrière
      - Refus de renouvellement de contrat ou fin de mission
      - Licenciement ou résiliation de contrat
      - Mesures disciplinaires et enquêtes administratives
      - Harcèlement moral ou sexuel au travail
      - Discrimination et égalité de traitement
      - Bien-être au travail et risques psychosociaux
      - Gestion des absences (maladie, burn-out, congés spécifiques)
      - Télétravail, mobilité et conditions de travail internationales
      - Protection des données personnelles (GDPR) dans la relation de travail
    servicesTitle: Nos services
    services:
      - icon: CheckSquare
        text: Analyse de votre situation professionnelle et de vos droits
      - icon: BriefCase
        text: Conseil stratégique avant toute démarche (réclamation, recours, négociation)
      - icon: FileText
        text: Assistance dans les procédures internes aux institutions européennes
      - icon: FileText
        text: Rédaction de recours administratifs et accompagnement dans les procédures contentieuses
      - icon: Handshake
        text: Négociation de solutions amiables et confidentielles
      - icon: Shield
        text: Défense devant les juridictions compétentes
  ctaText: En savoir plus sur les tarifs
  seo:
    title: Droit du travail · Institutions européennes | Rizzo & Michiels
    description: Expertise en droit du travail pour les agences, fonctionnaires et agents des
      institutions européennes. Conseils, défense et accompagnement juridique
      personnalisé à Bruxelles.
    image: https://rizzo-michiels.be/default-social-image.png
    keywords:
      - avocat institutions européennes Bruxelles
      - droit du travail fonctionnaires européens
      - conseil juridique agences européennes
      - défense agents institutions EU
      - litige travail institutions européennes Belgique
      - accompagnement juridique personnalisé institutions européennes

en:
  title: European institutions and agencies
  navigationCards:
    agences: You are a European agency
    fonctionnaires: You are a European civil servant or contract agent
  agences:
    title: You are a European agency
    intro: >
      We support European agencies based in Brussels in the day-to-day
      management of their employment relations and strategic projects. We
      appear before competent courts, internal bodies and national authorities,
      and work in close collaboration with your HR and legal teams.


      Our expertise combines Belgian employment law and the specificities of
      the European civil service.
    accompagnementTitle: Support and defense of European agencies
    accompagnement:
      - Labour law and social security audit
      - GDPR and staff data protection
      - Contracts for contract agents, temporary staff, seconded national experts and consultants
      - The issue of bogus self-employment in an international context
      - End of collaboration (non-renewal, termination, dismissal)
      - Collaboration termination protection schemes
      - Remuneration packages, benefits and bonus policies
      - "Work organisation: international remote work, hybrid working, flexible schedules, right to disconnect"
      - Management of short and long-term absences (illness, burnout)
      - "Workplace well-being: harassment, internal investigations, psychosocial risks"
      - Discrimination, diversity and equal treatment
    servicesTitle: Our services
    services:
      - icon: CheckSquare
        text: Labour and employment law audit and due diligence under Belgian and European law
      - icon: FileText
        text: Drafting and reviewing contracts, HR policies, internal regulations and GDPR documents
      - icon: Handshake
        text: Advisory services on employment relationship management, from recruitment to end of collaboration
      - icon: BriefCase
        text: Negotiation of amicable agreements and confidential conflict resolution
      - icon: Shield
        text: Defense before labour courts in Belgium, social inspections and competent authorities
  fonctionnaires:
    title: You are a European civil servant, contract agent or temporary staff
    intro: >
      Are you a European civil servant, contract agent or expert within a
      European agency or institution, facing a professional difficulty?

      We support you at every stage of your career, whether for one-time
      advice, a sensitive situation or litigation.


      We appear before the internal bodies of European institutions as well as
      before competent courts, taking into account the specificities of the
      European civil service regulations and the Belgian framework.
    accompagnementTitle: Support and defense of European civil servants and contract staff
    accompagnement:
      - Recruitment and engagement conditions within European institutions and agencies
      - Analysis and negotiation of contract or temporary agent contracts
      - Status, rights and obligations of European civil servants
      - Evaluations, promotions and career development
      - Refusal of contract renewal or end of assignment
      - Dismissal or contract termination
      - Disciplinary measures and administrative investigations
      - Moral or sexual harassment at work
      - Discrimination and equal treatment
      - Workplace well-being and psychosocial risks
      - Absence management (illness, burnout, special leave)
      - Remote work, mobility and international working conditions
      - Personal data protection (GDPR) in the employment relationship
    servicesTitle: Our services
    services:
      - icon: CheckSquare
        text: Analysis of your professional situation and rights
      - icon: BriefCase
        text: Strategic advice before any action (complaint, appeal, negotiation)
      - icon: FileText
        text: Assistance in procedures internal to European institutions
      - icon: FileText
        text: Drafting of administrative appeals and support in contentious procedures
      - icon: Handshake
        text: Negotiation of amicable and confidential solutions
      - icon: Shield
        text: Defense before competent courts
  ctaText: Find out more about fees
  seo:
    title: Legal services for European institutions | Rizzo & Michiels Attorneys
    description: Employment law expertise for European agencies, officials and agents.
      Legal advice, defense and personalized legal support in Brussels.
    keywords:
      - European institutions lawyer Brussels
      - EU employment law expertise
      - European agencies legal advice
      - defense EU institution employees
      - workplace litigation European institutions Belgium
      - personalized legal support EU officials
    image: https://rizzo-michiels.be/default-social-image.png

it:
  title: Istituzioni e agenzie europee
  navigationCards:
    agences: Sei un'agenzia europea
    fonctionnaires: Sei un funzionario o agente contrattuale europeo
  agences:
    title: Sei un'agenzia europea
    intro: >
      Assistiamo le agenzie europee con sede a Bruxelles nella gestione
      quotidiana dei loro rapporti di lavoro e nei loro progetti strategici.
      Interveniamo davanti alle giurisdizioni competenti, agli organi interni
      o alle autorità nazionali, e lavoriamo in stretta collaborazione con i
      vostri team HR e legali.


      La nostra expertise combina il diritto del lavoro belga e le specificità
      della funzione pubblica europea.
    accompagnementTitle: Assistenza e difesa delle agenzie europee
    accompagnement:
      - Audit in diritto del lavoro e previdenza sociale
      - GDPR e protezione dei dati del personale
      - Contratti di agenti contrattuali, temporanei, esperti nazionali distaccati e consulenti
      - Problematica dei falsi lavoratori autonomi in un contesto internazionale
      - Fine della collaborazione (mancato rinnovo, risoluzione, licenziamento)
      - Regimi di protezione contro la cessazione della collaborazione
      - Pacchetti retributivi, benefit e politiche di bonus
      - "Organizzazione del lavoro: telelavoro internazionale, lavoro ibrido, orari flessibili, diritto alla disconnessione"
      - Gestione delle assenze di breve e lunga durata (malattia, burnout)
      - "Benessere sul lavoro: molestie, indagini interne, rischi psicosociali"
      - Discriminazione, diversità e parità di trattamento
    servicesTitle: I nostri servizi
    services:
      - icon: CheckSquare
        text: Audit e due diligence in diritto del lavoro belga ed europeo
      - icon: FileText
        text: Redazione e revisione di contratti, politiche HR, regolamenti interni e documenti GDPR
      - icon: Handshake
        text: Consulenza nella gestione del rapporto di lavoro, dal reclutamento alla fine della collaborazione
      - icon: BriefCase
        text: Negoziazione di accordi amichevoli e risoluzione confidenziale dei conflitti
      - icon: Shield
        text: Difesa davanti ai tribunali del lavoro in Belgio, alle ispezioni sociali e alle autorità competenti
  fonctionnaires:
    title: Sei un funzionario europeo, agente contrattuale o temporaneo
    intro: >
      Sei un funzionario europeo, agente contrattuale o esperto all'interno di
      un'agenzia europea o di un'istituzione europea, e ti trovi ad affrontare
      una difficoltà professionale?

      Ti assistiamo in ogni fase del tuo percorso professionale, sia per una
      consulenza puntuale, una situazione delicata o un contenzioso.


      Interveniamo davanti agli organi interni delle istituzioni europee
      nonché davanti alle giurisdizioni competenti, tenendo conto delle
      specificità dello statuto della funzione pubblica europea e del quadro
      belga.
    accompagnementTitle: Assistenza e difesa dei funzionari e agenti contrattuali europei
    accompagnement:
      - Reclutamento e condizioni di assunzione presso le istituzioni e le agenzie europee
      - Analisi e negoziazione di contratti di agenti contrattuali o temporanei
      - Statuto, diritti e obblighi dei funzionari europei
      - Valutazioni, promozioni e sviluppo della carriera
      - Rifiuto di rinnovo del contratto o fine della missione
      - Licenziamento o risoluzione del contratto
      - Misure disciplinari e indagini amministrative
      - Molestie morali o sessuali sul lavoro
      - Discriminazione e parità di trattamento
      - Benessere sul lavoro e rischi psicosociali
      - Gestione delle assenze (malattia, burnout, congedi specifici)
      - Telelavoro, mobilità e condizioni di lavoro internazionali
      - Protezione dei dati personali (GDPR) nel rapporto di lavoro
    servicesTitle: I nostri servizi
    services:
      - icon: CheckSquare
        text: Analisi della vostra situazione professionale e dei vostri diritti
      - icon: BriefCase
        text: Consulenza strategica prima di qualsiasi azione (reclamo, ricorso, negoziazione)
      - icon: FileText
        text: Assistenza nelle procedure interne alle istituzioni europee
      - icon: FileText
        text: Redazione di ricorsi amministrativi e assistenza nelle procedure contenziose
      - icon: Handshake
        text: Negoziazione di soluzioni amichevoli e confidenziali
      - icon: Shield
        text: Difesa davanti alle giurisdizioni competenti
  ctaText: Scopri di più sulle tariffe
  seo:
    title: Servizi legali per le istituzioni europee | Rizzo & Michiels Avvocate
    description: Competenza in diritto del lavoro per agenzie, funzionari e agenti delle
      istituzioni europee. Consulenza legale, difesa e assistenza legale
      personalizzata a Bruxelles.
    keywords:
      - avvocato istituzioni europee Bruxelles
      - diritto del lavoro funzionari europei
      - consulenza legale agenzie europee
      - difesa agenti istituzioni UE
      - contenzioso lavoro istituzioni europee Belgio
      - assistenza legale personalizzata istituzioni europee
    image: https://rizzo-michiels.be/default-social-image.png
