  sections:
    - title: Juridische informatie
      text: >-
        Ter uitvoering van artikel III-74 van het Wetboek van economisch recht
        wordt de volgende juridische informatie aan de cliënten meegedeeld:


        1. Naam van de advocaat: RIZZO & MICHIELS BV vertegenwoordigd door Mr. Christine Rizzo en Mr. Stephanie Michiels

        2. Ondernemingsnummer / btw: 1034.645.352

           Contactgegevens:
           %%ADDRESS%%\
           rizzomichiels@gmail.com
           +32 488 40 45 49 - +32 498 50 29 01  
        3. Beroepsorganisatie: Franse Orde van Advocaten bij de Balie van Brussel  

        4. Beroepstitel: Advocaat  

        5. Land dat deze beroepstitel heeft verleend: België  

        6. Vooraf bepaalde prijs van de dienst: zie de met de cliënt per e-mail overeengekomen tarifering   

        7. Toepasselijke algemene voorwaarden: zie hieronder         

        8. Kenmerk van de dienstverlening: Activiteiten van advocaat

        9. NACEBEL-code 2008: 69101  

        10. Prestatie: Juridisch advies en/of verdediging in rechte inzake arbeidsrecht en/of sociale zekerheid  

        11. Verzekeringen:   


        * Beroepsaansprakelijkheid: ETHIAS, voie Gisèle Halimi 10, 4000 Luik (telefoon: 04/220.31.11).  Geografische dekking van de verzekering: de hele wereld met uitzondering van de Verenigde Staten van Amerika en Canada.

        * Onrechtmatige daden met betrekking tot gelden: ETHIAS, voie Gisèle Halimi 10, 4000 Luik (telefoon: 04/220.31.11).  Geografische dekking van de verzekering: de hele wereld.
    - title: Algemene voorwaarden
      text: >-
        **1.   VOORWERP VAN DE OVEREENKOMST**


        1.1.	De cliënt gelast de advocaat met de verdediging van zijn belangen in het kader van een opdracht van advies, bijstand, onderhandeling, verdediging of vertegenwoordiging voor de hoven en rechtbanken of de instanties waarvoor de cliënt wordt verzocht te verschijnen. 


        Het precieze voorwerp van de opdracht van de advocaat wordt bij de aanvang van de relatie vastgelegd in een e-mailcommunicatie tussen de advocaat en de cliënt.


        De advocaat informeert de cliënt zo nodig over de bijzonderheid van de zaak die de cliënt hem voorlegt en over de uitvoering van de opdracht zoals de advocaat die inschat, zodat de cliënt zich een duidelijk beeld kan vormen van de opdrachten van de advocaat.


        Elke wijziging van de opdracht in de loop van het dossier moet vooraf worden meegedeeld en de uitdrukkelijke instemming van de cliënt krijgen.


        1.2.	De opdracht van de advocaat omvat alle prestaties die nuttig zijn voor de verdediging van de belangen van de cliënt.


        1.3.	De advocaat handelt met zorgvuldigheid, met inachtneming van de wettelijke regels en van de regels van deontologie en hoffelijkheid die met name tussen advocaten van toepassing zijn.


        **2.   AANVANG VAN DE OPDRACHT**


        Behoudens andersluidend akkoord tussen de advocaat en de cliënt vangt de opdracht aan wanneer de essentiële elementen van de samenwerking zijn bepaald, namelijk het voorwerp van de opdracht, de financiële voorwaarden ervan en de toepassing van deze algemene voorwaarden.


        In beginsel vangt de tussenkomst van de advocaat aan bij de ontvangst van de gevraagde provisie.


        In geval van hoogdringendheid of bijzondere beperkingen kan de advocaat evenwel tussenkomen vóór de ontvangst van de provisie of vóór de volledige formalisering van de afspraken. In dat geval verbindt de cliënt zich ertoe de situatie zo spoedig mogelijk te regulariseren en aanvaardt hij de toepassing van de algemene voorwaarden en van de financiële voorwaarden die hem werden meegedeeld.


        Indien de advocaat reeds moet optreden vooraleer hij de instemming van de cliënt heeft, bezorgt hij hem zo snel mogelijk de voorwaarden en de tarieven.


        **3.   UITWISSELING VAN INFORMATIE BIJ DE AANVANG EN IN DE LOOP VAN HET DOSSIER**


        3.1. De advocaat heeft een opdracht van advies, bijstand en vertegenwoordiging.


        In elk van die opdrachten informeert de advocaat de cliënt, tenzij deze hem daarvan heeft vrijgesteld, op basis van de meegedeelde feitelijke gegevens en van de huidige stand van het recht, over de verschillende afloopmogelijkheden van het geschil in het kader van een opdracht van bijstand of vertegenwoordiging.


        In elk geval wendt de advocaat de meest nuttige en meest doeltreffende middelen aan om aan de belangen van zijn cliënt tegemoet te komen.


        Hij onderzoekt met zijn cliënt met name de mogelijkheid om tot een onderhandelde oplossing te komen via de minnelijke wijzen van geschillenbeslechting (verzoening, onderhandeling, bemiddeling, collaboratief recht, …), overeenkomstig het voorschrift van artikel 444, eerste lid, van het Gerechtelijk Wetboek.


        De advocaat informeert de cliënt regelmatig over het verloop van het geding, over de nuttige zittingsdata en over de stukken en middelen die door de tegenpartij(en) worden aangevoerd.


        3.2. De cliënt verbindt zich ertoe de advocaat spontaan en zo volledig mogelijk te informeren over alle elementen betreffende de feiten en de nuttige documenten die verband houden met het voorwerp van de aan de advocaat toevertrouwde opdracht. 


        Deze verplichting tot mededeling van informatie en documenten loopt door gedurende de gehele uitvoering van de opdracht, naargelang de ontwikkelingen in het dossier. De cliënt verbindt zich er aldus toe onverwijld alle nieuwe stukken en informatie in verband met het dossier die hem ter kennis komen, aan de advocaat mee te delen. 


        3.3. De advocaat houdt de cliënt op de hoogte van de evolutie van zijn dossier.


        Wanneer de advocaat optreedt in het kader van een procedure, verduidelijkt hij het verloop van het geding, bezorgt hij de nuttige zittingsdata en de stukken en middelen die door de tegenpartij(en) worden aangevoerd. Voor zover nodig maakt hij zo spoedig mogelijk een beknopt verslag van de zitting. Zodra de beslissing is uitgesproken, bezorgt de advocaat deze aan de cliënt en informeert hij hem over de draagwijdte ervan en over de eventuele uitoefening van de openstaande rechtsmiddelen.


        **4.   VERTROUWELIJKHEID**


        Met uitzondering van de briefwisseling uitgaande van een advocaat-gerechtsmandataris, is de briefwisseling van de advocaat gericht aan de cliënt, aan een andere advocaat of aan de overheden van de Orde van Advocaten in de regel vertrouwelijk.   


        Indien de cliënt in het bezit komt van vertrouwelijke briefwisseling, verbindt hij zich ertoe het vertrouwelijke karakter ervan te bewaren, deze niet aan derden over te maken en er geen gebruik van te maken, noch in het kader van de professionele relatie met de advocaat, noch daarbuiten.


        **5.   BEROEP OP DERDEN**


        5.1. Wanneer de advocaat in associatie of in groepsverband werkt, wordt de cliënt ervan ingelicht en aanvaardt hij dat de opdracht wordt verdeeld onder de advocaten die lid zijn van de vennootschap of van de groepering.


        5.2. De advocaat mag, onder zijn eigen verantwoordelijkheid, een beroep doen op advocaten buiten het kantoor.


        5.3.  De cliënt gaat ermee akkoord dat de advocaat de gerechtsdeurwaarder of de vertaler kiest op wie hij in voorkomend geval een beroep doet in het kader van de uitvoering van zijn opdracht. In dat geval informeert de advocaat de cliënt over de rol van die derde en bezorgt hij de cliënt in voorkomend geval een raming van de kostprijs van de tussenkomst van die derde.


        5.4.  Wat het beroep op andere derden betreft, zoals gespecialiseerde advocaten, notarissen, deskundigen, technische raadgevers of boekhouders, wordt de keuze van de derde door de advocaat gemaakt na voorafgaand overleg met de cliënt. In dat geval gaat de advocaat pas een verbintenis aan ten aanzien van die derden nadat de cliënt zijn akkoord heeft gegeven over de hoedanigheid en de rol van die derden bij de uitvoering van de opdracht van de advocaat en over de kostprijs van die tussenkomsten. In de mate van het mogelijke wordt een afzonderlijke overeenkomst gesloten, hetzij door de cliënt rechtstreeks met die derde, hetzij door de advocaat met de derde, en in dat geval nadat de cliënt zijn uitdrukkelijke instemming met die afzonderlijke overeenkomst heeft gegeven.


        5.5.  De cliënt verbindt zich ertoe de facturen die hem worden toegezonden voor de betaling van de erelonen en kosten van de derden op wie de advocaat overeenkomstig de voorgaande leden een beroep heeft gedaan, onverwijld te betalen.


        **6.   ERELONEN EN KOSTEN - FACTURATIEVOORWAARDEN - BETALINGSVOORWAARDEN - INDEXERING**


        6.1. 	Beginselen


        Bij de aanvang van zijn opdracht informeert de advocaat de cliënt over de wijze van berekening van zijn erelonen en over de eventuele kosten. Indien naast de erelonen en kosten ook uitgaven verschuldigd kunnen zijn (erelonen van gerechtsdeurwaarders, erelonen van deskundigen of vertalers, rolrechten, enz.), informeert de advocaat de cliënt daarover.


        6.2. De erelonen


        Behoudens andersluidende overeenkomst worden de prestaties gefactureerd op basis van een uurtarief zoals bepaald in de opdrachtbrief of overeengekomen tussen de advocaat en de cliënt, met name via e-mailuitwisselingen. De erelonen van de advocaat zijn onderworpen aan de Belgische btw (21%). 


        De erelonen vergoeden het geheel van de prestaties die de advocaat in het kader van de toevertrouwde opdracht verricht. Sommige daarvan zijn rechtstreeks zichtbaar, maar vele andere

        taken die onmisbaar zijn voor de goede uitvoering van die opdracht zijn dat minder. De prestaties kunnen met name omvatten, zonder dat deze opsomming exhaustief is, alle gesprekken en mondelinge en schriftelijke uitwisselingen met de cliënt (per telefoon, e-mail, enz.) alsook met de andere betrokkenen (partijen, advocaten van de tegenpartij, deskundigen, vertalers, gerechtsdeurwaarders, notarissen, enz.), de studie van het dossier, de opzoekingen, de interne consultaties (met inbegrip van de mondelinge), de vergaderingen, de deskundigenonderzoeken, het opstellen en voorbereiden van verzoekschriften, dagvaardingen, conclusies, memories, zittingsnota's en andere proceshandelingen, de samenstelling van het stukkendossier (wat werk van afdrukken, klasseren, compileren, opmaken, formatteren, enz. kan meebrengen), de verplaatsingen en verschijningen op de zittingen, de wachttijd en de pleidooien, de administratieve stappen, enz. 


        De cliënt wordt verzocht actief met de advocaat samen te werken teneinde het goede verloop van de opdracht te bevorderen en de kosten te beheersen. Daartoe ziet hij er met name op toe binnen redelijke termijnen volledige, relevante en gestructureerde informatie en documenten over te maken en het overmatig of nutteloos versturen van stukken of mededelingen te vermijden. De cliënt wordt erop gewezen dat elke prestatie van de advocaat factureerbare tijd uitmaakt, met inbegrip van telefoongesprekken, e-mails en andere communicatie. Hij wordt dan ook verzocht zijn vragen in de mate van het mogelijke te bundelen en herhaalde of overmatige verzoeken te vermijden die het bedrag van de erelonen kunnen doen oplopen. Hij ziet er bovendien op toe tijdig te antwoorden op de vragen van de advocaat en de facturen tijdig te voldoen, teneinde het versturen van herinneringen en eventuele bijkomende kosten te vermijden.


        6.3. De kosten en uitgaven


        De erelonen omvatten steeds de kantoorkosten (secretariaat, dossieropening, tikwerk, telefoon, kopieën, enz.), maar niet de uitgaven.


        De uitgaven die in het kader van een dossier worden gedaan kunnen de volgende zijn, zonder dat deze

        lijst beperkend is: rolrechten, deurwaarderskosten, administratieve kosten van stukken van de burgerlijke stand of van andere documenten, erelonen van een beëdigd vertaler of van een deskundige-raadgever, erelonen betaald aan een advocaat buiten het kantoor voor een prestatie voor een rechtscollege buiten het arrondissement waar de verplaatsing van een advocaat van het kantoor niet vereist lijkt.


        De uitgaven geven geen aanleiding tot btw, met uitzondering van de deurwaarderskosten.


        De portokosten worden doorgerekend tegen kostprijs en de verplaatsingen buiten de 19 gemeenten van Brussel worden doorgerekend tegen de kilometervergoeding die van toepassing is op de rijksambtenaren.


        6.4. De provisies


        De advocaat kan de betaling vragen van provisies in mindering van zijn erelonen, kosten en uitgaven. De opdracht vangt in beginsel aan bij de ontvangst van de provisie. De niet-betaling van een provisie machtigt de advocaat om zijn opdracht op te schorten of niet aan te vatten. Bijkomende provisies kunnen worden gevraagd naargelang de evolutie van het dossier.


        6.5. 	    Facturatievoorwaarden


        De prestaties maken het voorwerp uit van gedetailleerde facturen (met vermelding van onder meer de datum, de aard en de duur van de prestaties), die elektronisch worden overgemaakt, wat de cliënt uitdrukkelijk aanvaardt.


        Behoudens bijzondere omstandigheden worden de prestaties minstens op maandelijkse basis gefactureerd.


        De facturen worden verstuurd naar het e-mailadres dat de cliënt heeft meegedeeld. Het komt de cliënt toe toe te zien op de juistheid van zijn gegevens en Rizzo & Michiels BV onverwijld op de hoogte te brengen van elke wijziging. Bij gebreke daarvan kan geen enkele betwisting of vraag om bijkomend uitstel worden gegrond op een vergissing of op het niet bijwerken van de gegevens.


        De facturen worden geacht te zijn ontvangen op de eerste werkdag na de verzending ervan per e-mail, behoudens tegenbewijs.


        Behoudens andersluidend beding zijn de facturen betaalbaar binnen de daarop vermelde termijn.


        Elke op haar vervaldag onbetaalde factuur brengt van rechtswege en zonder ingebrekestelling een verwijlintrest op tegen een tarief van 12 % per jaar. Bij aanhoudende niet-betaling kan een forfaitaire vergoeding worden gevorderd van 20 % van het nog verschuldigde bedrag, met een minimum van 150 €, onverminderd de eventuele invorderingskosten. Bovendien behoudt Rizzo & Michiels BV zich bij wanbetaling het recht voor de uitvoering van haar prestaties op te schorten na de cliënt daarvan te hebben ingelicht, zonder dat haar aansprakelijkheid kan worden ingeroepen voor de gevolgen die daaruit zouden voortvloeien.


        6.6	    Juridische bijstand


        De cliënt wordt ingelicht over de mogelijkheid om tweedelijnsbijstand te genieten, die onder bepaalde voorwaarden de gehele of gedeeltelijke tenlasteneming van de advocatenkosten mogelijk maakt.


        De voorwaarden zijn raadpleegbaar op de website: <https://www.bajbruxelles.be/rendez-vous>


        De cliënt erkent te zijn ingelicht dat het kantoor niet in dat stelsel is ingeschreven en bevestigt vrij zijn advocaat te kiezen.


        **7.   DERDE BETALER**


        7.1.  Indien de cliënt de gehele of gedeeltelijke tussenkomst van een derde betaler kan genieten (rechtsbijstandsverzekering, groepering, vereniging, vakbond, familie, enz.), brengt hij de advocaat daarvan onmiddellijk op de hoogte en deelt hij hem onverwijld de precieze gegevens van die derde betaler mee alsook de voorwaarden van diens tussenkomst (met name het tussenkomstplafond).


        In beginsel neemt de advocaat contact op met die derde betaler om hem de nodige informatie te bezorgen zodat deze kan beoordelen in welke mate hij moet tussenkomen. De advocaat en de cliënt kunnen evenwel overeenkomen dat de cliënt zelf de door de derde betaler vereiste informatie meedeelt. Elke mededeling van de advocaat aan de derde betaler gebeurt binnen de grenzen van het beroepsgeheim waartoe hij gehouden is.


        7.2. De facturen van de advocaat worden opgesteld op naam van de cliënt en overgemaakt aan de derde betaler.


        7.3. De cliënt is in elk geval persoonlijk gehouden tot de betaling van de erelonen, kosten en uitgaven van de advocaat, onverminderd het recht van de cliënt om op elk ogenblik een einde te maken aan de opdracht van de advocaat.  De cliënt is gehouden tot de betaling van de erelonen, kosten en uitgaven bij weigering of in gebreke blijven van de derde betaler of bij overschrijding van het tussenkomstplafond van die derde betaler.


        7.4. De advocaat vestigt bovendien de aandacht van de cliënt op de omstandigheid dat hij, zelfs bij tussenkomst van een derde betaler, in zijn hoedanigheid van cliënt en opdrachtgever van het kantoor het bedrag zal moeten dragen van de erelonen en kosten die niet door de derde betaler ten laste worden genomen (overschrijding van het tussenkomstplafond, gedeeltelijke weigering van dekking, betwisting door de derde betaler van het uurtarief of van de uiteindelijke berekeningswijze van de erelonen of kosten, overschrijding van de bedragen bepaald door of krachtens de artikelen 8 en 11 van de wet van 22 april 2019 tot het toegankelijker maken van de rechtsbijstandsverzekering).


        **8.   GERECHTSKOSTEN EN SOLVABILITEIT VAN DE DERDE**


        De cliënt wordt erop gewezen dat bij een gerechtelijke procedure de in het ongelijk gestelde partij kan worden veroordeeld tot de betaling van een rechtsplegingsvergoeding alsook tot de gerechtskosten.


        Indien de vordering slaagt en de tegenpartij niet vrijwillig uitvoert, zullen uitvoeringsmaatregelen moeten worden genomen op kosten van de cliënt.


        De insolvabiliteit van de schuldenaar kan de invordering van de verschuldigde bedragen in het gedrang brengen, zonder dat de aansprakelijkheid van de advocaat kan worden ingeroepen.


        **9.   EXCEPTIE VAN NIET-UITVOERING**


        9.1   Indien een aan de cliënt aangerekend bedrag onbetaald blijft of indien de advocaat geen voor het beheer van het dossier nuttige informatie ontvangt of de door hem gevraagde instructies niet ontvangt, heeft de advocaat de mogelijkheid om, mits ingebrekestelling, elke prestatie op te schorten of te onderbreken.  Indien het verzuim van de cliënt ondanks een herinnering aanhoudt, kan de advocaat een einde maken aan zijn tussenkomst.


        9.2. De advocaat schorst of onderbreekt zijn tussenkomst niet wanneer een termijn om hoger beroep in te stellen loopt.


        9.3. Wanneer de advocaat zijn tussenkomst opschort of onderbreekt, vestigt hij de aandacht van de cliënt op de eventuele gevolgen van de opschorting of van het einde van zijn tussenkomst (bijvoorbeeld een lopende termijn).  Die beslissing tot opschorting of onderbreking van de opdracht wordt binnen een voldoende redelijke termijn meegedeeld om de cliënt in staat te stellen die eventuele gevolgen te verhelpen.


        8.4.  De erelonen, kosten en uitgaven blijven aan de advocaat verschuldigd tot aan de opschorting, de onderbreking of het einde van zijn opdracht.


        **10.   INHOUDING VAN ERELONEN OP GELDEN VAN DERDEN**


        10.1. De advocaat mag op de bedragen die hij voor rekening van de cliënt ontvangt elk bedrag inhouden dat hem verschuldigd is als provisie, ereloon, kosten en uitgaven in het betrokken dossier of in elk ander dossier van de cliënt waarmee hij belast is.


        De advocaat informeert de cliënt voorafgaandelijk en schriftelijk over die inhouding en voegt bij die mededeling een afschrift van de provisieaanvraag of -aanvragen en van de staten van erelonen, kosten en uitgaven die die inhouding rechtvaardigen.


        10.2. Behoudens uitdrukkelijk, schriftelijk en voorafgaand akkoord van de cliënt verricht de advocaat geen inhouding op de voor rekening van de cliënt ontvangen bedragen wanneer deze betrekking hebben op onderhoudsgelden of andere niet voor beslag vatbare bedragen.


        10.3. De inhouding van erelonen en kosten door de advocaat doet geen afbreuk aan de rechten van de cliënt om de door de advocaat voorgelegde staten van prestaties en kosten gemotiveerd te betwisten en de terugbetaling te vorderen van de bedragen die ten onrechte zouden zijn ingehouden.


        **11. VOORKOMING VAN HET WITWASSEN VAN GELD EN VAN DE FINANCIERING VAN TERRORISME**


        11.1. De advocaat leeft zijn wettelijke verplichtingen na inzake de identificatie van de cliënt of van diens lastgever. Deze laatste verbindt zich ertoe spontaan alle documenten te verstrekken die de vaststelling van de identiteit mogelijk maken en machtigt de advocaat er een afschrift van te nemen. De verplichtingen van de advocaat en van de cliënt vloeien voort uit de wetten en reglementen en met name uit de bepalingen van de wet van 18 september 2017 tot voorkoming van het witwassen van geld en de financiering van terrorisme, die met name van toepassing is wanneer de advocaat zijn cliënt bijstaat bij de voorbereiding van specifieke verrichtingen zoals: bijstand van de cliënt bij de voorbereiding of de uitvoering van verrichtingen zoals de aan- of verkoop van onroerende goederen of handelsondernemingen; het beheer van gelden, effecten of andere activa toebehorend aan de cliënt of aan diens lastgever; de opening of het beheer van bank-, spaar- of effectenrekeningen; de organisatie van de inbrengen die nodig zijn voor de oprichting, het beheer of de leiding van vennootschappen; de oprichting, het beheer of de leiding van trusts, vennootschappen of soortgelijke structuren, of het optreden in naam en voor rekening van de cliënt bij alle financiële en onroerende transacties. De inlichtingen die de advocaat van zijn cliënt moet vragen verschillen naargelang het een natuurlijke persoon, een rechtspersoon of een lasthebber betreft. De cliënt informeert de advocaat zo snel mogelijk en spontaan over elke wijziging en levert daarvan het bewijs.


        11.2.  Wanneer de aard van het dossier (zoals bepaald in punt 10.1) of wanneer de bijzondere situaties bedoeld in de voormelde wet van 18 september 2017 (land van herkomst, identificatiemoeilijkheden, ongebruikelijke relatie tussen de cliënt en de advocaat of aard van de verrichtingen, publieke of daarmee gelijkgestelde persoon) de advocaat een verscherpte waakzaamheidsplicht opleggen, verbindt de cliënt zich ertoe te antwoorden op elke vraag van de advocaat die hem toelaat zijn wettelijke verplichtingen inzake de strijd tegen het witwassen van geld en de financiering van terrorisme na te leven.


        11.3  Wanneer de advocaat de cliënt bijstaat in zijn verdediging in rechte of wanneer hij diens rechtspositie beoordeelt, is de advocaat gehouden tot de strikte naleving van het beroepsgeheim.


        Er wordt verduidelijkt dat de wet de advocaat verplicht de stafhouder te informeren zodra hij, buiten zijn opdracht van verdediging in rechte of van advies met betrekking tot de analyse van de rechtspositie van de cliënt, feiten vaststelt waarvan hij vermoedt dat zij verband houden met het witwassen van geld of de financiering van terrorisme. De stafhouder maakt de melding van vermoeden in voorkomend geval over aan de Cel voor Financiële Informatieverwerking (CFI).


        **12. BEPERKING VAN AANSPRAKELIJKHEID**


        12.1.  Indien de advocaat bij de uitvoering van de opdracht die is omschreven in de informatiefiche of in de opdrachtbrief, of in elke andere communicatie tussen de advocaat en de cliënt, een fout begaat die de cliënt schade berokkent, is de verplichting van de advocaat om die schade te vergoeden, bij uitdrukkelijke overeenkomst tussen de cliënt en de advocaat, beperkt tot het tussenkomstplafond van de verzekering beroepsaansprakelijkheid van de advocaat, hetzij, per schadegeval, 1.250.000 € indien het schadeverwekkende feit dateert van vóór 1 januari 2019, of 2.500.000 € indien het schadeverwekkende feit van na die datum dateert.


        12.2. De beperking van aansprakelijkheid geldt niet in geval van schade die voor de cliënt voortvloeit uit de zware fout of het bedrog van de advocaat.


        12.3 Het door deze verzekeringspolis gedekte risico is de professionele burgerlijke aansprakelijkheid, contractueel of buitencontractueel, die op de advocaat kan rusten uit hoofde van schade veroorzaakt aan derden en rechtstreeks voortvloeiend uit feitelijke of juridische vergissingen, nalatigheden, verzuimen, vergetelheden, vertragingen, fouten en onjuistheden (met inbegrip van het niet naleven van proceduretermijnen en van fouten begaan bij de overdracht van gelden) begaan in de uitoefening van zijn verzekerde beroepsactiviteiten.  De verzekerde beroepsactiviteit is die van de advocaat zoals omschreven in het Gerechtelijk Wetboek (het juridisch advies en de verdediging en vertegenwoordiging in rechte), door de deontologie en door de gebruiken en praktijken die zijn toegestaan in het kader van de op advocaten toepasselijke regelgeving.  Een "derde" in de zin van de verzekeringspolis is met name de cliënt van de advocaat.  Daarnaast dekken de verzekeringen bij wijze van aanvullende waarborg eveneens de aansprakelijkheid die de advocaat kan oplopen met betrekking tot goederen die hem zouden zijn toevertrouwd, de kosten van reconstructie van dossiers en de kosten van het opnieuw opstellen van akten. 


        De professionele burgerlijke aansprakelijkheid van de advocaat is niet gedekt door deze verzekeringspolis, hoofdzakelijk voor schade of aansprakelijkheid die voortvloeit uit verrichtingen die vreemd zijn aan de uitoefening van de beroepsactiviteiten van de advocaat, of voor schade die voortvloeit uit feiten waarvan de advocaat kennis had bij de inwerkingtreding van de verzekeringsovereenkomst (1 januari 2019) en die van aard zijn de waarborg van de verzekeraar te doen spelen.


        Bovendien is de dekking van de verzekering beroepsaansprakelijkheid van de advocaat niet verworven indien hij een zware fout begaat, hoofdzakelijk omschreven als elke inbreuk op wetten, regels, veiligheidsnormen, reglementen of gebruiken eigen aan zijn activiteit waarvan eenieder die met de materie vertrouwd is, moet weten dat zij vrijwel onvermijdelijk schade veroorzaakt.  De verzekeringsdekking is evenmin verworven wanneer de advocaat een opdracht aanvaardt waarvan hij zich bewust moest zijn dat hij niet over de nodige bekwaamheid, de technische kennis en de menselijke en materiële middelen beschikt om die opdracht uit te voeren.


        12.4. Wanneer de aan de advocaat toevertrouwde opdracht hetzij een specifiek en belangrijk risico, hetzij een uitsluiting of een risico van verval inhoudt, informeert de advocaat de cliënt daarover vooraf.


        **13. EINDE VAN DE OVEREENKOMST – BEWARING VAN DE ARCHIEVEN – VERNIETIGING VAN DE ARCHIEVEN**


        13.1. De cliënt kan de opdracht van de advocaat op elk ogenblik beëindigen door hem daarvan schriftelijk in kennis te stellen.


        Wanneer de opdracht van de advocaat evenwel kadert in een abonnement of in een regelmatige opeenvolging van dossiers, kan de advocaat met de cliënt een opzeggingstermijn of een compenserende vergoeding onderhandelen. 


        Op eerste verzoek van de cliënt stelt de advocaat de stukken van zijn dossier ter beschikking van de cliënt of van de advocaat die de cliënt heeft aangewezen.


        De advocaat kan de overeenkomst eveneens op elk ogenblik beëindigen door de cliënt daarvan schriftelijk in kennis te stellen. Wanneer de omstandigheden dat vereisen, stelt de advocaat enerzijds de nodige bewarende handelingen en ziet hij er anderzijds op toe de cliënt een redelijke termijn toe te kennen zodat deze zijn verdediging kan organiseren.


        13.2. De advocaat bewaart de archieven van het door de cliënt toevertrouwde dossier gedurende een periode van vijf jaar te rekenen vanaf de datum waarop:


        * de cliënt een einde heeft gemaakt aan de tussenkomst van de advocaat

        * de advocaat een einde heeft gemaakt aan zijn tussenkomst;

        * het dossier wordt afgesloten door de voltooiing van de aan de advocaat toevertrouwde opdracht.


        Die bewaring heeft betrekking op de briefwisseling en de voornaamste processtukken, alsook op de stukken ten gronde die in origineel aan de advocaat werden toevertrouwd, onverminderd het recht van de advocaat om die originele stukken aan de cliënt terug te bezorgen.


        Voor de dossiers die onderworpen zijn aan de wet van 18 september 2017 tot voorkoming van het witwassen van geld en de financiering van terrorisme wordt de bewaartermijn van de archieven met betrekking tot de identificatie van de cliënt op tien jaar gebracht.


        Bij het verstrijken van de termijn van vijf of tien jaar mag de advocaat alle stukken van het dossier, zonder uitzondering, vernietigen, na de cliënt daarvan schriftelijk te hebben ingelicht en hem een redelijke termijn te hebben gegeven om de stukken terug te halen. Het komt de cliënt bijgevolg toe, indien hij dat wenst, de advocaat vóór het verstrijken van de termijn van vijf of tien jaar te verzoeken hem alle of een deel van de stukken van het dossier terug te bezorgen. De teruggave van de stukken gebeurt op het kantoor van de advocaat.


        Indien de cliënt de verzending van de stukken van zijn dossier vraagt, gebeurt die verzending op kosten van de cliënt. De advocaat kan een voorafgaande betaling van de kosten eisen alvorens de stukken aan de cliënt terug te zenden.


        Indien de betaling van de kosten van teruggave van de stukken niet gebeurt binnen de maand die volgt op het verzoek tot betaling van de kosten, wordt de cliënt geacht te hebben verzaakt aan de teruggave van de stukken, waarvan de advocaat de cliënt schriftelijk verwittigt met een opzeggingstermijn van acht werkdagen.


        **14.   AVG**


        De gegevens van de cliënt worden verzameld en verwerkt overeenkomstig de AVG, en de cliënt stemt in met het gebruik van die gegevens in het kader van de behandeling van het dossier en van de naleving door de advocaat van zijn verplichtingen. De cliënt aanvaardt dat de advocaat hem juridische informatie en informatie over de activiteiten van de advocaat toestuurt.


        De verwerking van de persoonsgegevens die via de website en in het kader van het beheer van de cliëntendossiers worden verzameld, wordt omschreven in het Privacybeleid en in het Beleid inzake de bescherming van persoonsgegevens die op de

        site raadpleegbaar zijn.


        **15. HERROEPINGSRECHT**


        Wanneer de overeenkomst op afstand of buiten de kantoren van het advocatenkantoor wordt gesloten, en voor zover de cliënt een natuurlijke persoon is die handelt voor privédoeleinden in de zin van het Wetboek van economisch recht, beschikt deze over een herroepingsrecht van 14 kalenderdagen te rekenen vanaf het sluiten van de overeenkomst.


        Dit recht kan worden uitgeoefend door het versturen van een ondubbelzinnige verklaring (per brief of per e-mail) waarin de wil tot herroeping wordt uitgedrukt.


        Wanneer het herroepingsrecht geldig wordt uitgeoefend, betaalt Rizzo & Michiels BV de ontvangen bedragen terug binnen de 14 dagen na de kennisgeving van de herroeping.


        Indien de cliënt evenwel vraagt dat de prestaties tijdens de herroepingstermijn aanvangen, is hij gehouden de daadwerkelijk verrichte prestaties te betalen tot op het ogenblik waarop hij zijn herroepingsrecht heeft uitgeoefend.


        De cliënt erkent uitdrukkelijk dat hij, indien de opdracht met zijn voorafgaande instemming volledig is uitgevoerd vóór het verstrijken van de herroepingstermijn, zijn herroepingsrecht verliest.


        **16.   TOEPASSELIJK RECHT – BEVOEGDE RECHTBANK**


        Het Belgische recht is van toepassing op de contractuele relaties tussen de advocaat en de cliënt. 


        Indien de cliënt van de advocaat een consument is die buiten België woont, is het recht van het land van verblijf van die cliënt van toepassing, onverminderd het recht van de advocaat om met zijn cliënt bij bijzondere overeenkomst de toepassing van het Belgische recht overeen te komen.


        Indien het geschil tussen de cliënt en de advocaat noch bij wijze van verzoening, noch door een verzoener of een arbiter kon worden opgelost, zijn uitsluitend de rechtscolleges van de rechterlijke orde bevoegd in wier rechtsgebied het kantoor van de advocaat is gelegen, zoals vermeld in de fiche met juridische informatie.


        Indien de cliënt van de advocaat aanspraak kan maken op een bijzondere bevoegdheid krachtens de toepasselijke wettelijke bepalingen, zijn die bepalingen van toepassing, onverminderd het recht van de advocaat om met zijn cliënt bij bijzondere overeenkomst de bevoegdheid overeen te komen van de rechtscolleges in wier rechtsgebied het advocatenkantoor is gelegen.
