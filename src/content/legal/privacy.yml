fr:
  title: Politique de confidentialité
  sections:
    - title: Objet
      text: >-
        La présente politique de confidentialité définit et informe les
        utilisateurs du site internet www.rizzo-michiels.be des modalités de
        traitement de leurs données personnelles par la responsable du
        traitement, la SRL RIZZO & MICHIELS. Ce site a été conçu par 

        la SRL RIZZO & MICHIELS en collaboration avec Guillaume Gustin, dans une démarche responsable et respectueuse de la vie privée des utilisateurs. Notre approche est fondée sur le respect de la vie privée et une utilisation minimale des données, conformément aux principes du numérique responsable.
    - title: Identité et coordonnées de la responsable du traitement
      text: >-
        
        RIZZO & MICHIELS SRL représentée par Me Christine Rizzo et Me Stephanie Michiels\

        Adresse: %%ADDRESS%%\

        E-mail: rizzomichiels@gmail.com\

        n° BCE : 1034.645.352

        Tel: +32 488 40 45 49 - +32 498 50 29 01
    - title: Données personnelles traitées
      text: >-
        Dans le cadre de l'utilisation du site web, la responsable du traitement
        s'engage à minimiser la collecte de données personnelles. Les données
        personnelles collectées se limitent à :

        - **Via le formulaire de contact** (Netlify Forms) : nom, adresse email,
          téléphone (optionnel), objet et message. Ces données sont utilisées
          uniquement pour répondre à votre demande et conservées le temps
          nécessaire à son traitement.
        - **Via Cal.com** : les données fournies lors de la prise de rendez-vous
          en ligne, gérées par le service externe Cal.com.
        - **Via Netlify (hébergeur)** : certaines données techniques (adresse IP,
          logs de serveur) collectées automatiquement à des fins de sécurité et
          de performance du site.
    - title: Hébergement du site
      text: Le site web www.rizzo-michiels.be est hébergé par Netlify, un service
        d'hébergement reconnu pour sa fiabilité et sa sécurité. Netlify peut
        collecter certaines données techniques (comme les adresses IP) à des
        fins de sécurité et de performance du site. Pour plus d'informations sur
        les pratiques de confidentialité de Netlify, vous pouvez consulter leur
        politique de confidentialité sur leur site officiel.
    - title: Finalité du traitement
      text: Les données personnelles, lorsqu'elles sont collectées via Cal.com, sont
        utilisées uniquement dans le but de gérer les rendez-vous et de
        communiquer avec les clients dans le cadre de la relation
        professionnelle.
    - title: Base légale du traitement
      text: Le traitement des données personnelles est basé sur le consentement de
        l'utilisateur lors de la prise de rendez-vous, ainsi que sur l'intérêt
        légitime de Maître Christine Rizzo à fournir ses services juridiques.
    - title: Durée de conservation
      text: Les données personnelles sont conservées uniquement pour la durée
        nécessaire à la gestion de la relation professionnelle et conformément
        aux obligations légales applicables à la profession d'avocat.
    - title: Droits des utilisateurs
      text: Conformément au Règlement Général sur la Protection des Données (RGPD),
        les utilisateurs disposent de droits sur leurs données personnelles,
        notamment les droits d'accès, de rectification, d'effacement, et
        d'opposition au traitement. Ces droits peuvent être exercés en
        contactant Rizzo & Michiels SRL à l'adresse rizzomichiels@gmail.com.
    - title: Sécurité
      text: Des mesures de sécurité appropriées sont mises en place pour protéger les
        données personnelles contre tout accès, modification, divulgation ou
        destruction non autorisés.
    - title: Mise à jour de la politique
      text: Cette politique de confidentialité peut être mise à jour périodiquement.
        Les utilisateurs sont invités à la consulter régulièrement.
en:
  title: Privacy Policy
  sections:
    - title: Purpose
      text: This privacy policy defines and informs users of the website
        www.rizzo-michiels.be about the methods of processing their personal
        data by the data controller,  SRL RIZZO & MICHIELS. This site was
        designed by SRL RIZZO & MICHIELS in collaboration with Guillaume Gustin,
        with a  responsible approach that respects users' privacy. Our approach
        is based on respect for privacy and minimal data use, in accordance with
        the principles of responsible digital practices.
    - title: Identity and contact details of the data controller
      text: |-
        RIZZO & MICHIELS SRL 

        Chaussée de Waterloo 1151, 1180 Brussels

        Telephone: +32 488 40 45 49 - +32 498 50 29 01

        Company registration number: 1034.645.352
    - title: Personal data processed
      text: >-
        As part of the use of the website, the data controller is committed to
        minimizing the collection of personal data. Personal data collected is
        limited to:

        - **Via the contact form** (Netlify Forms): name, email address, phone
          number (optional), subject, and message. This data is used solely to
          respond to your enquiry and retained for the time necessary to handle it.
        - **Via Cal.com**: data provided when booking an online appointment,
          managed by the external service Cal.com.
        - **Via Netlify (host)**: certain technical data (IP address, server logs)
          collected automatically for site security and performance purposes.
    - title: Website Hosting
      text: The website www.rizzo-michiels.be is hosted by Netlify, a hosting service
        known for its reliability and security. Netlify may collect certain
        technical data (such as IP addresses) for site security and performance
        purposes. For more information on Netlify's privacy practices, you can
        consult their privacy policy on their official website.
    - title: Purpose of processing
      text: Personal data, when collected via Cal.com, is used solely for the purpose
        of managing appointments and communicating with clients within the
        framework of the professional relationship.
    - title: Legal basis for processing
      text: The processing of personal data is based on the user's consent when making
        an appointment, as well as on SRL RIZZO & MICHIELS's legitimate interest
        in providing her legal services.
    - title: Retention period
      text: Personal data is retained only for the duration necessary for managing the
        professional relationship and in accordance with the legal obligations
        applicable to the legal profession.
    - title: User rights
      text: In accordance with the General Data Protection Regulation (GDPR), users
        have rights over their personal data, including the rights of access,
        rectification, erasure, and opposition to processing. These rights can
        be exercised by contacting RIZZO & MICHIELS SRL at
        rizzomichiels@gmail.com.
    - title: Security
      text: Appropriate security measures are in place to protect personal data
        against any unauthorized access, modification, disclosure or
        destruction.
    - title: Policy updates
      text: This privacy policy may be updated periodically. Users are invited to
        consult it regularly.
it:
  title: Politica sulla privacy
  sections:
    - title: Scopo
      text: >-
        La presente politica sulla privacy definisce e informa gli utenti del
        sito web www.rizzo-michiels.be sui metodi di trattamento dei loro dati
        personali da parte del responsabile del trattamento, la SRL RIZZO &
        MICHIELS. Questo sito è stato progettato dalla 

        SRL RIZZO & MICHIELS in collaborazione con Guillaume Gustin, con un approccio responsabile e rispettoso della privacy degli utenti. Il nostro approccio si basa sul rispetto della privacy e sull'uso minimo dei dati, in conformità con i principi delle pratiche digitali responsabili.
    - title: Identità e dati di contatto del responsabile del trattamento
      text: |-
        RIZZO & MICHIELS SRL 

        Chaussée de Waterloo 1151, 1180 Bruxelles

        Telefono: +32 488 40 45 49 - +32 498 50 29 01

        Numero di registrazione: 1034.645.352
    - title: Dati personali trattati
      text: >-
        Nell'ambito dell'utilizzo del sito web, il responsabile del trattamento
        si impegna a minimizzare la raccolta di dati personali. I dati personali
        raccolti si limitano a:

        - **Tramite il modulo di contatto** (Netlify Forms): nome, indirizzo email,
          numero di telefono (opzionale), oggetto e messaggio. Questi dati vengono
          utilizzati esclusivamente per rispondere alla richiesta e conservati per
          il tempo necessario alla sua gestione.
        - **Tramite Cal.com**: i dati forniti durante la prenotazione di un
          appuntamento online, gestiti dal servizio esterno Cal.com.
        - **Tramite Netlify (host)**: alcuni dati tecnici (indirizzo IP, log del
          server) raccolti automaticamente ai fini della sicurezza e delle
          prestazioni del sito.
    - title: Hosting del sito web
      text: Il sito web www.rizzo-michiels.be è ospitato da Netlify, un servizio di
        hosting noto per la sua affidabilità e sicurezza. Netlify può
        raccogliere alcuni dati tecnici (come gli indirizzi IP) per scopi di
        sicurezza e prestazioni del sito. Per ulteriori informazioni sulle
        pratiche di privacy di Netlify, è possibile consultare la loro politica
        sulla privacy sul loro sito ufficiale.
    - title: Finalità del trattamento
      text: I dati personali, quando raccolti tramite Cal.com, vengono utilizzati
        esclusivamente allo scopo di gestire gli appuntamenti e comunicare con i
        clienti nell'ambito del rapporto professionale.
    - title: Base giuridica del trattamento
      text: Il trattamento dei dati personali si basa sul consenso dell'utente al
        momento della prenotazione dell'appuntamento, nonché sul legittimo
        interesse della SRL RIZZO & MICHIELS a fornire i suoi servizi legali.
    - title: Periodo di conservazione
      text: I dati personali vengono conservati solo per il tempo necessario alla
        gestione del rapporto professionale e in conformità con gli obblighi
        legali applicabili alla professione legale.
    - title: Diritti degli utenti
      text: In conformità con il Regolamento Generale sulla Protezione dei Dati
        (GDPR), gli utenti hanno diritti sui propri dati personali, tra cui i
        diritti di accesso, rettifica, cancellazione e opposizione al
        trattamento. Questi diritti possono essere esercitati contattando la SRL
        RIZZO & MICHIELS all'indirizzo rizzomichiels@gmail.com.
    - title: Sicurezza
      text: Sono in atto misure di sicurezza appropriate per proteggere i dati
        personali da qualsiasi accesso, modifica, divulgazione o distruzione non
        autorizzati.
    - title: Aggiornamenti della politica
      text: Questa politica sulla privacy può essere aggiornata periodicamente. Gli
        utenti sono invitati a consultarla regolarmente.
nl:
  title: Privacybeleid
  sections:
    - title: Voorwerp
      text: >-
        Dit privacybeleid omschrijft en informeert de gebruikers van de website
        www.rizzo-michiels.be over de wijze waarop hun persoonsgegevens worden
        verwerkt door de verwerkingsverantwoordelijke, de BV RIZZO & MICHIELS.
        Deze site werd ontworpen door 

        de BV RIZZO & MICHIELS in samenwerking met Guillaume Gustin, vanuit een verantwoorde benadering die de privacy van de gebruikers respecteert. Onze aanpak is gebaseerd op de eerbiediging van de persoonlijke levenssfeer en een minimaal gebruik van gegevens, overeenkomstig de beginselen van verantwoord digitaal ontwerp.
    - title: Identiteit en contactgegevens van de verwerkingsverantwoordelijke
      text: >-
        
        RIZZO & MICHIELS BV vertegenwoordigd door Mr. Christine Rizzo en Mr. Stephanie Michiels\

        Adres: %%ADDRESS%%\

        E-mail: rizzomichiels@gmail.com\

        KBO-nr.: 1034.645.352

        Tel: +32 488 40 45 49 - +32 498 50 29 01
    - title: Verwerkte persoonsgegevens
      text: >-
        In het kader van het gebruik van de website verbindt de
        verwerkingsverantwoordelijke zich ertoe de verzameling van
        persoonsgegevens tot een minimum te beperken. De verzamelde
        persoonsgegevens beperken zich tot:

        - **Via het contactformulier** (Netlify Forms): naam, e-mailadres,
          telefoon (optioneel), onderwerp en bericht. Deze gegevens worden
          uitsluitend gebruikt om uw vraag te beantwoorden en worden bewaard
          gedurende de tijd die nodig is voor de behandeling ervan.
        - **Via Cal.com**: de gegevens die worden verstrekt bij het online maken
          van een afspraak, beheerd door de externe dienst Cal.com.
        - **Via Netlify (host)**: bepaalde technische gegevens (IP-adres,
          serverlogs) die automatisch worden verzameld met het oog op de
          veiligheid en de performantie van de site.
    - title: Hosting van de site
      text: De website www.rizzo-michiels.be wordt gehost door Netlify, een
        hostingdienst die bekendstaat om haar betrouwbaarheid en veiligheid.
        Netlify kan bepaalde technische gegevens (zoals IP-adressen) verzamelen
        met het oog op de veiligheid en de performantie van de site. Voor meer
        informatie over de privacypraktijken van Netlify kunt u hun
        privacybeleid op hun officiële website raadplegen.
    - title: Doeleinde van de verwerking
      text: De persoonsgegevens die via Cal.com worden verzameld, worden uitsluitend
        gebruikt om de afspraken te beheren en met de cliënten te communiceren in
        het kader van de professionele relatie.
    - title: Rechtsgrond van de verwerking
      text: De verwerking van de persoonsgegevens is gebaseerd op de toestemming van
        de gebruiker bij het maken van een afspraak, alsook op het gerechtvaardigd
        belang van meester Christine Rizzo om haar juridische diensten te
        verlenen.
    - title: Bewaartermijn
      text: De persoonsgegevens worden uitsluitend bewaard gedurende de tijd die nodig
        is voor het beheer van de professionele relatie en overeenkomstig de
        wettelijke verplichtingen die op het beroep van advocaat van toepassing
        zijn.
    - title: Rechten van de gebruikers
      text: Overeenkomstig de Algemene Verordening Gegevensbescherming (AVG)
        beschikken de gebruikers over rechten met betrekking tot hun
        persoonsgegevens, met name het recht op inzage, verbetering, wissing en
        bezwaar tegen de verwerking. Deze rechten kunnen worden uitgeoefend door
        Rizzo & Michiels BV te contacteren op het adres rizzomichiels@gmail.com.
    - title: Beveiliging
      text: Er worden passende beveiligingsmaatregelen genomen om de persoonsgegevens
        te beschermen tegen ongeoorloofde toegang, wijziging, openbaarmaking of
        vernietiging.
    - title: Bijwerking van het beleid
      text: Dit privacybeleid kan periodiek worden bijgewerkt. De gebruikers worden
        uitgenodigd het regelmatig te raadplegen.
