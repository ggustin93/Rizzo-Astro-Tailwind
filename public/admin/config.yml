backend:
  name: git-gateway
  branch: main

media_folder: "public/assets/images"
public_folder: "/assets/images"

collections:
  # Page d'accueil
  - name: "home"
    label: "Page Accueil"
    files:
      - file: "src/content/home/home.yml"
        name: "home"
        label: "Contenu de la Page d'accueil"
        i18n:
          structure: single_file
        fields:
          - label: "Français"
            name: "fr"
            widget: "object"
            fields: &homeFields
              - label: "Hero"
                name: "hero"
                widget: "object"
                fields:
                  - {label: "Titre", name: "title", widget: "string"}
                  - {label: "Sous-titre", name: "subtitle", widget: "string"}
                  - {label: "Description", name: "description", widget: "text"}
                  - {label: "CTA", name: "cta", widget: "string"}
              
              - label: "Expertise"
                name: "expertise"
                widget: "object"
                fields:
                  - {label: "Titre", name: "title", widget: "string"}
                  - {label: "Description", name: "description", widget: "text"}
                  - label: "Travailleurs"
                    name: "travailleurs"
                    widget: "object"
                    fields:
                      - {label: "Titre", name: "title", widget: "string"}
                      - {label: "Description", name: "description", widget: "text"}
                      - {label: "CTA", name: "cta", widget: "string"}
                  - label: "Employeurs"
                    name: "employeurs"
                    widget: "object"
                    fields:
                      - {label: "Titre", name: "title", widget: "string"}
                      - {label: "Description", name: "description", widget: "text"}
                      - {label: "CTA", name: "cta", widget: "string"}
                  - label: "Institutions Européennes"
                    name: "europeennes"
                    widget: "object"
                    fields:
                      - {label: "Titre", name: "title", widget: "string"}
                      - {label: "Description", name: "description", widget: "text"}
                      - {label: "CTA", name: "cta", widget: "string"}
                  - label: "Honoraires"
                    name: "honoraires"
                    widget: "object"
                    fields:
                      - {label: "Introduction", name: "intro", widget: "text"}
                      - {label: "Texte du lien", name: "linkText", widget: "string"}
                      - label: "Avantages"
                        name: "advantages"
                        widget: "list"
                        field: {label: "Avantage", name: "advantage", widget: "string"}

              - label: "Équipe"
                name: "profil"
                widget: "object"
                fields:
                  - {label: "Titre", name: "title", widget: "string"}
                  - {label: "Description", name: "description", widget: "text"}
                  - {label: "CTA", name: "cta", widget: "string"}

              - {label: "Titre des articles", name: "articlesTitle", widget: "string"}
              - {label: "Voir tous les articles", name: "viewAllArticles", widget: "string"}

              - label: "SEO"
                name: "seo"
                widget: "object"
                fields:
                  - {label: "Titre", name: "title", widget: "string"}
                  - {label: "Description", name: "description", widget: "text"}
                  - {label: "Mots-clés", name: "keywords", widget: "list"}
                  - {label: "Image", name: "image", widget: "string"}

          - label: "English"
            name: "en"
            widget: "object"
            fields: *homeFields
          - label: "Italiano"
            name: "it"
            widget: "object"
            fields: *homeFields
          - label: "Nederlands"
            name: "nl"
            widget: "object"
            fields: *homeFields

  # Pages Services
  - name: "travailleurs"
    label: "Page Travailleurs"
    files:
      - file: "src/content/travailleurs/travailleurs.yml"
        name: "travailleurs"
        label: "Contenu de la page Travailleurs"
        i18n:
          structure: single_file
        fields:
          - label: "Français"
            name: "fr"
            widget: "object"
            fields: &travailleursFields
              - {label: "Titre", name: "title", widget: "string"}
              - label: "Questions"
                name: "questions"
                widget: "list"
                field: {label: Question, name: question, widget: "string"}
              - {label: "Titre des services", name: "servicesTitle", widget: "string"}
              - label: "Services"
                name: "services"
                widget: "list"
                fields:
                  - {label: "Icône", name: "icon", widget: "select", options: ["BriefCase", "Shield", "FileText", "Handshake"]}
                  - {label: "Texte", name: "text", widget: "string"}
              - {label: "Texte du bouton CTA", name: "ctaText", widget: "string"}
              - label: "SEO"
                name: "seo"
                widget: "object"
                fields:
                  - {label: "Titre SEO", name: "title", widget: "string", required: false}
                  - {label: "Description SEO", name: "description", widget: "text", required: false, pattern: ['^.{0,320}$', "La description idéale fait 155-160 caractères (max 320)"], hint: "Description pour le SEO - idéalement 155-160 caractères (max 320)"}
                  - {label: "Image SEO", name: "image", widget: "image", required: false}
                  - label: "Mots-clés SEO"
                    name: "keywords"
                    widget: "list"
                    required: false
                    field: {label: "Mot-clé", name: keyword, widget: string}
          - label: "English"
            name: "en"
            widget: "object"
            fields: *travailleursFields
          - label: "Italiano"
            name: "it"
            widget: "object"
            fields: *travailleursFields
          - label: "Nederlands"
            name: "nl"
            widget: "object"
            fields: *travailleursFields

  - name: "employeurs"
    label: "Page Employeurs"
    files:
      - file: "src/content/employeurs/employeurs.yml"
        name: "employeurs"
        label: "Contenu de la page Employeurs"
        i18n:
          structure: single_file
        fields:
          - label: "Français"
            name: "fr"
            widget: "object"
            fields: &employeursFields
              - {label: "Titre", name: "title", widget: "string"}
              - label: "Questions"
                name: "questions"
                widget: "list"
                field: {label: Question, name: question, widget: "string"}
              - {label: "Titre des prestations", name: "servicesTitle", widget: "string"}
              - label: "Prestations"
                name: "services"
                widget: "list"
                fields:
                  - {label: "Icône", name: "icon", widget: "select", options: ["FileText", "UserPlus", "Shield", "Search", "Handshake"]}
                  - {label: "Texte", name: "text", widget: "string"}
              - {label: "Texte du bouton CTA", name: "ctaText", widget: "string"}
              - label: "SEO"
                name: "seo"
                widget: "object"
                fields:
                  - {label: "Titre SEO", name: "title", widget: "string", required: false}
                  - {label: "Description SEO", name: "description", widget: "text", required: false, pattern: ['^.{0,320}$', "La description idéale fait 155-160 caractères (max 320)"], hint: "Description pour le SEO - idéalement 155-160 caractères (max 320)"}
                  - {label: "Image SEO", name: "image", widget: "image", required: false}
                  - label: "Mots-clés SEO"
                    name: "keywords"
                    widget: "list"
                    required: false
                    field: {label: "Mot-clé", name: keyword, widget: string}
          - label: "English"
            name: "en"
            widget: "object"
            fields: *employeursFields
          - label: "Italiano"
            name: "it"
            widget: "object"
            fields: *employeursFields
          - label: "Nederlands"
            name: "nl"
            widget: "object"
            fields: *employeursFields

  # Page Institutions Européennes
  - name: "europeennes"
    label: "Page Institutions Européennes"
    files:
      - file: "src/content/europeennes/europeennes.yml"
        name: "europeennes"
        label: "Contenu de la page Institutions Européennes"
        i18n:
          structure: single_file
        fields:
          - label: "Français"
            name: "fr"
            widget: "object"
            fields: &europeennesFields
              - {label: "Titre", name: "title", widget: "string"}
              - label: "Cartes de navigation"
                name: "navigationCards"
                widget: "object"
                fields:
                  - {label: "Agences", name: "agences", widget: "string"}
                  - {label: "Fonctionnaires", name: "fonctionnaires", widget: "string"}
              - label: "Section Agences"
                name: "agences"
                widget: "object"
                fields:
                  - {label: "Titre", name: "title", widget: "string"}
                  - {label: "Introduction", name: "intro", widget: "text"}
                  - {label: "Titre accompagnement", name: "accompagnementTitle", widget: "string"}
                  - label: "Accompagnement"
                    name: "accompagnement"
                    widget: "list"
                    summary: "{{fields.title}}"
                    fields:
                      - {label: "Sous-titre", name: "title", widget: "string"}
                      - label: "Éléments"
                        name: "items"
                        widget: "list"
                        field: {label: "Élément", name: "item", widget: "string"}
                  - {label: "Titre services", name: "servicesTitle", widget: "string"}
                  - label: "Services"
                    name: "services"
                    widget: "list"
                    fields:
                      - {label: "Icône", name: "icon", widget: "select", options: ["Search", "FileText", "Handshake", "BriefCase", "Shield"]}
                      - {label: "Texte", name: "text", widget: "string"}
              - label: "Section Fonctionnaires"
                name: "fonctionnaires"
                widget: "object"
                fields:
                  - {label: "Titre", name: "title", widget: "string"}
                  - {label: "Introduction", name: "intro", widget: "text"}
                  - {label: "Titre accompagnement", name: "accompagnementTitle", widget: "string"}
                  - label: "Accompagnement"
                    name: "accompagnement"
                    widget: "list"
                    field: {label: "Élément", name: "item", widget: "string"}
                  - {label: "Titre services", name: "servicesTitle", widget: "string"}
                  - label: "Services"
                    name: "services"
                    widget: "list"
                    fields:
                      - {label: "Icône", name: "icon", widget: "select", options: ["Search", "FileText", "Handshake", "BriefCase", "Shield"]}
                      - {label: "Texte", name: "text", widget: "string"}
              - {label: "Texte du bouton CTA", name: "ctaText", widget: "string"}
              - label: "SEO"
                name: "seo"
                widget: "object"
                fields:
                  - {label: "Titre SEO", name: "title", widget: "string", required: false}
                  - {label: "Description SEO", name: "description", widget: "text", required: false, pattern: ['^.{0,320}$', "La description idéale fait 155-160 caractères (max 320)"], hint: "Description pour le SEO - idéalement 155-160 caractères (max 320)"}
                  - {label: "Image SEO", name: "image", widget: "image", required: false}
                  - label: "Mots-clés SEO"
                    name: "keywords"
                    widget: "list"
                    required: false
                    field: {label: "Mot-clé", name: keyword, widget: string}
          - label: "English"
            name: "en"
            widget: "object"
            fields: *europeennesFields
          - label: "Italiano"
            name: "it"
            widget: "object"
            fields: *europeennesFields
          - label: "Nederlands"
            name: "nl"
            widget: "object"
            fields: *europeennesFields

  # Page Équipe
  - name: "profile"
    label: "Page Équipe"
    files:
      - file: "src/content/profile/profile.yml"
        name: "profile"
        label: "Profils de l'équipe"
        i18n:
          structure: single_file
        fields:
          # Images centralisées - upload une seule fois pour toutes les langues
          - label: "Photos de l'équipe (partagées entre toutes les langues)"
            name: "teamImages"
            widget: "list"
            summary: "{{fields.name}}"
            collapsed: false
            hint: "Téléchargez les photos ici une seule fois. Elles seront automatiquement utilisées pour toutes les langues."
            fields:
              - {label: "Nom de l'avocate", name: "name", widget: "string", hint: "Doit correspondre exactement au nom utilisé dans les profils"}
              - {label: "Photo", name: "image", widget: "image"}
          - label: "Adresses des profils (partagées entre toutes les langues)"
            name: "lawyerSlugs"
            widget: "list"
            summary: "{{fields.name}} → /equipe/{{fields.slug}}/"
            collapsed: false
            hint: "Adresse publique de chaque profil. Ne la modifiez pas une fois le profil en ligne : les liens existants cesseraient de fonctionner."
            fields:
              - {label: "Nom de l'avocate", name: "name", widget: "string", hint: "Doit correspondre exactement au nom utilisé dans les profils"}
              - {label: "Adresse du profil", name: "slug", widget: "string", pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', "Uniquement des minuscules, chiffres et tirets (ex. romain-archalaus)"]}
          - label: "Français"
            name: "fr"
            widget: "object"
            fields: &profileFields
              - label: "Avocates"
                name: "lawyers"
                widget: "list"
                summary: "{{fields.name}} - {{fields.title}}"
                fields:
                  - {label: "Nom", name: "name", widget: "string", hint: "Doit correspondre au nom dans 'Photos de l'équipe' pour lier l'image"}
                  - {label: "Titre", name: "title", widget: "string"}
                  - label: "Biographie"
                    name: "bio"
                    widget: "list"
                    field: {label: "Paragraphe", name: "paragraph", widget: "text"}
                  - label: "Langues"
                    name: "languages"
                    widget: "string"
                  - label: "Parcours"
                    name: "careerPath"
                    widget: "list"
                    fields:
                      - {label: "Année", name: "year", widget: "string"}
                      - {label: "Événement", name: "event", widget: "string"}
                  - label: "Conférences"
                    name: "conferences"
                    widget: "list"
                    field: {label: "Conférence", name: "conference", widget: "text"}
                  - label: "Publications"
                    name: "publications"
                    widget: "list"
                    fields:
                      - {label: "Date", name: "date", widget: "string"}
                      - {label: "Titre", name: "title", widget: "string"}
                      - {label: "Éditeur", name: "publisher", widget: "string"}
                      - label: "Co-auteurs"
                        name: "coAuthors"
                        widget: "list"
                        field: {label: "Auteur", name: "author", widget: "string"}
                  - label: "SEO"
                    name: "seo"
                    widget: "object"
                    collapsed: true
                    fields:
                      - {label: "Titre SEO", name: "title", widget: "string", required: false}
                      - {label: "Description SEO", name: "description", widget: "text", required: false, pattern: ['^.{0,320}$', "La description idéale fait 155-160 caractères (max 320)"]}
                      - {label: "Image SEO", name: "image", widget: "string", required: false}
                      - label: "Mots-clés SEO"
                        name: "keywords"
                        widget: "list"
                        required: false
                        field: {label: "Mot-clé", name: keyword, widget: string}
          - label: "English"
            name: "en"
            widget: "object"
            fields: *profileFields
          - label: "Italiano"
            name: "it"
            widget: "object"
            fields: *profileFields
          - label: "Nederlands"
            name: "nl"
            widget: "object"
            fields: *profileFields

  # Pages Honoraires
  - name: "honoraires"
    label: "Page Honoraires"
    files:
      - file: "src/content/honoraires/honoraires.yml"
        name: "honoraires"
        label: "Contenu de la page Honoraires"
        i18n:
          structure: single_file
        fields:
          - label: "Français"
            name: "fr"
            widget: "object"
            fields: &honorairesFields
              - {label: "Titre", name: "title", widget: "string"}
              - {label: "Sous-titre", name: "subtitle", widget: "string"}
              - label: "Transparence"
                name: "transparence"
                widget: "object"
                fields:
                  - {label: "Titre", name: "title", widget: "string"}
                  - {label: "Points", name: "points", widget: "list"}
              - label: "Prévisibilité"
                name: "previsibilite"
                widget: "object"
                fields:
                  - {label: "Titre", name: "title", widget: "string"}
                  - {label: "Contenu complet", name: "full_content", widget: "markdown", required: false}
              - label: "Assurance"
                name: "assurance"
                widget: "object"
                fields:
                  - {label: "Titre", name: "title", widget: "string"}
                  - {label: "Contenu", name: "content", widget: "text"}
              - label: "Exemples de formules forfaitaires"
                name: "forfaits"
                widget: "object"
                fields:
                  - {label: "Titre", name: "title", widget: "string", default: "Exemples de formules forfaitaires"}
                  - {label: "Introduction", name: "intro", widget: "text"}
                  - label: "Exemples"
                    name: "exemples"
                    widget: "list"
                    fields:
                      - {label: "Titre", name: "title", widget: "string"}
                      - {label: "Description", name: "description", widget: "text", required: false}
                      - {label: "Prix", name: "prix", widget: "string", required: false}
                      - label: "Services"
                        name: "services"
                        widget: "list"
                        required: false
                        field: {label: "Service", name: "service", widget: "string"}
                      - {label: "Note", name: "note", widget: "text", required: false}
                      - {label: "Condition", name: "condition", widget: "text", required: false}
                      - label: "Options"
                        name: "options"
                        widget: "list"
                        required: false
                        fields:
                          - {label: "Description", name: "description", widget: "string"}
                          - {label: "Prix", name: "prix", widget: "string"}
              - label: "Aide juridique"
                name: "aideJuridique"
                widget: "object"
                fields:
                  - {label: "Titre", name: "title", widget: "string", default: "Aide juridique"}
                  - {label: "Contenu", name: "content", widget: "markdown"}
          - label: "English"
            name: "en"
            widget: "object"
            fields: *honorairesFields
          - label: "Italiano"
            name: "it"
            widget: "object"
            fields: *honorairesFields
          - label: "Nederlands"
            name: "nl"
            widget: "object"
            fields: *honorairesFields

  # Pages légales
  - name: "legal-pages"
    label: "Pages Légales"
    files:
      - file: "src/content/legal/notice.yml"
        name: "legal-notice"
        label: "Mentions légales"
        i18n:
          structure: single_file
        fields:
          - label: "Français"
            name: "fr"
            widget: "object"
            fields: &legalFields
              - {label: "Titre", name: "title", widget: "string"}
              - label: "Sections"
                name: "sections"
                widget: "list"
                fields:
                  - {label: "Titre", name: "title", widget: "string"}
                  - {label: "Texte", name: "text", widget: "markdown"}
          - label: "English"
            name: "en"
            widget: "object"
            fields: *legalFields
          - label: "Italiano"
            name: "it"
            widget: "object"
            fields: *legalFields
          - label: "Nederlands"
            name: "nl"
            widget: "object"
            fields: *legalFields

      - file: "src/content/legal/privacy.yml"
        name: "privacy-policy"
        label: "Politique de confidentialité"
        i18n:
          structure: single_file
        fields:
          - label: "Français"
            name: "fr"
            widget: "object"
            fields: &privacyFields
              - {label: "Titre", name: "title", widget: "string"}
              - label: "Sections"
                name: "sections"
                widget: "list"
                fields:
                  - {label: "Titre", name: "title", widget: "string"}
                  - {label: "Texte", name: "text", widget: "markdown"}
          - label: "English"
            name: "en"
            widget: "object"
            fields: *privacyFields
          - label: "Italiano"
            name: "it"
            widget: "object"
            fields: *privacyFields
          - label: "Nederlands"
            name: "nl"
            widget: "object"
            fields: *privacyFields

      - file: "src/content/legal/legal-info.yml"
        name: "legal-info"
        label: "Infos légales & CGV"
        i18n:
          structure: single_file
        fields:
          - label: "Français"
            name: "fr"
            widget: "object"
            fields: &legalInfoFields
              - {label: "Titre", name: "title", widget: "string"}
              - label: "Sections"
                name: "sections"
                widget: "list"
                fields:
                  - {label: "Titre", name: "title", widget: "string"}
                  - {label: "Texte", name: "text", widget: "markdown"}
          - label: "English"
            name: "en"
            widget: "object"
            fields: *legalInfoFields
          - label: "Italiano"
            name: "it"
            widget: "object"
            fields: *legalInfoFields
          - label: "Nederlands"
            name: "nl"
            widget: "object"
            fields: *legalInfoFields

  # Collection Blog
  - &blogCollection
    name: "blog-fr"
    label: "Blog FR"
    folder: "src/content/blog/fr"
    create: true
    fields:
      - {label: "Titre", name: "title", widget: "string"}
      - {label: "Date de publication", name: "date", widget: "datetime"}
      - {label: "Auteur", name: "author", widget: "string"}
      - {label: "Image à la une", name: "thumbnail", widget: "image"}
      - {label: "Temps de lecture (en minutes)", name: "readTime", widget: "string", hint: "Entrez le nombre de minutes, par exemple: 5"}
      - label: "Catégories"
        name: "categories"
        widget: "list"
        allow_add: true
        min: 1
        field: {label: Catégorie, name: categorie, widget: string}
        hint: "Au moins une catégorie est requise."
      - label: "Points forts (optionnel)"
        name: "highlights"
        widget: "list"
        required: false
        field: 
          label: "Point"
          name: "point"
          widget: "text"
        hint: "Optionnel. Résumé en quelques points clés de l'article. Chaque point peut être sur plusieurs lignes. Ils apparaîtront dans un encadré au début de l'article."
      - {label: "Description SEO", name: "description", widget: "text", required: true, pattern: ['^.{0,320}$', "La description idéale fait 155-160 caractères (max 320)"], hint: "Description pour le SEO - idéalement 155-160 caractères (max 320)"}
      - label: "Mots-clés SEO (optionnel)"
        name: "keywords"
        widget: "list"
        required: false
        allow_add: true
        field: {label: "Mot-clé", name: keyword, widget: string}
        hint: "Optionnel. Ajoutez des mots-clés pertinents pour le SEO."
      - {label: "Contenu", name: "body", widget: "markdown"}

  - <<: *blogCollection
    name: "blog-en"
    label: "Blog EN"
    folder: "src/content/blog/en"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Author", name: "author", widget: "string"}
      - {label: "Featured Image", name: "thumbnail", widget: "image"}
      - {label: "Read Time (in minutes)", name: "readTime", widget: "string", hint: "Enter the number of minutes, e.g. 5"}
      - label: "Categories"
        name: "categories"
        hint: "At least one category is required."
      - label: "Highlights (optional)"
        name: "highlights"
        hint: "Optional. Summary of the article in a few key points. Each point can be multiple lines. They will appear in a box at the beginning of the article."
      - {label: "SEO Description", name: "description", widget: "text", required: true, pattern: ['^.{0,320}$', "Ideal description is 155-160 characters (max 320)"], hint: "SEO description - ideally 155-160 characters (max 320)"}
      - label: "SEO Keywords (optional)"
        name: "keywords"
        hint: "Optional. Add relevant keywords for SEO."
      - {label: "Body", name: "body", widget: "markdown"}

  - <<: *blogCollection
    name: "blog-it"
    label: "Blog IT"
    folder: "src/content/blog/it"
    fields:
      - {label: "Titolo", name: "title", widget: "string"}
      - {label: "Data di pubblicazione", name: "date", widget: "datetime"}
      - {label: "Autore", name: "author", widget: "string"}
      - {label: "Immagine in evidenza", name: "thumbnail", widget: "image"}
      - {label: "Tempo di lettura (in minuti)", name: "readTime", widget: "string", hint: "Inserisci il numero di minuti, ad esempio: 5"}
      - label: "Categorie"
        name: "categories"
        hint: "Almeno una categoria è richiesta."
      - label: "Punti salienti (opzionale)"
        name: "highlights"
        hint: "Opzionale. Riassunto dell'articolo in alcuni punti chiave. Ogni punto può essere su più righe. Appariranno in un riquadro all'inizio dell'articolo."
      - {label: "Descrizione SEO", name: "description", widget: "text", required: true, pattern: ['^.{0,320}$', "La descrizione ideale è di 155-160 caratteri (max 320)"], hint: "Descrizione SEO - idealmente 155-160 caratteri (max 320)"}
      - label: "Parole chiave SEO (opzionale)"
        name: "keywords"
        hint: "Opzionale. Aggiungi parole chiave rilevanti per il SEO."
      - {label: "Contenuto", name: "body", widget: "markdown"}

  - <<: *blogCollection
    name: "blog-nl"
    label: "Blog NL"
    folder: "src/content/blog/nl"

  # Configuration du site
  - name: "siteConfig"
    label: "Configuration"
    files:
      - file: "src/content/config/site-config.yml"
        name: "site-config"
        label: "Paramètres généraux"
        editor:
          preview: false
        i18n:
          structure: single_file
        fields:
          - label: "Visibilité de la section Blog"
            name: "sectionsVisibility"
            widget: "boolean"
            default: false
          
          - label: "Afficher le formulaire de contact"
            name: "showContactForm"
            widget: "boolean"
            default: true
            hint: "Active ou désactive le formulaire de contact sur la page Contact"
          
          - label: "Équipe d'avocates"
            name: "lawyers"
            widget: "list"
            summary: "{{fields.name}} - {{fields.email}}"
            collapsed: false
            description: >
              Informations de contact pour chaque avocate du cabinet.
              Ces informations apparaîtront partout sur le site (header, footer, page contact, etc.).
            fields:
              - label: "Nom"
                name: "name"
                widget: "string"
                hint: "Nom complet de l'avocate"
              
              - label: "Numéro de téléphone"
                name: "phone"
                widget: "string"
                hint: "Format international recommandé avec espaces (ex: +32 488 40 45 49)"
              
              - label: "Numéro WhatsApp"
                name: "whatsapp"
                widget: "string"
                hint: "Numéro sans espaces ni + pour WhatsApp (ex: 32488404549)"
              
              - label: "Adresse email"
                name: "email"
                widget: "string"
                hint: "Adresse email professionnelle"
              
              - label: "Profil LinkedIn"
                name: "linkedin"
                widget: "string"
                hint: "URL complète du profil LinkedIn"
              
              - label: "Lien calendrier Cal.com"
                name: "calendarLink"
                widget: "string"
                hint: "URL complète du calendrier Cal.com (ex: https://cal.com/username/meeting)"
                required: false
              
              - label: "Adresse du cabinet"
                name: "address"
                widget: "string"
                hint: "Adresse complète du cabinet"
          
          - label: "SEO et apparence"
            name: "seo"
            widget: "object"
            summary: "Paramètres d'apparence et de référencement"
            collapsed: false
            description: >
              Ces paramètres influencent la visibilité de votre site sur les moteurs de recherche
              et son apparence lors du partage sur les réseaux sociaux. Configuration par défaut optimisée
              et fonctionnelle. Toute modification requiert une bonne compréhension des pratiques SEO.
            fields:
              - label: "Image principale pour les réseaux sociaux"
                name: "defaultSocialImage"
                widget: "image"
                required: false
                default: "/assets/images/default-social-image.png"
                hint: "Image qui apparaîtra lorsque votre site est partagé sur les réseaux sociaux (format recommandé: 1200x630px)"
                media_folder: "public"
                public_folder: "/"
              
              - label: "Description globale du site"
                name: "siteDescription"
                widget: "text"
                required: false
                default: "Christine Rizzo - Avocate en droit du travail à Bruxelles. Expertise pour employeurs et travailleurs."
                pattern: ['^.{0,320}$', "La description idéale fait 155-160 caractères (max 320)"]
                hint: "Description générale du site pour le référencement - idéalement 155-160 caractères (max 320)"

              - label: "Nom du site"
                name: "siteName"
                widget: "string" 
                required: false
                default: "Christine Rizzo - Avocate"
                hint: "Nom qui apparaîtra dans les métadonnées et les partages sur réseaux sociaux"
              
              - label: "URL du site"
                name: "siteUrl"
                widget: "string"
                required: false
                default: "https://rizzo-michiels.be"
                hint: "URL complète du site (utilisée pour les liens canoniques et les partages)"
      
      - file: "src/content/navigation/navigation.yml"
        name: "site-navigation"
        label: "Menus et liens"
        i18n:
          structure: single_file
        fields:
          - label: "Français"
            name: "fr"
            widget: "object"
            fields: &navigationFields
              - label: "Header"
                name: "header"
                widget: "object"
                fields:
                  - label: "Liens principaux"
                    name: "mainLinks"
                    widget: "list"
                    fields:
                      - {label: "Libellé", name: "label", widget: "string"}
                      - {label: "URL", name: "url", widget: "string", hint: "Utilisez une URL relative comme /fr/contact ou #section pour les ancres"}
                      - {label: "Sous-menu", name: "hasDropdown", widget: "boolean", default: false}
                      - label: "Éléments du sous-menu"
                        name: "dropdownItems"
                        widget: "list"
                        required: false
                        fields:
                          - {label: "Libellé", name: "label", widget: "string"}
                          - {label: "URL", name: "url", widget: "string"}
                        hint: "Ajouter des éléments au sous-menu (seulement si Sous-menu est activé)"
                  - label: "Texte du bouton Contact"
                    name: "contactButtonText"
                    widget: "string"
                    default: "ME CONTACTER"

              - label: "Footer"
                name: "footer"
                widget: "object"
                fields:
                  - label: "Titre de la section Menu"
                    name: "menuTitle"
                    widget: "string"
                    default: "Menu"
                  - label: "Titre de la section Contact"
                    name: "contactTitle"
                    widget: "string"
                    default: "Contact"
                  - label: "Liens légaux"
                    name: "legalLinks"
                    widget: "list"
                    fields:
                      - {label: "Libellé", name: "label", widget: "string"}
                      - {label: "URL", name: "url", widget: "string"}
                  - label: "Titre de la section Eco-design"
                    name: "ecoDesignTitle"
                    widget: "string"
                    default: "Site web écologique"
                  - {label: "Texte du lien Eco-design", name: "ecoDesignText", widget: "string", default: "Score d'éco-conception"}
                  - {label: "URL du lien Eco-design", name: "ecoDesignUrl", widget: "string", default: "https://www.websitecarbon.com/website/rizzo-michiels-be-fr/"}
                  - label: "Pwablo (non modifiable)"
                    name: "pwablo"
                    widget: "object"
                    collapsed: true
                    fields:
                      - {label: "Texte Pwablo", name: "pwabloText", widget: "string", default: "Design by Pwablo", readonly: true}
                      - {label: "URL Pwablo", name: "pwabloUrl", widget: "string", default: "https://pwablo.be", readonly: true}
                    hint: "Ces champs sont réservés à l'agence Pwablo et ne peuvent pas être modifiés."
                  - label: "Texte du copyright"
                    name: "copyrightText"
                    widget: "string"
                    default: "Christine Rizzo"
                    hint: "Entrez le nom ou l'entité pour le copyright. L'année et le symbole © sont ajoutés automatiquement."

          - label: "English"
            name: "en"
            widget: "object"
            fields: *navigationFields

          - label: "Italiano"
            name: "it"
            widget: "object"
            fields: *navigationFields
          - label: "Nederlands"
            name: "nl"
            widget: "object"
            fields: *navigationFields
      
      - file: "src/content/ui-translations/ui-translations.yml"
        name: "ui-translations"
        label: "Textes de l'interface"
        i18n:
          structure: single_file
        fields:
          - label: "Français"
            name: "fr"
            widget: "object"
            fields: &uiTranslationsFields
              - {label: "Lire la suite", name: "readMore", widget: "string", default: "Lire la suite"}
              - {label: "Titre du blog", name: "blogTitle", widget: "string", default: "Articles"}
              - {label: "Aucun article trouvé", name: "noArticles", widget: "string", default: "Aucun article trouvé."}
              - {label: "Toutes catégories", name: "allCategories", widget: "string", default: "Toutes catégories"}
              - label: "En-tête"
                name: "header"
                widget: "object"
                collapsed: true
                fields:
                  - {label: "Prendre rendez-vous avec", name: "bookWith", widget: "string", default: "Prendre rendez-vous avec", hint: "Précède le nom de l'avocate dans le menu de réservation."}
                  - {label: "Formulaire de contact", name: "contactForm", widget: "string", default: "Formulaire de contact", hint: "Dernière entrée du menu de réservation."}
              - label: "Bloc contact (CTA)"
                name: "cta"
                widget: "object"
                collapsed: true
                fields:
                  - {label: "Titre", name: "title", widget: "string", default: "Contactez-nous"}
                  - {label: "Email", name: "email", widget: "string", default: "EMAIL"}
                  - {label: "Rendez-vous", name: "appointment", widget: "string", default: "RDV"}
                  - {label: "Appel", name: "call", widget: "string", default: "APPEL"}
                  - {label: "Réserver", name: "bookAction", widget: "string", default: "Réserver"}
              - label: "Formulaire de contact"
                name: "contactForm"
                widget: "object"
                collapsed: true
                fields:
                  - {label: "Titre du formulaire", name: "formTitle", widget: "string", default: "Envoyez-nous un message"}
                  - {label: "Libellé nom", name: "nameLabel", widget: "string", default: "Nom complet *"}
                  - {label: "Exemple nom", name: "namePlaceholder", widget: "string", default: "Jean Dupont"}
                  - {label: "Libellé email", name: "emailLabel", widget: "string", default: "Email *"}
                  - {label: "Exemple email", name: "emailPlaceholder", widget: "string", default: "jean.dupont@exemple.com"}
                  - {label: "Libellé téléphone", name: "phoneLabel", widget: "string", default: "Téléphone"}
                  - {label: "Exemple téléphone", name: "phonePlaceholder", widget: "string", default: "+32 4XX XX XX XX"}
                  - {label: "Libellé objet", name: "subjectLabel", widget: "string", default: "Objet *"}
                  - {label: "Exemple objet", name: "subjectPlaceholder", widget: "string", default: "Objet de votre demande"}
                  - {label: "Libellé message", name: "messageLabel", widget: "string", default: "Message *"}
                  - {label: "Exemple message", name: "messagePlaceholder", widget: "string", default: "Décrivez votre situation ou votre question..."}
                  - {label: "Bouton d'envoi", name: "submitButton", widget: "string", default: "Envoyer le message"}
                  - {label: "Envoi en cours", name: "sending", widget: "string", default: "Envoi en cours..."}
                  - {label: "Message de succès", name: "successMessage", widget: "string", default: "Merci pour votre message. Nous vous répondrons dans les plus brefs délais."}
                  - {label: "Message d'erreur", name: "errorMessage", widget: "string", default: "Une erreur s'est produite. Veuillez réessayer ou nous contacter directement."}
              - label: "Page de confirmation d'envoi"
                name: "contactSuccess"
                widget: "object"
                collapsed: true
                fields:
                  - {label: "Titre (onglet)", name: "title", widget: "string", default: "Message envoyé avec succès"}
                  - {label: "Titre affiché", name: "heading", widget: "string", default: "Merci pour votre message !"}
                  - {label: "Message", name: "message", widget: "string", default: "Nous avons bien reçu votre message et nous vous répondrons dans les plus brefs délais."}
                  - {label: "Information de délai", name: "info", widget: "string", default: "Un membre de notre équipe examinera votre demande et vous contactera sous 24 à 48 heures ouvrables."}
                  - {label: "Retour à l'accueil", name: "backToHome", widget: "string", default: "Retour à l'accueil"}
                  - {label: "Envoyer un autre message", name: "backToContact", widget: "string", default: "Envoyer un autre message"}
              - label: "Blog"
                name: "blog"
                widget: "object"
                collapsed: true
                fields:
                  - {label: "Titre SEO", name: "seoTitle", widget: "string", default: "Blog | Christine Rizzo - Avocate en droit du travail à Bruxelles"}
                  - {label: "Description SEO", name: "seoDescription", widget: "text", default: "Découvrez les derniers articles sur le droit du travail en Belgique."}
                  - {label: "Mots-clés SEO", name: "seoKeywords", widget: "list", field: {label: "Mot-clé", name: "keyword", widget: "string"}}
                  - {label: "Retour aux articles", name: "backToArticles", widget: "string", default: "← Retour aux articles"}
                  - {label: "Points clés", name: "keyPoints", widget: "string", default: "Points clés :"}
                  - {label: "Temps de lecture", name: "readTime", widget: "string", default: "temps de lecture"}
              - label: "Équipe"
                name: "team"
                widget: "object"
                collapsed: true
                fields:
                  - {label: "Titre", name: "title", widget: "string", default: "L'équipe"}
                  - {label: "Voir le profil", name: "viewProfile", widget: "string", default: "Découvrir le profil complet"}
                  - {label: "Retour à l'équipe", name: "backToTeam", widget: "string", default: "Retour à l'équipe"}
                  - {label: "Langues", name: "languages", widget: "string", default: "Langues"}
                  - {label: "Parcours", name: "career", widget: "string", default: "Parcours"}
                  - {label: "Conférences", name: "conferences", widget: "string", default: "Conférences"}
                  - {label: "Publications", name: "publications", widget: "string", default: "Publications"}
                  - {label: "En collaboration avec", name: "inCollaborationWith", widget: "string", default: "En collaboration avec"}
              - label: "Page 404"
                name: "notFound"
                widget: "object"
                collapsed: true
                fields:
                  - {label: "Titre", name: "title", widget: "string", default: "Page non trouvée - 404"}
                  - {label: "Message", name: "message", widget: "string", default: "La page que vous recherchez n'existe pas ou a été déplacée."}
                  - {label: "Retour à l'accueil", name: "backHome", widget: "string", default: "Retour à l'accueil"}

          - label: "English"
            name: "en"
            widget: "object"
            fields: *uiTranslationsFields

          - label: "Italiano"
            name: "it"
            widget: "object"
            fields: *uiTranslationsFields 
          - label: "Nederlands"
            name: "nl"
            widget: "object"
            fields: *uiTranslationsFields
