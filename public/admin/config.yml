backend:
  name: git-gateway
  branch: test-avril-2025

media_folder: "public/assets/images"
public_folder: "/assets/images"

collections:
  # Page d'accueil
  - name: "home"
    label: "Page Accueil"
    files:
      - file: "src/content/home/home.yml"
        name: "home"
        label: "Contenu de la page d'accueil"
        i18n:
          structure: single_file
        fields:
          - label: "Français"
            name: "fr"
            widget: "object"
            fields: &homeFields
              - label: "Hero"
                name: "hero"
                widget: "object"
                fields:
                  - {label: "Titre", name: "title", widget: "string"}
                  - {label: "Sous-titre", name: "subtitle", widget: "string"}
                  - {label: "Description", name: "description", widget: "text"}
                  - {label: "CTA", name: "cta", widget: "string"}
              
              - label: "Expertise"
                name: "expertise"
                widget: "object"
                fields:
                  - {label: "Titre", name: "title", widget: "string"}
                  - {label: "Description", name: "description", widget: "text"}
                  - label: "Travailleurs"
                    name: "travailleurs"
                    widget: "object"
                    fields:
                      - {label: "Titre", name: "title", widget: "string"}
                      - {label: "Description", name: "description", widget: "text"}
                      - {label: "CTA", name: "cta", widget: "string"}
                  - label: "Employeurs"
                    name: "employeurs"
                    widget: "object"
                    fields:
                      - {label: "Titre", name: "title", widget: "string"}
                      - {label: "Description", name: "description", widget: "text"}
                      - {label: "CTA", name: "cta", widget: "string"}
                  - label: "Honoraires"
                    name: "honoraires"
                    widget: "object"
                    fields:
                      - {label: "Introduction", name: "intro", widget: "text"}
                      - {label: "Texte du lien", name: "linkText", widget: "string"}
                      - label: "Avantages"
                        name: "advantages"
                        widget: "list"
                        field: {label: "Avantage", name: "advantage", widget: "string"}

              - label: "Profil"
                name: "profil"
                widget: "object"
                fields:
                  - {label: "Titre", name: "title", widget: "string"}
                  - {label: "Description", name: "description", widget: "text"}
                  - {label: "CTA", name: "cta", widget: "string"}

              - {label: "Titre des articles", name: "articlesTitle", widget: "string"}
              - {label: "Voir tous les articles", name: "viewAllArticles", widget: "string"}

              - label: "SEO"
                name: "seo"
                widget: "object"
                fields:
                  - {label: "Titre", name: "title", widget: "string"}
                  - {label: "Description", name: "description", widget: "text"}
                  - {label: "Mots-clés", name: "keywords", widget: "list"}
                  - {label: "Image", name: "image", widget: "string"}

          - label: "English"
            name: "en"
            widget: "object"
            fields: *homeFields
          - label: "Italiano"
            name: "it"
            widget: "object"
            fields: *homeFields

  # Pages Services
  - name: "travailleurs"
    label: "Page Travailleurs"
    files:
      - file: "src/content/travailleurs/travailleurs.yml"
        name: "travailleurs"
        label: "Contenu de la page Travailleurs"
        i18n:
          structure: single_file
        fields:
          - label: "Français"
            name: "fr"
            widget: "object"
            fields: &travailleursFields
              - {label: "Titre", name: "title", widget: "string"}
              - label: "Questions"
                name: "questions"
                widget: "list"
                field: {label: Question, name: question, widget: "string"}
              - {label: "Titre des services", name: "servicesTitle", widget: "string"}
              - label: "Services"
                name: "services"
                widget: "list"
                fields:
                  - {label: "Icône", name: "icon", widget: "select", options: ["BriefCase", "Shield", "FileText", "Handshake"]}
                  - {label: "Texte", name: "text", widget: "string"}
              - {label: "Texte du bouton CTA", name: "ctaText", widget: "string"}
              - label: "SEO"
                name: "seo"
                widget: "object"
                fields:
                  - {label: "Titre SEO", name: "title", widget: "string", required: false}
                  - {label: "Description SEO", name: "description", widget: "text", required: false, pattern: ['^.{0,160}$', "La description doit faire 160 caractères maximum"], hint: "Description courte pour le SEO (max 160 caractères)"}
                  - {label: "Image SEO", name: "image", widget: "image", required: false}
                  - label: "Mots-clés SEO"
                    name: "keywords"
                    widget: "list"
                    required: false
                    field: {label: "Mot-clé", name: keyword, widget: string}
          - label: "English"
            name: "en"
            widget: "object"
            fields: *travailleursFields
          - label: "Italiano"
            name: "it"
            widget: "object"
            fields: *travailleursFields

  - name: "employeurs"
    label: "Page Employeurs"
    files:
      - file: "src/content/employeurs/employeurs.yml"
        name: "employeurs"
        label: "Contenu de la page Employeurs"
        i18n:
          structure: single_file
        fields:
          - label: "Français"
            name: "fr"
            widget: "object"
            fields: &employeursFields
              - {label: "Titre", name: "title", widget: "string"}
              - label: "Questions"
                name: "questions"
                widget: "list"
                field: {label: Question, name: question, widget: "string"}
              - label: "Support Additionnel"
                name: "additionalSupport"
                widget: "object"
                fields:
                  - {label: "Introduction", name: "intro", widget: "text"}
                  - label: "Points"
                    name: "points"
                    widget: "list"
                    field: {label: "Point", name: "point", widget: "string"}
              - {label: "Titre des prestations", name: "servicesTitle", widget: "string"}
              - label: "Prestations"
                name: "services"
                widget: "list"
                fields:
                  - {label: "Icône", name: "icon", widget: "select", options: ["FileText", "UserPlus", "Shield", "Search", "Handshake"]}
                  - {label: "Texte", name: "text", widget: "string"}
              - {label: "Texte du bouton CTA", name: "ctaText", widget: "string"}
              - label: "SEO"
                name: "seo"
                widget: "object"
                fields:
                  - {label: "Titre SEO", name: "title", widget: "string", required: false}
                  - {label: "Description SEO", name: "description", widget: "text", required: false, pattern: ['^.{0,160}$', "La description doit faire 160 caractères maximum"], hint: "Description courte pour le SEO (max 160 caractères)"}
                  - {label: "Image SEO", name: "image", widget: "image", required: false}
                  - label: "Mots-clés SEO"
                    name: "keywords"
                    widget: "list"
                    required: false
                    field: {label: "Mot-clé", name: keyword, widget: string}
          - label: "English"
            name: "en"
            widget: "object"
            fields: *employeursFields
          - label: "Italiano"
            name: "it"
            widget: "object"
            fields: *employeursFields

  # Page Profil
  - name: "profile"
    label: "Page Profil"
    files:
      - file: "src/content/profile/profile.yml"
        name: "profile"
        label: "Contenu du profil"
        i18n:
          structure: single_file
        fields:
          - label: "Français"
            name: "fr"
            widget: "object"
            fields: &profileFields
              - {label: "Nom", name: "name", widget: "string"}
              - {label: "Titre", name: "title", widget: "string"}
              - {label: "Image", name: "image", widget: "image"}
              - label: "Biographie"
                name: "bio"
                widget: "list"
                field: {label: "Paragraphe", name: "paragraph", widget: "text"}
              - label: "Langues"
                name: "languages"
                widget: "string"
              - label: "Parcours"
                name: "careerPath"
                widget: "list"
                fields:
                  - {label: "Année", name: "year", widget: "string"}
                  - {label: "Événement", name: "event", widget: "string"}
              - label: "Conférences"
                name: "conferences"
                widget: "list"
                field: {label: "Conférence", name: "conference", widget: "text"}
              - label: "Publications"
                name: "publications"
                widget: "list"
                fields:
                  - {label: "Date", name: "date", widget: "string"}
                  - {label: "Titre", name: "title", widget: "string"}
                  - {label: "Éditeur", name: "publisher", widget: "string"}
                  - label: "Co-auteurs"
                    name: "coAuthors"
                    widget: "list"
                    field: {label: "Auteur", name: "author", widget: "string"}
          - label: "English"
            name: "en"
            widget: "object"
            fields: *profileFields
          - label: "Italiano"
            name: "it"
            widget: "object"
            fields: *profileFields

  # Pages Honoraires
  - name: "honoraires"
    label: "Page Honoraires"
    files:
      - file: "src/content/honoraires/honoraires.yml"
        name: "honoraires"
        label: "Contenu de la page Honoraires"
        i18n:
          structure: single_file
        fields:
          - label: "Français"
            name: "fr"
            widget: "object"
            fields: &honorairesFields
              - {label: "Titre", name: "title", widget: "string"}
              - {label: "Sous-titre", name: "subtitle", widget: "string"}
              - label: "Tarifs"
                name: "tarifs"
                widget: "object"
                fields:
                  - {label: "Titre", name: "title", widget: "string"}
                  - {label: "Travailleur", name: "travailleur", widget: "string"}
                  - {label: "Employeur", name: "employeur", widget: "string"}
              - label: "Transparence"
                name: "transparence"
                widget: "object"
                fields:
                  - {label: "Titre", name: "title", widget: "string"}
                  - {label: "Points", name: "points", widget: "list"}
              - label: "Prévisibilité"
                name: "previsibilite"
                widget: "object"
                fields:
                  - {label: "Titre", name: "title", widget: "string"}
                  - {label: "Contenu", name: "content", widget: "text"}
                  - {label: "Points", name: "points", widget: "list"}
              - label: "Assurance"
                name: "assurance"
                widget: "object"
                fields:
                  - {label: "Titre", name: "title", widget: "string"}
                  - {label: "Contenu", name: "content", widget: "text"}
              - label: "Exemples de formules forfaitaires"
                name: "forfaits"
                widget: "object"
                fields:
                  - {label: "Titre", name: "title", widget: "string", default: "Exemples de formules forfaitaires"}
                  - {label: "Introduction", name: "intro", widget: "text"}
                  - label: "Exemples"
                    name: "exemples"
                    widget: "list"
                    fields:
                      - {label: "Titre", name: "title", widget: "string"}
                      - {label: "Description", name: "description", widget: "text", required: false}
                      - {label: "Prix", name: "prix", widget: "string"}
              - label: "Aide juridique"
                name: "aideJuridique"
                widget: "object"
                fields:
                  - {label: "Titre", name: "title", widget: "string", default: "Aide juridique"}
                  - {label: "Contenu", name: "content", widget: "markdown"}
          - label: "English"
            name: "en"
            widget: "object"
            fields: *honorairesFields
          - label: "Italiano"
            name: "it"
            widget: "object"
            fields: *honorairesFields

  # Pages légales
  - name: "legal-pages"
    label: "Pages Légales"
    files:
      - file: "src/content/legal/legal.yml"
        name: "legal-notice"
        label: "Mentions légales"
        i18n:
          structure: single_file
        fields:
          - label: "Français"
            name: "fr"
            widget: "object"
            fields: &legalFields
              - {label: "Titre", name: "title", widget: "string"}
              - label: "Sections"
                name: "sections"
                widget: "list"
                fields:
                  - {label: "Titre", name: "title", widget: "string"}
                  - {label: "Texte", name: "text", widget: "markdown"}
          - label: "English"
            name: "en"
            widget: "object"
            fields: *legalFields
          - label: "Italiano"
            name: "it"
            widget: "object"
            fields: *legalFields

      - file: "src/content/privacy/privacy.yml"
        name: "privacy-policy"
        label: "Politique de confidentialité"
        i18n:
          structure: single_file
        fields:
          - label: "Français"
            name: "fr"
            widget: "object"
            fields: &privacyFields
              - {label: "Titre", name: "title", widget: "string"}
              - label: "Sections"
                name: "sections"
                widget: "list"
                fields:
                  - {label: "Titre", name: "title", widget: "string"}
                  - {label: "Texte", name: "text", widget: "markdown"}
          - label: "English"
            name: "en"
            widget: "object"
            fields: *privacyFields
          - label: "Italiano"
            name: "it"
            widget: "object"
            fields: *privacyFields

      - file: "src/content/legal-info/legal-info.yml"
        name: "legal-info"
        label: "Infos légales & CGV"
        i18n:
          structure: single_file
        fields:
          - label: "Français"
            name: "fr"
            widget: "object"
            fields: &legalInfoFields
              - {label: "Titre", name: "title", widget: "string"}
              - label: "Sections"
                name: "sections"
                widget: "list"
                fields:
                  - {label: "Titre", name: "title", widget: "string"}
                  - {label: "Texte", name: "text", widget: "markdown"}
          - label: "English"
            name: "en"
            widget: "object"
            fields: *legalInfoFields
          - label: "Italiano"
            name: "it"
            widget: "object"
            fields: *legalInfoFields

  # Collection Blog
  - &blogCollection
    name: "blog-fr"
    label: "Blog FR"
    folder: "src/content/blog/fr"
    create: true
    fields:
      - {label: "Titre", name: "title", widget: "string"}
      - {label: "Date de publication", name: "date", widget: "datetime"}
      - {label: "Auteur", name: "author", widget: "string"}
      - {label: "Image à la une", name: "thumbnail", widget: "image"}
      - {label: "Temps de lecture (en minutes)", name: "readTime", widget: "string", hint: "Entrez le nombre de minutes, par exemple: 5"}
      - label: "Catégories"
        name: "categories"
        widget: "list"
        allow_add: true
        min: 1
        field: {label: Catégorie, name: categorie, widget: string}
        hint: "Au moins une catégorie est requise."
      - label: "Points forts (optionnel)"
        name: "highlights"
        widget: "list"
        required: false
        field: 
          label: "Point"
          name: "point"
          widget: "text"
        hint: "Optionnel. Résumé en quelques points clés de l'article. Chaque point peut être sur plusieurs lignes. Ils apparaîtront dans un encadré au début de l'article."
      - {label: "Description SEO", name: "description", widget: "text", required: true, pattern: ['^.{0,160}$', "La description doit faire 160 caractères maximum"], hint: "Description courte pour le SEO (max 160 caractères)"}
      - label: "Mots-clés SEO (optionnel)"
        name: "keywords"
        widget: "list"
        required: false
        allow_add: true
        field: {label: "Mot-clé", name: keyword, widget: string}
        hint: "Optionnel. Ajoutez des mots-clés pertinents pour le SEO."
      - {label: "Contenu", name: "body", widget: "markdown"}

  - <<: *blogCollection
    name: "blog-en"
    label: "Blog EN"
    folder: "src/content/blog/en"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Author", name: "author", widget: "string"}
      - {label: "Featured Image", name: "thumbnail", widget: "image"}
      - {label: "Read Time (in minutes)", name: "readTime", widget: "string", hint: "Enter the number of minutes, e.g. 5"}
      - label: "Categories"
        name: "categories"
        hint: "At least one category is required."
      - label: "Highlights (optional)"
        name: "highlights"
        hint: "Optional. Summary of the article in a few key points. Each point can be multiple lines. They will appear in a box at the beginning of the article."
      - {label: "SEO Description", name: "description", widget: "text", required: true, pattern: ['^.{0,160}$', "Description must be 160 characters or less"], hint: "Short description for SEO (max 160 characters)"}
      - label: "SEO Keywords (optional)"
        name: "keywords"
        hint: "Optional. Add relevant keywords for SEO."
      - {label: "Body", name: "body", widget: "markdown"}

  - <<: *blogCollection
    name: "blog-it"
    label: "Blog IT"
    folder: "src/content/blog/it"
    fields:
      - {label: "Titolo", name: "title", widget: "string"}
      - {label: "Data di pubblicazione", name: "date", widget: "datetime"}
      - {label: "Autore", name: "author", widget: "string"}
      - {label: "Immagine in evidenza", name: "thumbnail", widget: "image"}
      - {label: "Tempo di lettura (in minuti)", name: "readTime", widget: "string", hint: "Inserisci il numero di minuti, ad esempio: 5"}
      - label: "Categorie"
        name: "categories"
        hint: "Almeno una categoria è richiesta."
      - label: "Punti salienti (opzionale)"
        name: "highlights"
        hint: "Opzionale. Riassunto dell'articolo in alcuni punti chiave. Ogni punto può essere su più righe. Appariranno in un riquadro all'inizio dell'articolo."
      - {label: "Descrizione SEO", name: "description", widget: "text", required: true, pattern: ['^.{0,160}$', "La descrizione deve essere di massimo 160 caratteri"], hint: "Breve descrizione per SEO (max 160 caratteri)"}
      - label: "Parole chiave SEO (opzionale)"
        name: "keywords"
        hint: "Opzionale. Aggiungi parole chiave rilevanti per il SEO."
      - {label: "Contenuto", name: "body", widget: "markdown"}

  # Configuration du site
  - name: "siteConfig"
    label: "Configuration"
    files:
      - file: "src/content/config/site-config.yml"
        name: "site-config"
        label: "Paramètres généraux"
        editor:
          preview: false
        i18n:
          structure: single_file
        fields:
          - label: "Visibilité de la section Blog"
            name: "sectionsVisibility"
            widget: "boolean"
            default: false
            hint: "Activer ou désactiver l'affichage de la section Articles/Blog sur la page d'accueil et dans la navigation"
          
          - label: "Lien de réservation Cal.com"
            name: "calendarLink"
            widget: "string"
            default: "https://cal.com/c.rizzo-avocat.be/rendez-vous?duration=15"
            hint: "IMPORTANT: Si vous modifiez l'URL de votre calendrier dans Cal.com, vous devez également mettre à jour ce lien. Inversement, si vous modifiez ce lien, assurez-vous qu'il correspond exactement à votre URL Cal.com. Toute différence entre les deux empêchera le système de prise de rendez-vous de fonctionner."
          
          - label: "SEO et apparence"
            name: "seo"
            widget: "object"
            summary: "Paramètres d'apparence et de référencement"
            collapsed: false
            description: >
              Ces paramètres influencent la visibilité de votre site sur les moteurs de recherche
              et son apparence lors du partage sur les réseaux sociaux. Configuration par défaut optimisée
              et fonctionnelle. Toute modification requiert une bonne compréhension des pratiques SEO.
            fields:
              - label: "Autoriser l'indexation"
                name: "allowIndexing"
                widget: "boolean"
                default: false
                hint: "IMPORTANT: Activer pour que le site soit indexé par les moteurs de recherche. Désactiver pendant le développement ou les tests."
              
              - label: "Image principale pour les réseaux sociaux"
                name: "defaultSocialImage"
                widget: "image"
                required: false
                default: "/assets/images/default-social-image.png"
                hint: "Image qui apparaîtra lorsque votre site est partagé sur les réseaux sociaux (format recommandé: 1200x630px)"
                media_folder: "public"
                public_folder: "/"
              
              - label: "Description globale du site"
                name: "siteDescription"
                widget: "text"
                required: false
                default: "Christine Rizzo - Avocate en droit du travail à Bruxelles. Expertise pour employeurs et travailleurs."
                pattern: ['^.{0,160}$', "La description doit faire 160 caractères maximum"]
                hint: "Description générale du site pour le référencement (max 160 caractères)"

              - label: "Nom du site"
                name: "siteName"
                widget: "string" 
                required: false
                default: "Christine Rizzo - Avocate"
                hint: "Nom qui apparaîtra dans les métadonnées et les partages sur réseaux sociaux"
              
              - label: "URL du site"
                name: "siteUrl"
                widget: "string"
                required: false
                default: "https://crizzo-avocate.be"
                hint: "URL complète du site (utilisée pour les liens canoniques et les partages)"
      
      - file: "src/content/navigation/navigation.yml"
        name: "site-navigation"
        label: "Menus et liens"
        i18n:
          structure: single_file
        fields:
          - label: "Français"
            name: "fr"
            widget: "object"
            fields: &navigationFields
              - label: "Header"
                name: "header"
                widget: "object"
                fields:
                  - label: "Liens principaux"
                    name: "mainLinks"
                    widget: "list"
                    fields:
                      - {label: "Libellé", name: "label", widget: "string"}
                      - {label: "URL", name: "url", widget: "string", hint: "Utilisez une URL relative comme /fr/contact ou #section pour les ancres"}
                      - {label: "Sous-menu", name: "hasDropdown", widget: "boolean", default: false}
                      - label: "Éléments du sous-menu"
                        name: "dropdownItems"
                        widget: "list"
                        required: false
                        fields:
                          - {label: "Libellé", name: "label", widget: "string"}
                          - {label: "URL", name: "url", widget: "string"}
                        hint: "Ajouter des éléments au sous-menu (seulement si Sous-menu est activé)"
                  - label: "Texte du bouton Contact"
                    name: "contactButtonText"
                    widget: "string"
                    default: "ME CONTACTER"

              - label: "Footer"
                name: "footer"
                widget: "object"
                fields:
                  - label: "Titre de la section Menu"
                    name: "menuTitle"
                    widget: "string"
                    default: "Menu"
                  - label: "Titre de la section Contact"
                    name: "contactTitle"
                    widget: "string"
                    default: "Contact"
                  - label: "Coordonnées"
                    name: "contactInfo"
                    widget: "object"
                    fields:
                      - {label: "Téléphone", name: "phone", widget: "string", default: "+32 488 40 45 49"}
                      - {label: "Email", name: "email", widget: "string", default: "c.rizzo@avocat.be"}
                      - {label: "LinkedIn", name: "linkedin", widget: "string", default: "https://www.linkedin.com/in/christine-rizzo/"}
                      - {label: "Adresse", name: "address", widget: "string", default: "Chaussée de Waterloo 1151, 1180 Bruxelles"}
                  - label: "Liens légaux"
                    name: "legalLinks"
                    widget: "list"
                    fields:
                      - {label: "Libellé", name: "label", widget: "string"}
                      - {label: "URL", name: "url", widget: "string"}
                  - label: "Titre de la section Eco-design"
                    name: "ecoDesignTitle"
                    widget: "string"
                    default: "Site web écologique"
                  - {label: "Texte du lien Eco-design", name: "ecoDesignText", widget: "string", default: "Score d'éco-conception"}
                  - {label: "URL du lien Eco-design", name: "ecoDesignUrl", widget: "string", default: "https://www.websitecarbon.com/website/crizzo-avocate-be-fr/"}
                  - label: "Pwablo (non modifiable)"
                    name: "pwablo"
                    widget: "object"
                    collapsed: true
                    fields:
                      - {label: "Texte Pwablo", name: "pwabloText", widget: "string", default: "Design by Pwablo", readonly: true}
                      - {label: "URL Pwablo", name: "pwabloUrl", widget: "string", default: "https://pwablo.be", readonly: true}
                    hint: "Ces champs sont réservés à l'agence Pwablo et ne peuvent pas être modifiés."
                  - label: "Texte du copyright"
