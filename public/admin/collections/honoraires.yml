- name: "honoraires"
  label: "Pages Tarifs et Honoraires"
  files:
    - file: "src/content/honoraires/honoraires.yml"
      name: "honoraires"
      label: "Page principale des honoraires"
      i18n:
        structure: single_file
      fields:
        - label: "Français"
          name: "fr"
          widget: "object"
          fields: &honorairesFields
            - {label: "Titre", name: "title", widget: "string"}
            - {label: "Sous-titre", name: "subtitle", widget: "string"}
            - label: "Tarifs"
              name: "tarifs"
              widget: "object"
              fields:
                - {label: "Titre", name: "title", widget: "string"}
                - {label: "Travailleur", name: "travailleur", widget: "string"}
                - {label: "Employeur", name: "employeur", widget: "string"}
            - label: "Transparence"
              name: "transparence"
              widget: "object"
              fields:
                - {label: "Titre", name: "title", widget: "string"}
                - {label: "Points", name: "points", widget: "list"}
            - label: "Prévisibilité"
              name: "previsibilite"
              widget: "object"
              fields:
                - {label: "Titre", name: "title", widget: "string"}
                - {label: "Contenu", name: "content", widget: "text"}
                - {label: "Points", name: "points", widget: "list"}
            - label: "Assurance"
              name: "assurance"
              widget: "object"
              fields:
                - {label: "Titre", name: "title", widget: "string"}
                - {label: "Contenu", name: "content", widget: "text"}
            - label: "Exemples de formules forfaitaires"
              name: "forfaits"
              widget: "object"
              fields:
                - {label: "Titre", name: "title", widget: "string", default: "Exemples de formules forfaitaires"}
                - {label: "Introduction", name: "intro", widget: "text"}
                - label: "Exemples"
                  name: "exemples"
                  widget: "list"
                  fields:
                    - {label: "Titre", name: "title", widget: "string"}
                    - {label: "Description", name: "description", widget: "text", required: false}
                    - {label: "Prix", name: "prix", widget: "string"}
            - label: "Aide juridique"
              name: "aideJuridique"
              widget: "object"
              fields:
                - {label: "Titre", name: "title", widget: "string", default: "Aide juridique"}
                - {label: "Contenu", name: "content", widget: "markdown"}
        - label: "English"
          name: "en"
          widget: "object"
          fields: *honorairesFields
        - label: "Italiano"
          name: "it"
          widget: "object"
          fields: *honorairesFields 