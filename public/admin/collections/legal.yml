- name: "legal"
  label: "Mentions légales"
  files:
    - file: "src/content/legal/legal.yml"
      name: "legal"
      label: "Contenu des mentions légales"
      i18n:
        structure: single_file
      fields:
        - label: "Français"
          name: "fr"
          widget: "object"
          fields: &legalFields
            - {label: "Titre", name: "title", widget: "string"}
            - label: "Sections"
              name: "sections"
              widget: "list"
              fields:
                - {label: "Titre", name: "title", widget: "string"}
                - {label: "Texte", name: "text", widget: "markdown"}
        - label: "English"
          name: "en"
          widget: "object"
          fields: *legalFields
        - label: "Italiano"
          name: "it"
          widget: "object"
          fields: *legalFields

