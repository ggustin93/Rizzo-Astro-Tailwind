- name: "profile"
  label: "Page Profil"
  files:
    - file: "src/content/profile/profile.yml"
      name: "profile"
      label: "Contenu du profil"
      i18n:
        structure: single_file
      fields:
        - label: "Français"
          name: "fr"
          widget: "object"
          fields: &profileFields
            - {label: "Nom", name: "name", widget: "string"}
            - {label: "Titre", name: "title", widget: "string"}
            - {label: "Image", name: "image", widget: "image"}
            - label: "Biographie"
              name: "bio"
              widget: "list"
              field: {label: "Paragraphe", name: "paragraph", widget: "text"}
            - label: "Langues"
              name: "languages"
              widget: "string"
            - label: "Parcours"
              name: "careerPath"
              widget: "list"
              fields:
                - {label: "Année", name: "year", widget: "string"}
                - {label: "Événement", name: "event", widget: "string"}
            - label: "Conférences"
              name: "conferences"
              widget: "list"
              field: {label: "Conférence", name: "conference", widget: "text"}
            - label: "Publications"
              name: "publications"
              widget: "list"
              fields:
                - {label: "Date", name: "date", widget: "string"}
                - {label: "Titre", name: "title", widget: "string"}
                - {label: "Éditeur", name: "publisher", widget: "string"}
                - label: "Co-auteurs"
                  name: "coAuthors"
                  widget: "list"
                  field: {label: "Auteur", name: "author", widget: "string"}
        - label: "English"
          name: "en"
          widget: "object"
          fields: *profileFields
        - label: "Italiano"
          name: "it"
          widget: "object"
          fields: *profileFields 